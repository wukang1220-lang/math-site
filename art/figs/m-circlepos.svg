<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 243" role="img">
  <title>點、直線與圓的位置關係</title>
  <line x1="120" y1="9" x2="120" y2="233" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round"/>
  <line x1="240" y1="9" x2="240" y2="233" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round"/>
  <line x1="9" y1="120" x2="351" y2="120" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round"/>
  <g transform="translate(0 0)">
    <text x="60" y="20" font-size="13" text-anchor="middle" fill="var(--fig-ink)">圓內：d &lt; r</text>
    <circle cx="53" cy="76" r="29" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <line x1="53" y1="76" x2="53" y2="47" stroke="var(--fig-soft)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="53" y1="76" x2="70" y2="76" stroke="var(--ic)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="53" cy="76" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="70" cy="76" r="2.5" fill="var(--fig-ink)"/>
    <text x="43" y="93" font-size="13" text-anchor="middle" fill="var(--fig-ink)">O</text>
    <text x="69" y="93" font-size="13" text-anchor="middle" fill="var(--fig-ink)">P</text>
    <text x="44" y="63" font-size="13" text-anchor="middle" fill="var(--fig-ink)">r</text>
    <text x="61.5" y="69" font-size="13" text-anchor="middle" fill="var(--fig-ink)">d</text>
  </g>
  <g transform="translate(120 0)">
    <text x="60" y="20" font-size="13" text-anchor="middle" fill="var(--fig-ink)">圓上：d = r</text>
    <circle cx="53" cy="76" r="29" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <line x1="53" y1="76" x2="53" y2="47" stroke="var(--fig-soft)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="53" y1="76" x2="82" y2="76" stroke="var(--ic)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="53" cy="76" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="82" cy="76" r="2.5" fill="var(--fig-ink)"/>
    <text x="43" y="93" font-size="13" text-anchor="middle" fill="var(--fig-ink)">O</text>
    <text x="85" y="95" font-size="13" text-anchor="middle" fill="var(--fig-ink)">P</text>
    <text x="44" y="63" font-size="13" text-anchor="middle" fill="var(--fig-ink)">r</text>
    <text x="67.5" y="69" font-size="13" text-anchor="middle" fill="var(--fig-ink)">d</text>
  </g>
  <g transform="translate(240 0)">
    <text x="60" y="20" font-size="13" text-anchor="middle" fill="var(--fig-ink)">圓外：d &gt; r</text>
    <circle cx="53" cy="76" r="29" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <line x1="53" y1="76" x2="53" y2="47" stroke="var(--fig-soft)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="53" y1="76" x2="101" y2="76" stroke="var(--ic)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="53" cy="76" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="101" cy="76" r="2.5" fill="var(--fig-ink)"/>
    <text x="43" y="93" font-size="13" text-anchor="middle" fill="var(--fig-ink)">O</text>
    <text x="101" y="95" font-size="13" text-anchor="middle" fill="var(--fig-ink)">P</text>
    <text x="44" y="63" font-size="13" text-anchor="middle" fill="var(--fig-ink)">r</text>
    <text x="69" y="69" font-size="13" text-anchor="middle" fill="var(--fig-ink)">d</text>
  </g>
  <g transform="translate(0 0)">
    <text x="60" y="140" font-size="13" text-anchor="middle" fill="var(--fig-ink)">不相交：d &gt; r</text>
    <circle cx="53" cy="188" r="29" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <line x1="53" y1="188" x2="24" y2="188" stroke="var(--fig-soft)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="11" y1="228" x2="109" y2="228" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="53" y1="188" x2="53" y2="228" stroke="var(--ic)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 3"/>
    <polyline points="53,220.5 60.5,220.5 60.5,228" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="53" cy="188" r="2.5" fill="var(--fig-ink)"/>
    <text x="65" y="181" font-size="13" text-anchor="middle" fill="var(--fig-ink)">O</text>
    <text x="37" y="181" font-size="13" text-anchor="middle" fill="var(--fig-ink)">r</text>
    <text x="67" y="207" font-size="13" text-anchor="middle" fill="var(--fig-ink)">d</text>
  </g>
  <g transform="translate(120 0)">
    <text x="60" y="140" font-size="13" text-anchor="middle" fill="var(--fig-ink)">相切：d = r</text>
    <circle cx="53" cy="188" r="29" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <line x1="53" y1="188" x2="24" y2="188" stroke="var(--fig-soft)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="11" y1="217" x2="109" y2="217" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="53" y1="188" x2="53" y2="217" stroke="var(--ic)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 3"/>
    <polyline points="53,209.5 60.5,209.5 60.5,217" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="53" cy="188" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="53" cy="217" r="2.5" fill="var(--fig-ink)"/>
    <text x="65" y="181" font-size="13" text-anchor="middle" fill="var(--fig-ink)">O</text>
    <text x="37" y="181" font-size="13" text-anchor="middle" fill="var(--fig-ink)">r</text>
    <text x="67" y="201.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">d</text>
  </g>
  <g transform="translate(240 0)">
    <text x="60" y="140" font-size="13" text-anchor="middle" fill="var(--fig-ink)">交於兩點：d &lt; r</text>
    <circle cx="53" cy="188" r="29" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <line x1="53" y1="188" x2="24" y2="188" stroke="var(--fig-soft)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="11" y1="205" x2="109" y2="205" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="53" y1="188" x2="53" y2="205" stroke="var(--ic)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 3"/>
    <polyline points="53,197.5 60.5,197.5 60.5,205" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="53" cy="188" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="29.5" cy="205" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="76.5" cy="205" r="2.5" fill="var(--fig-ink)"/>
    <text x="65" y="181" font-size="13" text-anchor="middle" fill="var(--fig-ink)">O</text>
    <text x="37" y="181" font-size="13" text-anchor="middle" fill="var(--fig-ink)">r</text>
    <text x="67" y="195.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">d</text>
  </g>
</svg>
