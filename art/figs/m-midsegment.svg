<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 187" role="img">
  <title>連結三角形兩邊與梯形兩腰的中點，可以得到各自的中線段。</title>
  <line x1="180" y1="9" x2="180" y2="178" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round"/>
  <g transform="translate(0 0)">
    <text x="90" y="18" font-size="13" text-anchor="middle" fill="var(--fig-ink)">三角形兩邊中點連線</text>
    <polygon points="86,44 29,132 152,132" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="57.5" y1="88" x2="119" y2="88" stroke="var(--ic)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="74.7" y1="67.9" x2="68.8" y2="64.1" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="46.2" y1="111.9" x2="40.3" y2="108.1" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="104.1" y1="62.3" x2="98.5" y2="66.5" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106.5" y1="65.5" x2="100.9" y2="69.7" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="137.1" y1="106.3" x2="131.5" y2="110.5" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="139.5" y1="109.5" x2="133.9" y2="113.7" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="86" cy="44" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="29" cy="132" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="152" cy="132" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="57.5" cy="88" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="119" cy="88" r="2.5" fill="var(--fig-ink)"/>
    <text x="86" y="36" font-size="13" text-anchor="middle" fill="var(--fig-ink)">A</text>
    <text x="24" y="150" font-size="13" text-anchor="middle" fill="var(--fig-ink)">B</text>
    <text x="156" y="150" font-size="13" text-anchor="middle" fill="var(--fig-ink)">C</text>
    <text x="46" y="92" font-size="13" text-anchor="middle" fill="var(--fig-ink)">D</text>
    <text x="127" y="86" font-size="13" text-anchor="middle" fill="var(--fig-ink)">E</text>
    <text x="90" y="176" font-size="12" text-anchor="middle" fill="var(--fig-ink)">DE ∥ BC，DE = ½BC</text>
  </g>
  <g transform="translate(180 0)">
    <text x="90" y="18" font-size="13" text-anchor="middle" fill="var(--fig-ink)">梯形中線</text>
    <polygon points="56,50 117,50 148,132 26,132" fill="var(--fig-c)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="41" y1="91" x2="132.5" y2="91" stroke="var(--ic)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="51.8" y1="71.7" x2="45.2" y2="69.3" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36.8" y1="112.7" x2="30.2" y2="110.3" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="127.3" y1="67.4" x2="120.8" y2="69.9" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="128.7" y1="71.1" x2="122.2" y2="73.6" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="142.8" y1="108.4" x2="136.3" y2="110.9" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="144.2" y1="112.1" x2="137.7" y2="114.6" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="41" cy="91" r="2.5" fill="var(--fig-ink)"/>
    <circle cx="132.5" cy="91" r="2.5" fill="var(--fig-ink)"/>
    <text x="86.5" y="42" font-size="13" text-anchor="middle" fill="var(--fig-ink)">上底</text>
    <text x="87" y="150" font-size="13" text-anchor="middle" fill="var(--fig-ink)">下底</text>
    <text x="90" y="176" font-size="12" text-anchor="middle" fill="var(--fig-ink)">中線 = (上底 + 下底) ÷ 2</text>
  </g>
</svg>
