<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 188" role="img">
  <title>正方體與圓柱的展開圖呈現各面的形狀與相接方式。</title>
  <line x1="180" y1="9" x2="180" y2="178" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round"/>
  <g transform="translate(0 0)">
    <text x="90" y="18" font-size="13" text-anchor="middle" fill="var(--fig-ink)">正方體的展開圖</text>
    <polygon points="74.5,35 105.5,35 105.5,66 136.5,66 136.5,97 105.5,97 105.5,159 74.5,159 74.5,97 43.5,97 43.5,66 74.5,66" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="74.5" y1="66" x2="105.5" y2="66" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
    <line x1="74.5" y1="97" x2="105.5" y2="97" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
    <line x1="74.5" y1="128" x2="105.5" y2="128" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
    <line x1="74.5" y1="66" x2="74.5" y2="97" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
    <line x1="105.5" y1="66" x2="105.5" y2="97" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
  </g>
  <g transform="translate(180 0)">
    <text x="90" y="18" font-size="13" text-anchor="middle" fill="var(--fig-ink)">圓柱的展開圖</text>
    <rect x="30.3" y="73" width="119.4" height="47" fill="var(--fig-c)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <circle cx="90" cy="54" r="19" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <circle cx="90" cy="139" r="19" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <line x1="30.3" y1="73" x2="149.7" y2="73" stroke="var(--ic)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="90" y1="54" x2="109" y2="54" stroke="var(--fig-soft)" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="90" cy="54" r="2.5" fill="var(--fig-ink)"/>
    <text x="50" y="65" font-size="13" text-anchor="middle" fill="var(--fig-ink)">2πr</text>
    <text x="160" y="101" font-size="13" text-anchor="middle" fill="var(--fig-ink)">h</text>
    <text x="97" y="49" font-size="13" text-anchor="middle" fill="var(--fig-ink)">r</text>
    <text x="90" y="177" font-size="13" text-anchor="middle" fill="var(--fig-ink)">側面積 = 2πr × h</text>
  </g>
</svg>
