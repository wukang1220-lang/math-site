<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 241" role="img">
  <title>畢氏定理</title>
  <polygon points="148,87 148,135 100,135 100,87" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="148,135 212,135 212,199 148,199" fill="var(--fig-b)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="212,135 148,87 196,23 260,71" fill="var(--fig-c)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="148,87 148,135 212,135" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="148,127 156,127 156,135" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="160" y="113" font-size="13" text-anchor="middle" fill="var(--fig-ink)">a</text>
  <text x="176" y="128" font-size="13" text-anchor="middle" fill="var(--fig-ink)">b</text>
  <text x="188" y="102" font-size="13" text-anchor="middle" fill="var(--fig-ink)">c</text>
  <text x="124" y="115.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">a²</text>
  <text x="180" y="171.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">b²</text>
  <text x="204" y="83.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">c²</text>
  <text x="180" y="225" font-size="14" text-anchor="middle" fill="var(--fig-ink)">直角三角形：a² + b² = c²</text>
</svg>
