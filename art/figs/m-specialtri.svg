<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 175" role="img">
  <title>兩種特殊直角三角形的邊長比由角度決定。</title>
  <line x1="180" y1="9" x2="180" y2="165" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round"/>
  <g transform="translate(0 0)">
    <text x="90" y="18" font-size="13" text-anchor="middle" fill="var(--fig-ink)">30°－60°－90°</text>
    <polygon points="29,54 29,119 141.6,119" fill="var(--fig-a)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="29,111.5 36.5,111.5 36.5,119" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M29 71 A17 17 0 0 0 43.7 62.5" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M122.5 108 A22 22 0 0 0 119.6 119" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="91" font-size="13" text-anchor="middle" fill="var(--fig-ink)">60°</text>
    <text x="102" y="114" font-size="13" text-anchor="middle" fill="var(--fig-ink)">30°</text>
    <text x="16" y="91" font-size="13" text-anchor="middle" fill="var(--fig-ink)">1</text>
    <text x="85" y="137" font-size="13" text-anchor="middle" fill="var(--fig-ink)">√3</text>
    <text x="92" y="80" font-size="13" text-anchor="middle" fill="var(--fig-ink)">2</text>
    <text x="90" y="163" font-size="13" text-anchor="middle" fill="var(--fig-ink)">邊長比 1 : √3 : 2</text>
  </g>
  <g transform="translate(180 0)">
    <text x="90" y="18" font-size="13" text-anchor="middle" fill="var(--fig-ink)">45°－45°－90°</text>
    <polygon points="38,39 38,119 118,119" fill="var(--fig-c)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="38,111.5 45.5,111.5 45.5,119" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M38 62 A23 23 0 0 0 54.3 55.3" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M101.7 102.7 A23 23 0 0 0 95 119" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="41.5" y1="79" x2="34.5" y2="79" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="78" y1="115.5" x2="78" y2="122.5" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="53" y="71" font-size="13" text-anchor="middle" fill="var(--fig-ink)">45°</text>
    <text x="82" y="113" font-size="13" text-anchor="middle" fill="var(--fig-ink)">45°</text>
    <text x="23" y="84" font-size="13" text-anchor="middle" fill="var(--fig-ink)">1</text>
    <text x="78" y="137" font-size="13" text-anchor="middle" fill="var(--fig-ink)">1</text>
    <text x="91" y="79" font-size="13" text-anchor="middle" fill="var(--fig-ink)">√2</text>
    <text x="90" y="163" font-size="13" text-anchor="middle" fill="var(--fig-ink)">邊長比 1 : 1 : √2</text>
  </g>
</svg>
