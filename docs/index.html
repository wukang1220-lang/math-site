，8<i>x<\/i> − 4 = 3<i>x<\/i> + 6，<i>x<\/i> = 2。"},{"q":"地圖的比例尺是 1 : 50000，地圖上 4 公分代表實際距離幾公里？","o":["0.2","2","20","200"],"a":1,"e":"實際距離 = 4 × 50000 = 200000 公分 = 2 公里。"},{"q":"一杯飲料中果汁與水的比是 2 : 3，果汁有 120 毫升，水有多少毫升？","o":["80","180","200","300"],"a":1,"e":"2 : 3 = 120 : <i>x<\/i>，2<i>x<\/i> = 360，<i>x<\/i> = 180。"},{"q":"若 <i>x<\/i> : <i>y<\/i> = 3 : 4，則 (<i>x<\/i> + <i>y<\/i>) : <i>y<\/i> 是多少？","o":["7 : 4","4 : 7","7 : 3","3 : 7"],"a":0,"e":"設 <i>x<\/i> = 3<i>r<\/i>、<i>y<\/i> = 4<i>r<\/i>，(<i>x<\/i> + <i>y<\/i>) : <i>y<\/i> = 7<i>r<\/i> : 4<i>r<\/i> = 7 : 4。"}],"fig":[],"w":"","sum":"理解比與比值，用「外項乘積 = 內項乘積」解比例式。"},"2-3-2":{"rows":[{"h":"正比","li":["<i>x<\/i> 變化時 <i>y<\/i> 也跟著變，而且 <i>y<\/i> 一直是 <i>x<\/i> 的 <i>k<\/i> 倍（<i>k<\/i> ≠ 0），即 <i>y<\/i> = <i>kx<\/i>，就說 <i>y<\/i> 與 <i>x<\/i> 成<strong class=\"kw\">正比<\/strong>。","也可以說<strong class=\"kw\">比值 <span class=\"fr\"><span><i>y<\/i><\/span><span><i>x<\/i><\/span><\/span> = <i>k<\/i><\/strong> 固定不變。","求值：<strong class=\"kw\">設 <i>y<\/i> = <i>kx<\/i><\/strong>，用一組已知的 <i>x<\/i>、<i>y<\/i> 求出 <i>k<\/i>，再求所要的值。","成正比時，<strong class=\"kw\"><i>y<\/i><sub>1<\/sub> : <i>y<\/i><sub>2<\/sub> = <i>x<\/i><sub>1<\/sub> : <i>x<\/i><sub>2<\/sub><\/strong>。"],"tip":[]},{"h":"反比","li":["<i>x<\/i> 與 <i>y<\/i> 的<strong class=\"kw\">乘積固定<\/strong>，<i>xy<\/i> = <i>k<\/i>（<i>k<\/i> ≠ 0），就說 <i>y<\/i> 與 <i>x<\/i> 成<strong class=\"kw\">反比<\/strong>，也可寫成 <i>y<\/i> = <span class=\"fr\"><span><i>k<\/i><\/span><span><i>x<\/i><\/span><\/span>。","求值：<strong class=\"kw\">設 <i>xy<\/i> = <i>k<\/i><\/strong>，用一組已知的 <i>x<\/i>、<i>y<\/i> 求出 <i>k<\/i>。","成反比時，<strong class=\"kw\"><i>x<\/i><sub>1<\/sub> <i>y<\/i><sub>1<\/sub> = <i>x<\/i><sub>2<\/sub> <i>y<\/i><sub>2<\/sub><\/strong>，也就是 <i>y<\/i><sub>1<\/sub> : <i>y<\/i><sub>2<\/sub> = <i>x<\/i><sub>2<\/sub> : <i>x<\/i><sub>1<\/sub>。"],"tip":["<i>x<\/i> + <i>y<\/i> = <i>k<\/i>（<i>k<\/i> ≠ 0）時，<i>x<\/i> 與 <i>y<\/i> 既不成正比，也不成反比。"]},{"h":"生活中的例子","li":["單價固定時，總價與數量<strong class=\"kw\">成正比<\/strong>。","路程固定時，速率與所需時間<strong class=\"kw\">成反比<\/strong>。","工作總量固定、每人效率相同時，人數與完成天數<strong class=\"kw\">成反比<\/strong>。"],"tip":[]}],"ex":[{"q":"<i>y<\/i> 與 <i>x<\/i> 成反比，<i>x<\/i> = 4 時 <i>y<\/i> = 9，求 <i>x<\/i> = 6 時的 <i>y<\/i>。","a":["<i>xy<\/i> = 4 × 9 = 36","<i>x<\/i> = 6 時，<i>y<\/i> = 36 ÷ 6 = 6"]},{"q":"<i>y<\/i> 與 <i>x<\/i> 成正比，<i>x<\/i> = 6 時 <i>y<\/i> = 15，求 <i>x<\/i> = 10 時的 <i>y<\/i>。","a":["<i>k<\/i> = 15 ÷ 6 = <span class=\"fr\"><span>5<\/span><span>2<\/span><\/span>，所以 <i>y<\/i> = <span class=\"fr\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i>","<i>x<\/i> = 10 時，<i>y<\/i> = 25"]},{"q":"從家到學校，騎車每分鐘 300 公尺要 8 分鐘；走路每分鐘 80 公尺，要幾分鐘？","a":["路程固定，速率與時間成反比：300 × 8 = 80 × <i>t<\/i>","<i>t<\/i> = 2400 ÷ 80 = 30 分鐘"]}],"qs":[{"q":"<i>y<\/i> 與 <i>x<\/i> 成正比，<i>x<\/i> = 3 時 <i>y<\/i> = 12。<i>x<\/i> = 5 時 <i>y<\/i> 是多少？","o":["7.2","15","20","60"],"a":2,"e":"<i>k<\/i> = 12 ÷ 3 = 4，<i>y<\/i> = 4 × 5 = 20。"},{"q":"下列哪一種關係中，<i>y<\/i> 與 <i>x<\/i> 成反比？","o":["面積 24 的長方形，長是 <i>x<\/i>、寬是 <i>y<\/i>","每枝 15 元的鉛筆買 <i>x<\/i> 枝，共 <i>y<\/i> 元","正方形的邊長是 <i>x<\/i>，周長是 <i>y<\/i>","兩數的和是 10，一數是 <i>x<\/i>、另一數是 <i>y<\/i>"],"a":0,"e":"長 × 寬 = 24，乘積是固定且不為 0 的數，所以成反比。鉛筆、周長都是正比；和固定兩者都不是。"},{"q":"6 人做一件工作要 10 天。如果要 4 天完成，需要幾人？（每人效率相同）","o":["2.4","12","15","24"],"a":2,"e":"工作總量 6 × 10 = 60（人．天），人數 × 天數固定：60 ÷ 4 = 15 人。"},{"q":"<i>y<\/i> 與 <i>x<\/i> 成正比，且 <i>x<\/i> = −2 時 <i>y<\/i> = 8，<i>y<\/i> 與 <i>x<\/i> 的關係式是什麼？","o":["<i>y<\/i> = −4<i>x<\/i>","<i>y<\/i> = 4<i>x<\/i>","<i>xy<\/i> = −16","<i>y<\/i> = −<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span><i>x<\/i>"],"a":0,"e":"<i>k<\/i> = 8 ÷ (−2) = −4，所以 <i>y<\/i> = −4<i>x<\/i>。"},{"q":"<i>y<\/i> 與 <i>x<\/i> 成正比，<i>x<\/i> = 4 時 <i>y<\/i> = 10，<i>y<\/i> 與 <i>x<\/i> 的關係式是哪一個？","o":["<i>y<\/i> = <span class=\"fr\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i>","<i>y<\/i> = <span class=\"fr\"><span>2<\/span><span>5<\/span><\/span><i>x<\/i>","<i>xy<\/i> = 40","<i>y<\/i> = <i>x<\/i> + 6"],"a":0,"e":"<i>k<\/i> = 10 ÷ 4 = <span class=\"fr\"><span>5<\/span><span>2<\/span><\/span>，所以 <i>y<\/i> = <span class=\"fr\"><span>5<\/span><span>2<\/span><\/span><i>x<\/i>。"},{"q":"<i>y<\/i> 與 <i>x<\/i> 成反比，<i>x<\/i> = 3 時 <i>y<\/i> = 8，則 <i>x<\/i> = 6 時 <i>y<\/i> 是多少？","o":["2","4","12","16"],"a":1,"e":"<i>xy<\/i> = 24，<i>x<\/i> = 6 時 <i>y<\/i> = 24 ÷ 6 = 4。"},{"q":"下列哪一個式子表示 <i>y<\/i> 與 <i>x<\/i> 成正比？","o":["<i>y<\/i> = 7<i>x<\/i>","<i>y<\/i> = 7<i>x<\/i> + 1","<i>xy<\/i> = 7","<i>y<\/i> = <span class=\"fr\"><span>7<\/span><span><i>x<\/i><\/span><\/span>"],"a":0,"e":"正比的形式是 <i>y<\/i> = <i>kx<\/i>（<i>k<\/i> 是不為 0 的常數）；多了常數 1 就不是正比，<i>xy<\/i> = 7 是反比。"},{"q":"下列哪一個式子表示 <i>y<\/i> 與 <i>x<\/i> 成反比？","o":["<i>xy<\/i> = 12","<i>y<\/i> = 12<i>x<\/i>","<i>x<\/i> + <i>y<\/i> = 12","<i>y<\/i> = <i>x<\/i> − 12"],"a":0,"e":"乘積是固定且不為 0 的數（<i>xy<\/i> = 12），所以成反比。"},{"q":"汽車以固定速率行駛，2 小時行駛 150 公里，5 小時行駛幾公里？","o":["60","300","375","750"],"a":2,"e":"速率固定時距離與時間成正比：150 ÷ 2 × 5 = 375。"},{"q":"從甲地到乙地，時速 60 公里要 3 小時，時速 90 公里要幾小時？","o":["1.5","2","3","4.5"],"a":1,"e":"路程固定，速率與時間成反比：60 × 3 = 90 × <i>t<\/i>，<i>t<\/i> = 2。"},{"q":"正方形的周長 <i>y<\/i> 與邊長 <i>x<\/i> 有什麼關係？","o":["成正比，<i>y<\/i> = 4<i>x<\/i>","成反比，<i>xy<\/i> = 4","既不成正比也不成反比","成正比，<i>y<\/i> = <i>x<\/i> + 4"],"a":0,"e":"周長 = 4 × 邊長，比值固定為 4，成正比。"},{"q":"若 <i>y<\/i> 與 <i>x<\/i> 成正比，當 <i>x<\/i>（不為 0）變為原來的 3 倍時，<i>y<\/i> 變為原來的幾倍？","o":["3 倍","<span class=\"fr\"><span>1<\/span><span>3<\/span><\/span> 倍","9 倍","不變"],"a":0,"e":"<i>y<\/i> = <i>kx<\/i>，<i>x<\/i> 乘 3 時 <i>y<\/i> 也乘 3。"},{"q":"若 <i>y<\/i> 與 <i>x<\/i> 成反比，當 <i>x<\/i>（不為 0）變為原來的 2 倍時，<i>y<\/i> 變為原來的幾倍？","o":["<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> 倍","2 倍","4 倍","不變"],"a":0,"e":"<i>xy<\/i> 固定，<i>x<\/i> 乘 2 時 <i>y<\/i> 要除以 2。"},{"q":"一桶水同時打開 4 個出水速率相同且固定的水龍頭，6 小時放完。改成只打開其中 3 個，要幾小時放完？","o":["4.5","6","8","9"],"a":2,"e":"總量固定，水龍頭數與時間成反比：4 × 6 = 3 × <i>t<\/i>，<i>t<\/i> = 8。"},{"q":"<i>y<\/i> 與 <i>x<\/i> 成正比，<i>x<\/i> = 2 時 <i>y<\/i> = −6，則 <i>x<\/i> = −5 時 <i>y<\/i> 是多少？","o":["−15","−10","10","15"],"a":3,"e":"<i>k<\/i> = −6 ÷ 2 = −3，<i>y<\/i> = −3 × (−5) = 15。"}],"fig":[],"w":"propo","sum":"分辨比值固定的正比與乘積固定的反比。","wo":""},"2-4-1":{"rows":[{"h":"不等式","li":["含有 &gt;、&lt;、≥、≤、≠ 的式子叫做<strong class=\"kw\">不等式<\/strong>。","只含一個未知數，而且未知數的次方是 1 的不等式，叫做<strong class=\"kw\">一元一次不等式<\/strong>，例如 3<i>x<\/i> − 1 &gt; 8。"],"tip":[]},{"h":"文字與不等號","li":["大於、超過、多於、高於 → &gt;；小於、不足、<strong class=\"kw\">未滿<\/strong>、少於 → &lt;。","<strong class=\"kw\">至少<\/strong>、不小於、不低於、以上（含）→ ≥；<strong class=\"kw\">至多<\/strong>、不大於、不超過、以下（含）→ ≤。"],"tip":[]},{"h":"不等式的解與圖示","li":["代入後能使不等式成立的數，都是它的<strong class=\"kw\">解<\/strong>；一元一次不等式通常有無限多個解。","在數線上畫解：包含端點用<strong class=\"kw\">實心點<\/strong>，不含端點用<strong class=\"kw\">空心點<\/strong>，再往左或往右畫線。","例：<i>x<\/i> ≥ 2 在 2 畫實心點、往右；<i>x<\/i> &lt; −1 在 −1 畫空心點、往左；−1 &lt; <i>x<\/i> ≤ 3 畫兩端點之間。"],"tip":[]},{"h":"運算性質","li":["兩邊同加或同減一個數，不等號<strong class=\"kw\">方向不變<\/strong>。","兩邊同乘或同除一個<strong class=\"kw\">正數<\/strong>，方向不變。","兩邊同乘或同除一個<strong class=\"kw\">負數<\/strong>，方向要<strong class=\"kw\">改變<\/strong>：若 <i>a<\/i> &gt; <i>b<\/i>，則 −2<i>a<\/i> &lt; −2<i>b<\/i>。"],"tip":[]}],"ex":[{"q":"用不等式表示「<i>x<\/i> 的 3 倍減 4 不超過 11」，並求出 <i>x<\/i> 的範圍。","a":["不超過就是 ≤：3<i>x<\/i> − 4 ≤ 11","3<i>x<\/i> ≤ 15，<i>x<\/i> ≤ 5"]},{"q":"用不等式表示「某數 <i>x<\/i> 的 4 倍減 3 大於 9」，並求出 <i>x<\/i> 的範圍。","a":["4<i>x<\/i> − 3 &gt; 9","4<i>x<\/i> &gt; 12，<i>x<\/i> &gt; 3"]},{"q":"若 <i>a<\/i> &gt; <i>b<\/i>，比較 3 − 2<i>a<\/i> 和 3 − 2<i>b<\/i> 的大小。","a":["兩邊乘 −2，方向改變：−2<i>a<\/i> &lt; −2<i>b<\/i>","兩邊加 3，方向不變：3 − 2<i>a<\/i> &lt; 3 − 2<i>b<\/i>"]}],"qs":[{"q":"「某數 <i>x<\/i> 的 2 倍再加 5，至少是 17」寫成不等式是哪一個？","o":["2<i>x<\/i> + 5 ≥ 17","2<i>x<\/i> + 5 &gt; 17","2<i>x<\/i> + 5 ≤ 17","2(<i>x<\/i> + 5) ≥ 17"],"a":0,"e":"「至少」包含等於，用 ≥；「2 倍再加 5」是 2<i>x<\/i> + 5。"},{"q":"若 <i>a<\/i> &lt; <i>b<\/i>，下列何者正確？","o":["−3<i>a<\/i> &gt; −3<i>b<\/i>","<i>a<\/i> − 2 &gt; <i>b<\/i> − 2","<span class=\"fr\"><span><i>a<\/i><\/span><span>4<\/span><\/span> &gt; <span class=\"fr\"><span><i>b<\/i><\/span><span>4<\/span><\/span>","<i>a<\/i> + 5 &gt; <i>b<\/i> + 5"],"a":0,"e":"兩邊同乘負數 −3，不等號方向要改變。其他選項方向都不應改變。"},{"q":"數線上在 −2 畫空心點並往右畫線，表示的是哪一個不等式？","o":["<i>x<\/i> &gt; −2","<i>x<\/i> ≥ −2","<i>x<\/i> &lt; −2","<i>x<\/i> ≤ −2"],"a":0,"e":"空心點表示不包含 −2，往右表示比 −2 大。"},{"q":"下列哪一個數是不等式 4 − <i>x<\/i> &gt; 1 的解？","o":["2","3","4","5"],"a":0,"e":"4 − <i>x<\/i> &gt; 1 解得 <i>x<\/i> &lt; 3，四個選項中只有 2 符合。"},{"q":"「<i>x<\/i> 減 3 小於 8」寫成不等式是哪一個？","o":["<i>x<\/i> − 3 &lt; 8","<i>x<\/i> − 3 &gt; 8","<i>x<\/i> − 3 ≤ 8","3 − <i>x<\/i> &lt; 8"],"a":0,"e":"「小於」用 &lt;，而且是 <i>x<\/i> 減 3。"},{"q":"「某數 <i>x<\/i> 的一半不超過 6」寫成不等式是哪一個？","o":["<span class=\"fr\"><span><i>x<\/i><\/span><span>2<\/span><\/span> ≤ 6","<span class=\"fr\"><span><i>x<\/i><\/span><span>2<\/span><\/span> &lt; 6","<span class=\"fr\"><span><i>x<\/i><\/span><span>2<\/span><\/span> ≥ 6","2<i>x<\/i> ≤ 6"],"a":0,"e":"「不超過」包含等於，用 ≤。"},{"q":"「票價 <i>x<\/i> 元，至少要 120 元」寫成不等式是哪一個？","o":["<i>x<\/i> ≥ 120","<i>x<\/i> &gt; 120","<i>x<\/i> ≤ 120","<i>x<\/i> &lt; 120"],"a":0,"e":"「至少」表示大於或等於。"},{"q":"下列哪一個數是不等式 2<i>x<\/i> + 1 &gt; 7 的解？","o":["4","3","2","−3"],"a":0,"e":"解得 <i>x<\/i> &gt; 3，選項中只有 4 符合；<i>x<\/i> = 3 時 2 × 3 + 1 = 7 不大於 7。"},{"q":"<i>x<\/i> = −2 是下列哪一個不等式的解？","o":["<i>x<\/i> &lt; −1","<i>x<\/i> &gt; −1","<i>x<\/i> ≥ 0","<i>x<\/i> &gt; −2"],"a":0,"e":"−2 &lt; −1 成立；−2 &gt; −2 不成立。"},{"q":"若 <i>a<\/i> &gt; <i>b<\/i>，下列何者正確？","o":["<i>a<\/i> + 4 &gt; <i>b<\/i> + 4","−<i>a<\/i> &gt; −<i>b<\/i>","<i>a<\/i> − 1 &lt; <i>b<\/i> − 1","<span class=\"fr\"><span><i>a<\/i><\/span><span>−2<\/span><\/span> &gt; <span class=\"fr\"><span><i>b<\/i><\/span><span>−2<\/span><\/span>"],"a":0,"e":"兩邊同加 4，方向不變；同乘或同除負數時方向要改變。"},{"q":"若 <i>a<\/i> &gt; <i>b<\/i>，則 −5<i>a<\/i> 和 −5<i>b<\/i> 之間應填哪一個符號？","o":["&lt;","&gt;","=","≥"],"a":0,"e":"兩邊同乘負數 −5，不等號方向要改變，所以 −5<i>a<\/i> &lt; −5<i>b<\/i>。"},{"q":"數線上在 3 畫實心點並往左畫線，表示哪一個不等式？","o":["<i>x<\/i> ≤ 3","<i>x<\/i> &lt; 3","<i>x<\/i> ≥ 3","<i>x<\/i> &gt; 3"],"a":0,"e":"實心點表示包含 3，往左表示比 3 小。"},{"q":"不等式 <i>x<\/i> ≥ −1 的解在數線上要怎麼畫？","o":["在 −1 畫實心點，往右畫線","在 −1 畫空心點，往右畫線","在 r\"><span><i>x<\/i> − 1<\/span><span>2<\/span><\/span> ≤ <span class=\"fr\"><span><i>x<\/i> + 4<\/span><span>3<\/span><\/span> 的解是什麼？","o":["<i>x<\/i> ≤ 11","<i>x<\/i> ≥ 11","<i>x<\/i> ≤ 7","<i>x<\/i> ≤ 5"],"a":0,"e":"兩邊同乘 6：3(<i>x<\/i> − 1) ≤ 2(<i>x<\/i> + 4)，3<i>x<\/i> − 3 ≤ 2<i>x<\/i> + 8，<i>x<\/i> ≤ 11。"},{"q":"同時滿足 2<i>x<\/i> − 1 &gt; 3 與 <i>x<\/i> + 4 ≤ 9 的整數有幾個？","o":["2","3","4","5"],"a":1,"e":"第一式 <i>x<\/i> &gt; 2，第二式 <i>x<\/i> ≤ 5，重疊部分 2 &lt; <i>x<\/i> ≤ 5，整數有 3、4、5，共 3 個。"},{"q":"甲方案月租 300 元、每分鐘 0.5 元；乙方案沒有月租、每分鐘 2 元。每月通話超過幾分鐘，選甲方案比較省？","o":["120","150","200","600"],"a":2,"e":"300 + 0.5<i>x<\/i> &lt; 2<i>x<\/i>，300 &lt; 1.5<i>x<\/i>，<i>x<\/i> &gt; 200，超過 200 分鐘時甲方案比較省。"},{"q":"解不等式 3<i>x<\/i> − 4 &gt; 11，結果是什麼？","o":["<i>x<\/i> &gt; 5","<i>x<\/i> &lt; 5","<i>x<\/i> &gt; <span class=\"fr\"><span>7<\/span><span>3<\/span><\/span>","<i>x<\/i> &gt; 15"],"a":0,"e":"3<i>x<\/i> &gt; 15，<i>x<\/i> &gt; 5。"},{"q":"解不等式 −2<i>x<\/i> + 5 ≥ 1，結果是什麼？","o":["<i>x<\/i> ≤ 2","<i>x<\/i> ≥ 2","<i>x<\/i> ≤ −2","<i>x<\/i> ≥ −2"],"a":0,"e":"−2<i>x<\/i> ≥ −4，兩邊同除以 −2，方向改變：<i>x<\/i> ≤ 2。"},{"q":"解不等式 4(<i>x<\/i> − 1) &lt; 2<i>x<\/i> + 6，結果是什麼？","o":["<i>x<\/i> &lt; 5","<i>x<\/i> &gt; 5","<i>x<\/i> &lt; 1","<i>x<\/i> &lt; 3.5"],"a":0,"e":"4<i>x<\/i> − 4 &lt; 2<i>x<\/i> + 6，2<i>x<\/i> &lt; 10，<i>x<\/i> &lt; 5。若把 4(<i>x<\/i> − 1) 誤算成 4<i>x<\/i> − 1，會得到 <i>x<\/i> &lt; 3.5。"},{"q":"解不等式 <span class=\"fr\"><span><i>x<\/i><\/span><span>2<\/span><\/span> − 1 ≤ <span class=\"fr\"><span><i>x<\/i><\/span><span>3<\/span><\/span>，結果是什麼？","o":["<i>x<\/i> ≤ 6","<i>x<\/i> ≥ 6","<i>x<\/i> ≤ 1","<i>x<\/i> ≤ 3"],"a":0,"e":"兩邊同乘 6：3<i>x<\/i> − 6 ≤ 2<i>x<\/i>，<i>x<\/i> ≤ 6。去分母時「−1」也要乘 6。"},{"q":"不等式 5 − <i>x<\/i> &gt; 2 的最大整數解是多少？","o":["2","3","4","−3"],"a":0,"e":"−<i>x<\/i> &gt; −3，<i>x<\/i> &lt; 3，最大的整數是 2。"},{"q":"同時滿足 <i>x<\/i> + 3 &gt; 1 與 2<i>x<\/i> ≤ 6 的整數有幾個？","o":["3","4","5","6"],"a":2,"e":"<i>x<\/i> &gt; −2 且 <i>x<\/i> ≤ 3，整數有 −1、0、1、2、3，共 5 個。"},{"q":"某手機方案月租 199 元，每分鐘通話費 0.8 元。若每月費用不超過 399 元，最多可以通話幾分鐘？","o":["200","249","250","498"],"a":2,"e":"199 + 0.8<i>x<\/i> ≤ 399，0.8<i>x<\/i> ≤ 200，<i>x<\/i> ≤ 250。"},{"q":"小明數學前兩次考 78 分、85 分，第三次至少要考幾分，三次平均才不低於 85 分？","o":["85","90","92","93"],"a":2,"e":"<span class=\"fr\"><span>78 + 85 + <i>x<\/i><\/span><span>3<\/span><\/span> ≥ 85，163 + <i>x<\/i> ≥ 255，<i>x<\/i> ≥ 92。"},{"q":"電梯最多載重 800 公斤，裡面已有 3 人共 210 公斤，還要搬入每箱 25 公斤的貨物，最多能搬入幾箱？","o":["23","24","31","32"],"a":0,"e":"210 + 25<i>x<\/i> ≤ 800，25<i>x<\/i> ≤ 590，<i>x<\/i> ≤ 23.6，箱數取整數，最多 23 箱。"},{"q":"若 <i>x<\/i> = 3 是不等式 2<i>x<\/i> − <i>a<\/i> &gt; 1 的解，<i>a<\/i> 的範圍是什麼？","o":["<i>a<\/i> &lt; 5","<i>a<\/i> &gt; 5","<i>a<\/i> &lt; 7","<i>a<\/i> &gt; −5"],"a":0,"e":"代入 <i>x<\/i> = 3：6 − <i>a<\/i> &gt; 1，−<i>a<\/i> &gt; −5，<i>a<\/i> &lt; 5。"},{"q":"甲方案先付入會費 500 元，之後每件商品打 8 折；乙方案不用入會費但不打折。每件商品 250 元，買超過幾件時甲方案比較划算？","o":["2","8","10","20"],"a":2,"e":"500 + 200<i>x<\/i> &lt; 250<i>x<\/i>，500 &lt; 50<i>x<\/i>，<i>x<\/i> &gt; 10，超過 10 件時甲較划算。"}],"fig":[],"w":"ineq","sum":"乘除負數要變號；解出範圍後回到題意取整數。","wo":""},"2-5-0":{"rows":[{"h":"列聯表與次數分配表","li":["依兩種以上的類別分組統計，做成<strong class=\"kw\">列聯表<\/strong>，可以同時比較兩種分類。","把資料分組並統計每組的個數（次數），做成<strong class=\"kw\">次數分配表<\/strong>；每組的範圍大小叫做組距。","分組「<i>a<\/i> ~ <i>b<\/i>」表示 <i>a<\/i> 以上（含 <i>a<\/i>）、<strong class=\"kw\">未滿 <i>b<\/i><\/strong>；最後一組通常包含上限。"],"tip":[]},{"h":"常見統計圖","li":["<strong class=\"kw\">長條圖<\/strong>：比較各類別數量的多少。","<strong class=\"kw\">折線圖<\/strong>：看資料隨時間變化的趨勢。","圓形圖：看各部分占全體的比例，扇形圓心角 = <strong class=\"kw\">百分率 × 360°<\/strong>。","<strong class=\"kw\">直方圖<\/strong>：分組資料的次數，長方形一個接一個、沒有間隔，寬是組距、高是次數。","次數分配折線圖：以各組的<strong class=\"kw\">組中點<\/strong>為橫坐標、次數為縱坐標描點連線。"],"tip":["讀圖先看縱軸的單位與起點；縱軸若不是從 0 開始，長條高度的比例會誤導人。"]},{"h":"平均數、中位數、眾數","li":["<strong class=\"kw\">算術平均數<\/strong> = 資料總和 ÷ 資料個數。","<strong class=\"kw\">中位數<\/strong>：資料由小到大排好，正中間的數；個數是偶數時，取中間兩數的平均。","<strong class=\"kw\">眾數<\/strong>：出現次數最多的數，可能不只一個。","有特別大或特別小的極端值時，<strong class=\"kw\">中位數比平均數更能代表一般情形<\/strong>。"],"tip":[]}],"ex":[{"q":"7 位同學的跳繩次數：40、45、45、50、56、 ？","o":["100%","50%","總人數","最後一組的次數"],"a":0,"e":"各組的比例合起來就是全部。"},{"q":"某一組的次數是 9，總次數是 36，這一組的相對次數是多少？","o":["9%","25%","36%","75%"],"a":1,"e":"9 ÷ 36 = 25%。"},{"q":"累積次數分配表中，「未滿 70 分」的累積次數是 18，「未滿 80 分」的累積次數是 30，70 分以上、未滿 80 分的有幾人？","o":["12","18","30","48"],"a":0,"e":"30 − 18 = 12。"},{"q":"累積次數分配折線圖由左往右的走勢是哪一種？","o":["上升或持平","一定下降","先升後降","上下起伏"],"a":0,"e":"累積次數只會越加越多或不變，不會減少。"},{"q":"「未滿 50 公斤」的累積相對次數是 35%，50 公斤以上（含）的占全部的幾 %？","o":["35%","50%","65%","100%"],"a":2,"e":"100% − 35% = 65%。"},{"q":"畫累積次數分配折線圖時，橫坐標通常用各組的哪一個數？","o":["上限","下限","組中點","組距"],"a":0,"e":"累積次數表示「未滿某組上限」的個數，所以描點在上限。"},{"q":"某次測驗 40 人，相對次數是 15% 的那一組有幾人？","o":["4","6","15","26"],"a":1,"e":"40 × 15% = 6。"},{"q":"40 人的成績分成五組，各組次數依序是 4、10、16、6、4。累積到第三組（未滿第三組上限）的累積次數是多少？","o":["16","26","30","36"],"a":2,"e":"4 + 10 + 16 = 30。"},{"q":"某一組的累積相對次數是 60%，下一組的累積相對次數是 85%，下一組的相對次數是多少？","o":["25%","60%","85%","145%"],"a":0,"e":"85% − 60% = 25%。"},{"q":"某次測驗「未滿 70 分」的累積相對次數恰好是 50%，這表示什麼？","o":["恰有一半的人分數未滿 70 分","平均分數一定是 70 分","70 分的人最多","全班都在 60 ~ 70 分之間"],"a":0,"e":"累積相對次數 50% 表示有一半的資料小於這一組的上限 70 分。"}],"fig":[],"w":"freq","sum":"從累積次數與相對次數，讀出資料的分布情形。","wo":""},"4-1-1":{"rows":[{"h":"數列","li":["依順序排成一列的數叫做<strong class=\"kw\">數列<\/strong>，第 <i>n<\/i> 項記作 <i>a<\/i><sub><i>n<\/i><\/sub>，第一項 <i>a<\/i><sub>1<\/sub> 叫做首項。","項數有限的叫做有限數列，最後一項叫做<strong class=\"kw\">末項<\/strong>。","找規律：看<strong class=\"kw\">相鄰兩項的差或比<\/strong>，或觀察圖形怎麼一層層增加。"],"tip":[]},{"h":"等差數列","li":["相鄰兩項的差都相同的數列叫做<strong class=\"kw\">等差數列<\/strong>，這個差叫做<strong class=\"kw\">公差<\/strong> <i>d<\/i>：<i>d<\/i> = <i>a<\/i><sub>2<\/sub> − <i>a<\/i><sub>1<\/sub>。","第 <i>n<\/i> 項：<strong class=\"kw\"><i>a<\/i><sub><i>n<\/i><\/sub> = <i>a<\/i><sub>1<\/sub> + (<i>n<\/i> − 1)<i>d<\/i><\/strong>。","例：3、7、11、15、…，<i>a<\/i><sub>1<\/sub> = 3，<i>d<\/i> = 4，<i>a<\/i><sub>20<\/sub> = 3 + 19 × 4 = 79。"],"tip":[]},{"h":"等差中項與項數","li":["<i>a<\/i>、<i>b<\/i>、<i>c<\/i> 成等差數列時，<i>b<\/i> 叫做 <i>a<\/i> 與 <i>c<\/i> 的<strong class=\"kw\">等差中項<\/strong>，<i>b<\/i> = <span class=\ 正幾邊形？","a":["每個外角 = 180° − 144° = 36°","邊數 = 360° ÷ 36° = 10，是正十邊形。"]},{"q":"△ABC 中 ∠C = 70°，∠A 比 ∠B 大 20°，求 ∠A。","a":["∠A + ∠B = 180° − 70° = 110°","∠A = (110° + 20°) ÷ 2 = 65°"]},{"q":"求正八邊形每個外角與每個內角的度數。","a":["每個外角 = 360° ÷ 8 = 45°","每個內角 = 180° − 45° = 135°"]}],"qs":[{"q":"△ABC 中，∠A = 52°，∠B = 67°，∠C 的外角是幾度？","o":["61","113","119","128"],"a":2,"e":"外角等於兩內對角的和：52° + 67° = 119°。"},{"q":"八邊形的內角和是幾度？","o":["360","900","1080","1440"],"a":2,"e":"(8 − 2) × 180° = 1080°。"},{"q":"正十二邊形的每個內角是幾度？","o":["30","144","150","160"],"a":2,"e":"每個外角 360° ÷ 12 = 30°，內角 = 180° − 30° = 150°。"},{"q":"一個凸多邊形的內角和是外角和的 4 倍，它是幾邊形？","o":["8","9","10","12"],"a":2,"e":"(<i>n<\/i> − 2) × 180° = 4 × 360° = 1440°，<i>n<\/i> − 2 = 8，<i>n<\/i> = 10。"},{"q":"△ABC 中 ∠A = 45°，∠B = 70°，∠C 是幾度？","o":["55","65","75","115"],"a":1,"e":"180° − 45° − 70° = 65°。"},{"q":"直角三角形的一個銳角是 32°，另一個銳角是幾度？","o":["48","58","68","148"],"a":1,"e":"兩銳角和是 90°，90° − 32° = 58°。"},{"q":"六邊形的內角和是幾度？","o":["540","720","900","1080"],"a":1,"e":"(6 − 2) × 180° = 720°。"},{"q":"正五邊形的每個內角是幾度？","o":["72","108","120","540"],"a":1,"e":"內角和 540° ÷ 5 = 108°；也可以用 180° − 外角 72°。"},{"q":"正六邊形的每個外角是幾度？","o":["30","60","72","120"],"a":1,"e":"360° ÷ 6 = 60°。"},{"q":"正多邊形的每個外角是 30°，它是正幾邊形？","o":["6","10","12","15"],"a":2,"e":"360° ÷ 30° = 12。"},{"q":"一個多邊形的內角和是 1260°，它是幾邊形？","o":["7","8","9","10"],"a":2,"e":"(<i>n<\/i> − 2) × 180° = 1260°，<i>n<\/i> − 2 = 7，<i>n<\/i> = 9。"},{"q":"△ABC 中 ∠A = 2∠B，∠C = 3∠B，∠C 是幾度？","o":["30","60","90","120"],"a":2,"e":"∠B + 2∠B + 3∠B = 180°，∠B = 30°，∠C = 90°。"},{"q":"△ABC 中 ∠A = 60°，∠B 的外角是 125°，∠C 是幾度？","o":["55","65","75","115"],"a":1,"e":"∠B 的外角 = ∠A + ∠C，125° = 60° + ∠C，∠C = 65°。"},{"q":"四邊形的四個內角中有三個是 80°、95°、110°，第四個角是幾度？","o":["65","75","85","95"],"a":1,"e":"四邊形內角和 360°，360° − 285° = 75°。"},{"q":"一個三角形中有一個角是 100°，它是哪一種三角形？","o":["鈍角三角形","銳角三角形","直角三角形","可能是直角三角形"],"a":0,"e":"有一個角大於 90°，是鈍角三角形；另外兩角和只剩 80°。"}],"fig":["m-extangle","m-polygon"],"w":"polyangle","sum":"三角形內角和 180°，<i>n<\/i> 邊形內角和是 (<i>n<\/i> − 2) × pan class=\"seg\">BC<\/span>。"},{"q":"三角形三邊長是 <i>x<\/i>、<i>x<\/i> + 2、<i>x<\/i> + 4（<i>x<\/i> 為正整數），<i>x<\/i> 最小是多少？","o":["1","2","3","4"],"a":2,"e":"兩短邊和要大於最長邊：<i>x<\/i> + (<i>x<\/i> + 2) &gt; <i>x<\/i> + 4，<i>x<\/i> &gt; 2，最小整數是 3。"}],"fig":[],"w":"","sum":"兩邊和大於第三邊，大邊對大角。"},"4-4-1":{"rows":[{"h":"平行","li":["同一平面上兩條直線不相交，叫做<strong class=\"kw\">平行<\/strong>，記作 L<sub>1<\/sub> ∥ L<sub>2<\/sub>。","兩平行線之間的<strong class=\"kw\">距離處處相等<\/strong>；過直線外一點，只能作一條直線與它平行。"],"tip":[]},{"h":"截線與截角","li":["一條直線與兩條直線相交，這條直線叫做截線，形成<strong class=\"kw\">同位角<\/strong>、<strong class=\"kw\">內錯角<\/strong>、<strong class=\"kw\">同側內角<\/strong>。","兩直線平行時：同位角相等、內錯角相等、同側內角<strong class=\"kw\">互補<\/strong>（和為 180°）。","反過來，只要同位角相等、內錯角相等或同側內角互補，<strong class=\"kw\">兩直線就平行<\/strong>。"],"tip":[]},{"h":"常用技巧","li":["角度題中出現「拐角」時，過拐點<strong class=\"kw\">作一條平行線<\/strong>，把它拆成兩個內錯角。","例：L<sub>1<\/sub> ∥ L<sub>2<\/sub>，兩線之間的拐角 = 兩側與平行線所夾的角相加。"],"tip":["判斷平行要用角的關係，不能只看圖形像不像。"]}],"ex":[{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，被截線所截的一組同側內角分別是 3<i>x<\/i>° 與 (<i>x<\/i> + 40)°，求 <i>x<\/i> 與兩角。","a":["同側內角互補：3<i>x<\/i> + <i>x<\/i> + 40 = 180","<i>x<\/i> = 35，兩角為 105° 與 75°"]},{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，被截線所截的一組同位角是 (2<i>x<\/i> + 15)° 與 (4<i>x<\/i> − 25)°，求 <i>x<\/i>。","a":["同位角相等：2<i>x<\/i> + 15 = 4<i>x<\/i> − 25","<i>x<\/i> = 20，兩角都是 55°"]},{"q":"兩條直線被一條截線所截，一組同側內角分別是 105° 與 75°，這兩條直線平行嗎？","a":["105° + 75° = 180°，同側內角互補。","所以這兩條直線平行。"]}],"qs":[{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，其中一個內錯角是 72°，與它成內錯角的另一個角是幾度？","o":["18","72","108","144"],"a":1,"e":"兩直線平行時，內錯角相等。"},{"q":"兩直線被一條截線所截，下列哪一個條件可以判定兩直線平行？","o":["同位角相等","同側內角相等","對頂角相等","內錯角互補"],"a":0,"e":"同位角相等可推得平行；同側內角要「互補」才行，對頂角本來就相等。"},{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，一組同側內角是 (2<i>x<\/i> + 10)° 與 (3<i>x<\/i> − 30)°，<i>x<\/i> 是多少？","o":["36","38","40","44"],"a":2,"e":"(2<i>x<\/i> + 10) + (3<i>x<\/i> − 30) = 180，5<i>x<\/i> = 200，<i>x<\/i> = 40。"},{"q":"過直線 L 外一點 P，可以作幾條直線與 L 平行？","o":["恰好 1 條","2 條","無限多條","0 條"],"a":0,"e":"過直線外一點，恰有一條直線與它平行。"},{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，被截線所截的一組同位角中，一個是 65°，另一個是幾度？","o":["65","115","25","130"],"a":0,"e":"兩直線平行，同位角相等。"},{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，被截線所截的一組同側內角中，一個是 70°，另一個是幾度？","o":["20","70","110","140"],"a":2,"e":"同側內角互補：180° − 70° = 110°。"},{"q":"兩直線被一條截線所截，一組內錯角相等，這兩條直線有什麼關係？","o":["平行","垂直","相交","無法判斷"],"a":0,"e":"內錯角相等，兩直線平行。"},{"q":"兩直線被一條截線所截，一組同側內角分別是 85° 和 95°，這兩條直線有什麼關係？","o":["平行","垂直","相交於截線左側","無法判斷"],"a":0,"e":"85° + 95° = 180°，同側內角互補，兩直線平行。"},{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，截線與 L<sub>1<\/sub> 相交成的一個角是 40°，截線與 L<sub>2<\/sub> 相交形成的四個角，度數是哪一組？","o":["40°、140°、40°、140°","40°、50°、40°、50°","40°、40°、40°、40°","50°、130°、50°、130°"],"a":0,"e":"平行線的截角與 L<sub>1<\/sub> 處相同：兩個 40°、兩個 140°（對頂角相等，鄰角互補）。"},{"q":"兩條平行線之間的距離是 5 公分，L<sub>1<\/sub> 上任一點到 L<sub>2<\/sub> 的距離是多少？","o":["5 公分","大於 5 公分","小於 5 公分","不一定"],"a":0,"e":"兩平行線之間的距離處處相等。"},{"q":"同一平面上有相異的直線 L<sub>1<\/sub>、L<sub>2<\/sub>，若 L<sub>1<\/sub> ⊥ L<sub>3<\/sub> 且 L<sub>2<\/sub> ⊥ L<sub>3<\/sub>，則 L<sub>1<\/sub> 與 L<sub>2<\/sub> 有什麼關係？","o":["平行","垂直","相交成 45°","無法判斷"],"a":0,"e":"L<sub>1<\/sub>、L<sub>2<\/sub> 與 L<sub>3<\/sub> 的同位角都是 90°，同位角相等所以平行。"},{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，一組內錯角分別是 (3<i>x<\/i> + 10)° 與 (5<i>x<\/i> − 30)°，<i>x<\/i> 是多少？","o":["10","20","25","30"],"a":1,"e":"內錯角相等：3<i>x<\/i> + 10 = 5<i>x<\/i> − 30，<i>x<\/i> = 20。"},{"q":"L<sub>1<\/sub> ∥ L<sub>2<\/sub>，截線與 L<sub>1<\/sub> 所成的一個角是 3<i>x<\/i>°，與 L<sub>2<\/sub> 所成的同位角是 (<i>x<\/i> + 50)°，<i>x<\/i> 是多少？","o":["20","25","32.5","50"],"a":1,"e":"同位角相等：3<i>x<\/i> = <i>x<\/i> + 50，<i>x<\/i> = 25。"},{"q":"兩條直線相交，其中一個角是 52°，它的對頂角是幾度？","o":["38","52","104","128"],"a":1,"e":"對頂角相等。"},{"q":"長方形的兩組對邊分別平行，相鄰的兩邊有什麼關係？","o":["互相垂直","互相平行","夾 45°","長度一定相等"],"a":0,"e":"長方形的四個角都是直角，所以相鄰兩邊互相垂直。"}],"fig":["m-parallel"],"w":"","sum":"兩直線平行時，同位角、內錯角相等，同側內角互補。"},"4-4-2":{"rows":[{"h":"平行四邊形的性質","li":["兩組對邊分別平行的四邊形叫做<strong class=\"kw\">平行四邊形<\/strong>。","性質：<strong class=\"kw\">兩組對邊等長<\/strong>、<strong class=\"kw\">兩組對角相等<\/strong>、<strong class=\"kw\">對角線互相平分<\/strong>、相鄰兩角互補。","一條對角線把它分成<strong class=\"kw\">兩個全等三角形<\/strong>；兩條對角線把它分成四個面積相等的三角形。"],"tip":[]},{"h":"判別平行四邊形","li":["兩組對邊分別平行，或<strong class=\"kw\">兩組對邊分別等長<\/strong>。","一組對邊<strong class=\"kw\">平行且等長<\/strong>。","兩組對角分別相等，或<strong class=\"kw\">兩條對角線互相平分<\/strong>。"],"tip":["「一組對邊平行、另一組對邊等長」不一定是平行四邊形，可能是等腰梯形。"]},{"h":"面積","li":["平行四邊形面積 = <strong class=\"kw\">底 × 高<\/strong>。","<strong class=\"kw\">同底等高的平行四邊形面積相等<\/strong>；三角形面積是同底等高平行四邊形的一半。"],"tip":[]}],"ex":[{"q":"平行四邊形 ABCD 中，∠A = 3∠B，求 ∠C。","a":["相鄰兩角互補：∠A + ∠B = 180°，4∠B = 180°，∠B = 45°","∠A = 135°，對角相等，∠C = ∠A = 135°"]},{"q":"平行四邊形 ABCD 的周長是 36，<span class=\"seg\">AB<\/span> 比 <span class=\"seg\">BC<\/span> 長 4，求 <span class=\"seg\">AB<\/span>。","a":["對邊等長，<span class=\"seg\">AB<\/span> + <span class=\"seg\">BC<\/span> = 18，又 <span class=\"seg\">AB<\/span> − <span class=\"seg\">BC<\/span> = 4","<span class=\"seg\">AB<\/span> = (18 + 4) ÷ 2 = 11"]},{"q":"平行四邊形 ABCD 的對角線交於 O，<span class=\"seg\">AC<\/span> = 14、<span class=\"seg\">BD<\/span> = 10、<span class=\"seg\">AB<\/span> = 8，求 △AOB 的周長。","a":["對角線互相平分：<span class=\"seg\">AO<\/span> = 7，<span class=\"seg\">BO<\/span> = 5","周長 = 7 + 5 + 8 = 20"]}],"qs":[{"q":"平行四邊形 ABCD 中，∠B = 68°，∠D 是幾度？","o":["22","68","112","136"],"a":1,"e":"∠B 與 ∠D 是對角，對角相等。"},{"q":"平行四邊形的兩條對角線長 10 和 16，交點 O 到四個頂點的距離分別是多少？","o":["5、5、8、8","10、10、16、16","6.5、6.5、6.5、6.5","4、4、6、6"],"a":0,"e":"對角線互相平分，各被分成兩半：10 ÷ 2 = 5，16 ÷ 2 = 8。"},{"q":"下列哪一個條件可以判定四邊形 ABCD 是平行四邊形？","o":["<span class=\"seg\">AB<\/span> ∥ <span class=\"seg\">CD<\/span> 且 <span class=\"seg\">AB<\/span> = <span class=\"seg\">CD<\/span>","<span class=\"seg\">AB<\/span> ∥ <span class=\"seg\">CD<\/span> 且 <span class=\"seg\">AD<\/span> = <span class=\"seg\">BC<\/span>","∠A = ∠B","<span class=\"seg\">AC<\/span> = <span class=\"seg\">BD<\/span>"],"a":0,"e":"一組對邊平行且等長就是平行四邊形；第二個選項可能是等腰梯形。"},{"q":"平行四邊形的底是 12、高是 5，面積是多少？","o":["30","34","60","120"],"a":2,"e":"面積 = 底 × 高 = 12 × 5 = 60。"},{"q":"平行四邊形 ABCD 中，<span class=\"seg\">AB<\/span> = 8，<span class=\"seg\">CD<\/span> 是多少？","o":["4","8","16","無法確定"],"a":1,"e":"平行四邊形的對邊等長。"},{"q":"平行四邊形 ABCD 中，∠A = 110°，∠B 是幾度？","o":["70","110","90","250"],"a":0,"e":"相鄰兩角互補：180° − 110° = 70°。"},{"q":"平行四邊形 ABCD 的對角線交於 O，<span class=\"seg\">AO<\/span> = 6，<span class=\"seg\">AC<\/span> 是多少？","o":["3","6","12","18"],"a":2,"e":"對角線互相平分，<span class=\"seg\">AC<\/span> = 2 × 6 = 12。"},{"q":"平行四邊形的周長是 40，其中一邊長 12，相鄰的另一邊長多少？","o":["8","12","16","28"],"a":0,"e":"兩組對邊等長：2 × (12 + <i>x<\/i>) = 40，<i>x<\/i> = 8。"},{"q":"下列哪一個條件不能判定四邊形是平行四邊形？","o":["一組對邊平行，另一組對邊等長","兩組對邊分別等長","兩條對角線互相平分","兩組對角分別相等"],"a":0,"e":"等腰梯形就是一組對邊平行、另一組對邊等長，但不是平行四邊形。"},{"q":"平行四邊形 ABCD 的面積是 48，對角線 <span class=\"seg\">AC<\/span> 把它分成兩個三角形，△ABC 的面積是多少？","o":["12","24","36","48"],"a":1,"e":"對角線把平行四邊形分成兩個全等三角形，各占一半。"},{"q":"平行四邊形的底是 10，面積是 65，對應的高是多少？","o":["5.5","6.5","13","55"],"a":1,"e":"面積 = 底 × 高，高 = 65 ÷ 10 = 6.5。"},{"q":"平行四邊形 ABCD 中，∠A : ∠B = 2 : 3，∠C 是幾度？","o":["72","108","36","54"],"a":0,"e":"∠A + ∠B = 180°，∠A = 180° × <span class=\"fr\"><span>2<\/span><span>5<\/span><\/span> = 72°；∠C 與 ∠A 是對角，也是 72°。"},{"q":"平行四邊形 ABCD 的對角線交於 O，△AOB 的面積是 9，平行四邊形的面積是多少？","o":["18","27","36","45"],"a":2,"e":"兩條對角線把平行四邊形分成四個面積相等的三角形，9 × 4 = 36。"},{"q":"四邊形 ABCD 中 <span class=\"seg\">AB<\/span> ∥ <span class=\"seg\">CD<\/span>，<span class=\"seg\">AB<\/span> = <span class=\"seg\">CD<\/span> = 5，<span class=\"seg\">BC<\/span> = 7，周長是多少？","o":["17","24","20","無法確定"],"a":1,"e":"一組對邊平行且等長，ABCD 是平行四邊形，<span class=\"seg\">AD<\/span> = <span class=\"seg\">BC<\/span> = 7，周長 = 2 × (5 + 7) = 24。"},{"q":"平行四邊形相鄰的兩個內角，一定有什麼關係？","o":["互補","相等","和為 90°","沒有固定關係"],"a":0,"e":"相鄰兩角是兩平行線間的同側內角，互補。"}],"fig":["m-quads"],"w":"","sum":"平行四邊形的對邊、對角、對角線性質與判別方法。"},"4-4-3":{"rows":[{"h":"長方形、菱形、正方形","li":["<strong class=\"kw\">長方形<\/strong>：四個角都是直角；對角線<strong class=\"kw\">等長<\/strong>且互相平分。","<strong class=\"kw\">菱形<\/strong>：四邊等長；對角線<strong class=\"kw\">互相垂直平分<\/strong>，並平分各內角；面積 = 兩對角線乘積 ÷ 2。","<strong class=\"kw\">正方形<\/strong>：同時是長方形和菱形，對角線等長且互相垂直平分，與邊夾 45°。"],"tip":[]},{"h":"箏形與梯形","li":["<strong class=\"kw\">箏形<\/strong>：兩組鄰邊分別等長；對角線互相垂直，其中一條被另一條垂直平分；面積 = 兩對角線乘積 ÷ 2。","<strong class=\"kw\">梯形<\/strong>：只有一組對邊平行，平行的兩邊叫上底和下底；面積 = (上底 + 下底) × 高 ÷ 2。","<strong class=\"kw\">等腰梯形<\/strong>：兩腰等長，同一底上的兩底角相等，兩條對角線等長。"],"tip":[]},{"h":"中點連線","li":["三角形兩邊中點的連線<strong class=\"kw\">平行第三邊，長度是第三邊的一半<\/strong>。","梯形兩腰中點的連線叫做<strong class=\"kw\">中線<\/strong>，平行兩底，長 = (上底 + 下底) ÷ 2。"],"tip":["對角線互相垂直的四邊形（菱形、正方形、箏形），面積都等於兩對角線乘積的一半。"]}],"ex":[{"q":"菱形兩條對角線長 6 和 8，求邊長與面積。","a":["對角線互相垂直平分，一半是 3 和 4，邊長 = <span class=\"rt\">√<span>3<sup>2<\/sup> + 4<sup>2<\/sup><\/span><\/span> = 5","面積 = 6 × 8 ÷ 2 = 24"]},{"q":"梯形的上底 8、下底 14、高 5，求中線長與面積。","a":["中線 = (8 + 14) ÷ 2 = 11","面積 = (8 + 14) × 5 ÷ 2 = 55（也就是中線 × 高）"]},{"q":"長方形 ABCD 的對角線交於 O，∠AOB = 60°，<span class=\"seg\">AC<\/span> = 10，求 <span class=\"seg\">AB<\/span>。","a":["對角線等長且互相平分：<span class=\"seg\">AO<\/span> = <span class=\"seg\">BO<\/span> = 5","△AOB 是頂角 60° 的等腰三角形，也就是正三角形，<span class=\"seg\">AB<\/span> = 5"]}],"qs":[{"q":"下列哪一個性質，對所有長方形的兩條對角線都成立？","o":["等長且互相平分","互相垂直平分","平分各內角","互相垂直但不等長"],"a":0,"e":"長方形的對角線等長且互相平分，但一般不互相垂直。"},{"q":"梯形的上底 6、下底 14，中線長是多少？","o":["7","8","10","20"],"a":2,"e":"中線 = (6 + 14) ÷ 2 = 10。"},{"q":"△ABC 中，D、E 分別是 <span class=\"seg\">AB<\/span>、<span class=\"seg\">AC<\/span> 的中點，<span class=\"seg\">BC<\/span> = 18，<span class=\"seg\">DE<\/span> 是多少？","o":["6","9","18","36"],"a":1,"e":"兩邊中點連線等於第三邊的一半。"},{"q":"下列哪一種四邊形的對角線一定互相垂直？","o":["菱形","長方形","平行四邊形","等腰梯形"],"a":0,"e":"菱形的對角線互相垂直平分；其他三種一般不垂直。"},{"q":"長方形的對角線長 10，兩條對角線的交點到四個頂點的距離各是多少？","o":["5","10","2.5","不一定相等"],"a":0,"e":"長方形的對角線等長且互相平分，交點到四個頂點都是 5。"},{"q":"菱形的邊長是 5，周長是多少？","o":["10","20","25","無法確定"],"a":1,"e":"菱形四邊等長，4 × 5 = 20。"},{"q":"菱形的兩條對角線長 10 和 24，邊長是多少？","o":["13","17","26","34"],"a":0,"e":"對角線互相垂直平分，半長 5 和 12，邊長 = <span class=\"rt\">√<span>5<sup>2<\/sup> + 12<sup>2<\/sup><\/span><\/span> = 13。"},{"q":"菱形的兩條對角線長 10 和 24，面積是多少？","o":["34","60","120","240"],"a":2,"e":"面積 = 10 × 24 ÷ 2 = 120。"},{"q":"正方形的對角線長 8，面積是多少？","o":["16","32","64","128"],"a":1,"e":"正方形也是菱形，面積 = 8 × 8 ÷ 2 = 32。"},{"q":"梯形的上底 4、下底 10、高 6，面積是多少？","o":["24","42","60","84"],"a":1,"e":"(4 + 10) × 6 ÷ 2 = 42。"},{"q":"等腰梯形的一個底角是 70°，在同一底上的另一個底角是幾度？","o":["70","110","20","140"],"a":0,"e":"等腰梯形同一底上的兩底角相等。"},{"q":"等腰梯形下底上的一個底角是 70°，上底上的底角是幾度？","o":["70","110","20","140"],"a":1,"e":"上底與下底平行，同一腰上的兩角是同側內角，互補：180° − 70° = 110°。"},{"q":"下列哪一個敘述正確？","o":["正方形一定是菱形","菱形一定是正方形","長方形一定是正方形","梯形一定是平行四邊形"],"a":0,"e":"正方形四邊等長，符合菱形的定義；反過來不一定。"},{"q":"箏形的兩條對角線長 6 和 9，面積是多少？","o":["15","27","30","54"],"a":1,"e":"箏形的對角線互相垂直，面積 = 6 × 9 ÷ 2 = 27。"},{"q":"△ABC 中 D、E 分別是 <span class=\"seg\">AB<\/span>、<span class=\"seg\">AC<\/span> 的中點，<span class=\"seg\">DE<\/span> = 7，<span class=\"seg\">BC<\/span> 是多少？","o":["3.5","7","14","21"],"a":2,"e":"中點連線等於第三邊的一半，<span class=\"seg\">BC<\/span> = 2 × 7 = 14。"}],"fig":["m-quads","m-midsegment"],"w":"","sum":"長方形、菱形、正方形、箏形、梯形的性質與面積。"},"5-1-1":{"rows":[{"h":"連比","li":["三個或更多個數 <i>a<\/i>、<i>b<\/i>、<i>c<\/i> 的比寫成 <i>a<\/i> : <i>b<\/i> : <i>c<\/i>，叫做<strong class=\"kw\">連比<\/strong>。","各項同乘或同除一個不為 0 的數，<strong class=\"kw\">連比不變<\/strong>；各項化成互質的整數，叫做最簡整數連比。","由兩個比求連比：<strong class=\"kw\">把共同的那一項化成相同的數<\/strong>。例：<i>a<\/i> : <i>b<\/i> = 2 : 3，<i>b<\/i> : <i>c<\/i> = 4 : 5，<i>b<\/i> 取 [3, 4] = 12，得 <i>a<\/i> : <i>b<\/i> : <i>c<\/i> = 8 : 12 : 15。"],"tip":[]},{"h":"連比例式","li":["<i>a<\/i> : <i>b<\/i> : <i>c<\/i> = <i>d<\/i> : <i>e<\/i> : <i>f<\/i> 表示 <i>a<\/i> : <i>b<\/i> = <i>d<\/i> : <i>e<\/i>、<i>b<\/i> : <i>c<\/i> = <i>e<\/i> : <i>f<\/i>、<i>a<\/i> : <i>c<\/i> = <i>d<\/i> : <i>f<\/i> <strong class=\"kw\">同時成立<\/strong>。","若 <i>x<\/i> : <i>y<\/i> : <i>z<\/i> = <i>a<\/i> : <i>b<\/i> : <i>c<\/i>，可以設 <strong class=\"kw\"><i>x<\/i> = <i>ar<\/i>、<i>y<\/i> = <i>br<\/i>、<i>z<\/i> = <i>cr<\/i><\/strong>（<i>r<\/i> ≠ 0）。"],"tip":[]},{"h":"按連比分配","li":["把 N 按 <i>a<\/i> : <i>b<\/i> : <i>c<\/i> 分配，各得 <strong class=\"kw\">N × <span class=\"fr\"><span><i>a<\/i><\/span><span><i>a<\/i> + <i>b<\/i> + <i>c<\/i><\/span><\/span><\/strong>、N × <span class=\"fr\"><span><i>b<\/i><\/span><span><i>a<\/i> + <i>b<\/i> + <i>c<\/i><\/span><\/span>、N × <span class=\"fr\"><span><i>c<\/i><\/span><span><i>a<\/i> + <i>b<\/i> + <i>c<\/i><\/span><\/span>。","例：三角形三內角的比是 2 : 3 : 4，三內角分別是 40°、60°、80°。"],"tip":["「<i>x<\/i> 比 <i>y<\/i> 多 20%」可以寫成 <i>x<\/i> : <i>y<\/i> = 1.2 : 1 = 6 : 5。"]}],"ex":[{"q":"<i>a<\/i> : <i>b<\/i> = 3 : 4，<i>b<\/i> : <i>c<\/i> = 6 : 7，求 <i>a<\/i> : <i>b<\/i> : <i>c<\/i>。","a":["<i>b<\/i> 的兩個值 4 與 6 的最小公倍數是 12","<i>a<\/i> : <i>b<\/i> = 9 : 12，<i>b<\/i> : <i>c<\/i> = 12 : 14，所以 <i>a<\/i> : <i>b<\/i> : <i>c<\/i> = 9 : 12 : 14"]},{"q":"把 0.5 : <span class=\"fr\"><span>2<\/span><span>3<\/span><\/span> : 1.5 化成最簡整數比。","a":["寫成分數：<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> : <span class=\"fr\"><span>2<\/span><span>3<\/span><\/span> : <span class=\"fr\"><span>3<\/span><span>2<\/span><\/span>，各項同乘 6","得 3 : 4 : 9"]},{"q":"三角形三內角的比是 1 : 3 : 5，求最大的角。","a":["最大角占全部的 <span class=\"fr\"><span>5<\/span><span>1 + 3 + 5<\/span><\/span> = <span class=\"fr\"><span>5<\/span><span>9<\/span><\/span>","180° × <span class=\"fr\"><span>5<\/span><span>9<\/span><\/span> = 100°"]}],"qs":[{"q":"若 <i>x<\/i> : <i>y<\/i> = 2 : 5，<i>y<\/i> : <i>z<\/i> = 3 : 4，則 <i>x<\/i> : <i>y<\/i> : <i>z<\/i> 是多少？","o":["6 : 15 : 20","2 : 15 : 4","6 : 5 : 4","2 : 8 : 4"],"a":0,"e":"<i>y<\/i> 取 [5, 3] = 15：<i>x<\/i> : <i>y<\/i> = 6 : 15，<i>y<\/i> : <i>z<\/i> = 15 : 20。"},{"q":"三角形三內角的比是 1 : 2 : 3，最大的角是幾度？","o":["30","60","90","120"],"a":2,"e":"180° × <span class=\"fr\"><span>3<\/span><span>1 + 2 + 3<\/span><\/span> = 90°。"},{"q":"把 360 元按 2 : 3 : 7 分給甲、乙、丙，丙得多少元？","o":["120","180","210","252"],"a":2,"e":"360 × <span class=\"fr\"><span>7<\/span><span>12<\/span><\/span> = 210。"},{"q":"<i>x<\/i> : <i>y<\/i> : <i>z<\/i> = 2 : 3 : 5，且 <i>x<\/i> + <i>y<\/i> + <i>z<\/i> = 40，<i>z<\/i> 是多少？","o":["8","12","20","25"],"a":2,"e":"設 <i>x<\/i> = 2<i>r<\/i>、<i>y<\/i> = 3<i>r<\/i>、<i>z<\/i> = 5<i>r<\/i>，10<i>r<\/i> = 40，<i>r<\/i> = 4，<i>z<\/i> = 20。"},{"q":"把 6 : 9 : 12 化成最簡整數比，結果是什麼？","o":["2 : 3 : 4","6 : 9 : 12","1 : 1.5 : 2","3 : 2 : 4"],"a":0,"e":"各項同除以 3 得 2 : 3 : 4。1 : 1.5 : 2 不是整數比。"},{"q":"<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> : <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span> : <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> 化成最簡整數比是多少？","o":["6 : 4 : 3","2 : 3 : 4","3 : 4 : 6","1 : 2 : 3"],"a":0,"e":"各項同乘 12：6 : 4 : 3。"},{"q":"若 <i>a<\/i> : <i>b<\/i> = 3 : 5，<i>b<\/i> : <i>c<\/i> = 5 : 2，則 <i>a<\/i> : <i>b<\/i> : <i>c<\/i> 是多少？","o":["3 : 5 : 2","3 : 25 : 2","15 : 5 : 2","3 : 10 : 2"],"a":0,"e":"兩個比中的 <i>b<\/i> 都是 5，直接合併：3 : 5 : 2。"},{"q":"若 <i>a<\/i> : <i>b<\/i> = 4 : 3，<i>b<\/i> : <i>c<\/i> = 2 : 5，則 <i>a<\/i> : <i>b<\/i> : <i>c<\/i> 是多少？","o":["8 : 6 : 15","4 : 3 : 5","4 : 6 : 5","8 : 3 : 15"],"a":0,"e":"<i>b<\/i> 取 [3, 2] = 6：<i>a<\/i> : <i>b<\/i> = 8 : 6，<i>b<\/i> : <i>c<\/i> = 6 : 15。"},{"q":"若 <i>x<\/i> : <i>y<\/i> : <i>z<\/i> = 1 : 2 : 3，且 <i>x<\/i> = 5，<i>z<\/i> 是多少？","o":["5","10","15","30"],"a":2,"e":"設 <i>x<\/i> = <i>r<\/i>、<i>y<\/i> = 2<i>r<\/i>、<i>z<\/i> = 3<i>r<\/i>，<i>r<\/i> = 5，<i>z<\/i> = 15。"},{"q":"60 位參加者分成甲、乙、丙三組，人數比是 2 : 5 : 3，乙組有幾人？","o":["12","18","25","30"],"a":3,"e":"60 × <span class=\"fr\"><span>5<\/span><span>2 + 5 + 3<\/span><\/span> = 30。"},{"q":"若 2<i>a<\/i> = 3<i>b<\/i> = 4<i>c<\/i>（<i>a<\/i>、<i>b<\/i>、<i>c<\/i> 都不為 0），則 <i>a<\/i> : <i>b<\/i> : <i>c<\/i> 是多少？","o":["6 : 4 : 3","2 : 3 : 4","4 : 3 : 2","3 : 4 : 6"],"a":0,"e":"設 2<i>a<\/i> = 3<i>b<\/i> = 4<i>c<\/i> = <i>k<\/i>（<i>k<\/i> ≠ 0），<i>a<\/i> : <i>b<\/i> : <i>c<\/i> = <span class=\"fr\"><span><i>k<\/i><\/span><span>2<\/span><\/span> : <span class=\"fr\"><span><i>k<\/i><\/span><span>3<\/span><\/span> : <span class=\"fr\"><span><i>k<\/i><\/span><span>4<\/span><\/span>，各項同乘 <span class=\"fr\"><span>12<\/span><span><i>k<\/i><\/span><\/span> 得 6 : 4 : 3。"},{"q":"三角形三邊長的比是 3 : 4 : 5，周長是 36，最長的邊是  <span class=\"fr\"><span>1<\/span><span>6<\/span><\/span> = 6π。"],"tip":[]},{"h":"點、直線與圓","li":["點到圓心的距離 <i>d<\/i> 與半徑 <i>r<\/i> 比較：<strong class=\"kw\"><i>d<\/i> &lt; <i>r<\/i> 在圓內<\/strong>，<i>d<\/i> = <i>r<\/i> 在圓上，<i>d<\/i> &gt; <i>r<\/i> 在圓外。","圓心到直線的距離 <i>d<\/i>：<i>d<\/i> &gt; <i>r<\/i> 不相交，<i>d<\/i> = <i>r<\/i> <strong class=\"kw\">相切<\/strong>（只有一個交點），<i>d<\/i> &lt; <i>r<\/i> 交於兩點。"],"tip":[]},{"h":"弦心距與切線","li":["圓心到弦的垂直線段叫做<strong class=\"kw\">弦心距<\/strong>，它<strong class=\"kw\">垂直平分這條弦<\/strong>：半弦、弦心距、半徑構成直角三角形。","切線與過切點的半徑<strong class=\"kw\">互相垂直<\/strong>。","從圓外一點對圓作兩條切線，兩條<strong class=\"kw\">切線段等長<\/strong>。"],"tip":["看到切線就連半徑造直角，看到弦就作弦心距，再用畢氏定理。"]}],"ex":[{"q":"圓的半徑 13，某弦的弦心距是 5，弦長是多少？","a":["半弦長 = <span class=\"rt\">√<span>13<sup>2<\/sup> − 5<sup>2<\/sup><\/span><\/span> = <span class=\"rt\">√<span>144<\/span><\/span> = 12","弦長 = 24"]},{"q":"半徑 10、圓心角 72° 的扇形，求弧長與面積。","a":["弧長 = 2π × 10 × <span class=\"fr\"><span>72<\/span><span>360<\/span><\/span> = 4π","面積 = 100π × <span class=\"fr\"><span>72<\/span><span>360<\/span><\/span> = 20π"]},{"q":"P 在圓 O 外，<span class=\"seg\">OP<\/span> = 10，半徑 6，從 P 作切線切圓於 T，求切線段 <span class=\"seg\">PT<\/span>。","a":["切線與半徑垂直，△OTP 是直角三角形，斜邊是 <span class=\"seg\">OP<\/span>","<span class=\"seg\">PT<\/span> = <span class=\"rt\">√<span>10<sup>2<\/sup> − 6<sup>2<\/sup><\/span><\/span> = 8"]}],"qs":[{"q":"圓 O 的半徑是 5，直線 L 與圓心的距離是 5，L 與圓的關係是什麼？","o":["相切","交於兩點","不相交","無法判斷"],"a":0,"e":"圓心到直線的距離等於半徑，直線與圓相切。"},{"q":"半徑 10 的圓中有一條長 16 的弦，弦心距是多少？","o":["4","6","8","12"],"a":1,"e":"半弦 8，弦心距 = <span class=\"rt\">√<span>10<sup>2<\/sup> − 8<sup>2<\/sup><\/span><\/span> = <span class=\"rt\">√<span>36<\/span><\/span> = 6。"},{"q":"半徑 9、圓心角 120° 的扇形面積是多少？","o":["27π","6π","54π","81π"],"a":0,"e":"81π × <span class=\"fr\"><span>120<\/span><span>360<\/span><\/span> = 27π。"},{"q":"P 在圓 O 外，<span class=\"seg\">PA<\/span>、<span class=\"seg\">PB<\/span> 分別切圓於 A、B，<span class=\"seg\">PA<\/span> = 7，半徑 3，<span class=\"seg\">PB<\/span> 是多少？","o":["3","4","7","10"],"a":2,"e":"圓外一點的兩條切線段等長，<span class=\"seg\">PB<\/span> = <span class=\"seg\">PA<\/span> = 7。"},{"q":"圓的直徑是 14，半徑是多少？","o":["7","14","28","3.5"],"a":0,"e":"半徑是直徑的一半。"},{"q":"圓的半徑是 5，圓心到點 P 的距離是 4，P 在哪裡？","o":["圓內","圓上","圓外","無法判斷"],"a":0,"e":"4 &lt; 5，點到圓心的距離小於半徑，在圓內。"},{"q":"半徑 6 的圓，圓心到直線 L 的距離是 8，L 與圓有什麼關係？","o":["不相交","相切","交於兩點","無法判斷"],"a":0,"e":"8 &gt; 6，直線與圓不相交。"},{"q":"半徑 4、圓心角 90° 的扇形，弧長是多少？","o":["2π","4π","8π","π"],"a":0,"e":"2π × 4 × <span class=\"fr\"><span>90<\/span><span>360<\/span><\/span> = 2π。"},{"q":"半徑 6、圓心角 60° 的扇形，面積是多少？","o":["6π","12π","2π","36π"],"a":0,"e":"36π × <span class=\"fr\"><span>60<\/span><span>360<\/span><\/span> = 6π。"},{"q":"圓的半徑是 5，一條弦長 8，弦心距是多少？","o":["2","3","4","6"],"a":1,"e":"半弦 4，弦心距 = <span class=\"rt\">√<span>5<sup>2<\/sup> − 4<sup>2<\/sup><\/span><\/span> = 3。"},{"q":"圓的一條弦長 24，弦心距 5，半徑是多少？","o":["7","12","13","17"],"a":2,"e":"半弦 12，半徑 = <span class=\"rt\">√<span>12<sup>2<\/sup> + 5<sup>2<\/sup><\/span><\/span> = 13。"},{"q":"直線 L 與圓 O 相切於 T，半徑 <span class=\"seg\">OT<\/span> 與 L 的夾角是幾度？","o":["45","90","60","180"],"a":1,"e":"切線與過切點的半徑互相垂直。"},{"q":"P 在圓 O 外，<span class=\"seg\">PT<\/span> 切圓於 T，半徑 <span class=\"seg\">OT<\/span> = 5，<span class=\"seg\">OP<\/span> = 13，<span class=\"seg\">PT<\/span> 是多少？","o":["8","12","13","18"],"a":1,"e":"<span class=\"seg\">OT<\/span> ⊥ <span class=\"seg\">PT<\/span>，<span class=\"seg\">PT<\/span> = <span class=\"rt\">√<span>13<sup>2<\/sup> − 5<sup>2<\/sup><\/span><\/span> = 12。"},{"q":"扇形的半徑是 9，弧長是 6π，圓心角是幾度？","o":["40","60","120","240"],"a":2,"e":"2π × 9 × <span class=\"fr\"><span>θ<\/span><span>360<\/span><\/span> = 6π，θ = 120。"},{"q":"一個圓中最長的弦是什麼？","o":["直徑","半徑","弧","切線"],"a":0,"e":"通過圓心的弦最長，也就是直徑。"}],"fig":["m-circlepos","m-tangent"],"w":"","sum":"點、直線與圓的位置關係，以及弦心距與切線的性質。"},"5-2-2":{"rows":[{"h":"圓心角","li":["頂點在圓心的角叫做<strong class=\"kw\">圓心角<\/strong>，它的度數等於所對弧的度數。","同圓或等圓中，相等的圓心角所對的<strong class=\"kw\">弧相等、弦也相等<\/strong>。"],"tip":[]},{"h":"圓周角","li":["頂點在圓上、兩邊都與圓相交的角叫做<strong class=\"kw\">圓周角<\/strong>。","<strong class=\"kw\">圓周角 = 所對弧度數的一半<\/strong>，也就是同弧所對圓心角的一半。","同弧或等弧所對的<strong class=\"kw\">圓周角都相等<\/strong>。","<strong class=\"kw\">直徑（半圓）所對的圓周角是 90°<\/strong>；反過來，90° 的圓周角所對的弦是直徑。"],"tip":[]},{"h":"圓內接四邊形","li":["四個頂點都在圓上的四邊形叫做圓內接四邊形，它的<strong class=\"kw\">對角互補<\/strong>。","例：圓內接四邊形 ABCD 中 ∠A = 75°，則 ∠C = 105°。"],"tip":["找圓周角「所對的弧」，要看角的兩邊夾住的那一段弧，不是頂點所在的那一段。"]}],"ex":[{"q":"圓 O 上有 A、B、C 三點，∠AOB = 110°，C 在優弧上，求 ∠ACB。","a":["∠ACB 所對的是劣弧 AB，劣弧 AB = 110°","∠ACB = 110° ÷ 2 = 55°"]},{"q":"圓內接四邊形 ABCD 中 ∠A = 2∠C，求 ∠A。","a":["對角互補：∠A + ∠C = 180°，3∠C = 180°","∠C = 60°，∠A = 120°"]},{"q":"<span class=\"seg\">AB<\/span> 是圓的直徑，C 是圓上另一點，∠CAB = 28°，求 ∠ABC。","a":["直徑所對的圓周角 ∠ACB = 90°","∠ABC = 180° − 90° − 28° = 62°"]}],"qs":[{"q":"圓周角 ∠APB = 35°，它所對的弧 AB 是幾度？","o":["17.5","35","70","145"],"a":2,"e":"圓周角是所對弧的一半，弧 = 35° × 2 = 70°。"},{"q":"<span class=\"seg\">AB<\/span> 是圓 O 的直徑，C 是圓上另一點，<span class=\"seg\">AC<\/span> = 6，<span class=\"seg\">BC<\/span> = 8，圓的半徑是多少？","o":["5","7","10","14"],"a":0,"e":"直徑所對的圓周角 ∠ACB = 90°，<span class=\"seg\">AB<\/span> = <span class=\"rt\">√<span>6<sup>2<\/sup> + 8<sup>2<\/sup><\/span><\/span> = 10，半徑 5。"},{"q":"圓內接四邊形 ABCD 中，∠B = 2∠D，∠B 是幾度？","o":["60","90","120","135"],"a":2,"e":"對角互補：∠B + ∠D = 180°，3∠D = 180°，∠D = 60°，∠B = 120°。"},{"q":"劣弧 AB = 100°，點 P 在劣弧 AB 上（不是 A、B），∠APB 是幾度？","o":["50","100","130","260"],"a":2,"e":"P 在劣弧上時，∠APB 所對的是優弧 AB = 360° − 100° = 260°，所以 ∠APB = 130°。"},{"q":"圓心角 ∠AOB = 80°，與它對同一段弧的圓周角是幾度？","o":["40","80","160","100"],"a":0,"e":"圓周角是同弧所對圓心角的一半。"},{"q":"弧 AB 的度數是 130°，它所對的圓周角是幾度？","o":["50","65","130","260"],"a":1,"e":"圓周角 = 所對弧度數的一半。"},{"q":"<span class=\"seg\">AB<\/span> 是圓的直徑，C 是圓上不同於 A、B 的點，∠ACB 是幾度？","o":["45","60","90","180"],"a":2,"e":"直徑所對的圓周角是 90°。"},{"q":"圓內接四邊形 ABCD 中 ∠A = 85°，∠C 是幾度？","o":["85","95","105","275"],"a":1,"e":"圓內接四邊形的對角互補。"},{"q":"圓內接四邊形 ABCD 中 ∠B = 100°，∠D 是幾度？","o":["80","100","90","260"],"a":0,"e":"180° − 100° = 80°。"},{"q":"同一個圓中，弧 AB 與弧 CD 的度數相等。只根據這個條件，下列哪一個一定成立？","o":["<span class=\"seg\">AB<\/span> = <span class=\"seg\">CD<\/span>","<span class=\"seg\">AB<\/span> ∥ <span class=\"seg\">CD<\/span>","<span class=\"seg\">AB<\/span> ⊥ <span class=\"seg\">CD<\/span>","<span class=\"seg\">AB<\/span> 與 <span class=\"seg\">CD<\/span> 一定相交"],"a":0,"e":"同圓中，等弧所對的弦相等。"},{"q":"圓上有 A、B、C 三點，C 在優弧 AB 上，∠ACB = 35°，劣弧 AB 是幾度？","o":["35","70","145","290"],"a":1,"e":"圓周角是所對弧的一半，劣弧 AB = 70°。"},{"q":"圓 O 中 ∠AOB = 140°，C 在劣弧 AB 上（不是 A、B），∠ACB 是幾度？","o":["70","110","140","220"],"a":1,"e":"C 在劣弧上，∠ACB 所對的是優弧 AB = 360° − 140° = 220°，所以 ∠ACB = 110°。"},{"q":"圓周角 ∠BAC = 90°，弦 <span class=\"seg\">BC<\/span> 是什麼？","o":["直徑","半徑","切線","弦心距"],"a":0,"e":"90° 的圓周角所對的弦是直徑。"},{"q":"圓上 A、B、C、D 四點，C、D 都在優弧 AB 上，∠ACB = 48°，∠ADB 是幾度？","o":["24","48","96","132"],"a":1,"e":"同弧所對的圓周角相等。"},{"q":"圓上四點把圓周分成四段弧，度數比是 1 : 2 : 3 : 4，最大的那段弧所對的圓周角是幾度？","o":["36","54","72","144"],"a":2,"e":"最大的弧 = 360° × <span class=\"fr\"><span>4<\/span><span>10<\/span><\/span> = 144°，所對的圓周角是 72°。"}],"fig":["m-inscribed"],"w":"inscribed","sum":"圓周角是所對弧的一半，圓內接四邊形對角互補。","wo":""},"5-3-1":{"rows":[{"h":"證明的意義","li":["<strong class=\"kw\">證明<\/strong>是從已知條件出發，依據已確定的定義與性質，一步一步推出結論。","每一步都要<strong class=\"kw\">寫出依據<\/strong>，例如「已知」、「對頂角相等」、「SAS 全等」、「三角形內角和 180°」。","看起來像、量起來相等，都<strong class=\"kw\">不能當作證明的理由<\/strong>。"],"tip":[]},{"h":"常用的依據","li":["<strong class=\"kw\">對頂角相等<\/strong>；兩直線平行時同位角、內錯角相等；三角形內角和 180°；外角等於兩內對角的和。","全等三角形的<strong class=\"kw\">對應邊、對應角相等<\/strong>；等腰三角形兩底角相等。","相似三角形<strong class=\"kw\">對應邊成比例<\/strong>；圓周角等於所對弧的一半。"],"tip":[]},{"h":"證明的寫法","li":["先寫出<strong class=\"kw\">「已知」與「求證」<\/strong>，畫圖並標出條件。","<strong class=\"kw\">從結論往回想<\/strong>：要證兩線段相等，找包含它們的兩個全等三角形；要證兩角相等，找平行線或等腰三角形。","用<strong class=\"kw\">「因為……所以……」<\/strong>把步驟串起來，最後寫出結論。"],"tip":["注意方向：「兩直線平行 → 同位角相等」與「同位角相等 → 兩直線平行」是兩個不同的性質，要選對。"]},{"h":"反例","li":["要說明一個敘述是錯的，只要找到一個不符合的例子（<strong class=\"kw\">反例<\/strong>）就夠了。"],"tip":[]}],"ex":[{"q":"<span class=\"seg\">AB<\/span> 與 <span class=\"seg\">CD<\/span> 交於 O，O 是兩線段的中點。說明 <span class=\"seg\">AC<\/span> ∥ <span class=\"seg\">BD<\/span>。","a":["<span class=\"seg\">OA<\/span> = <span class=\"seg\">OB<\/span>，<span class=\"seg\">OC<\/span> = <span class=\"seg\">OD<\/span>，∠AOC = ∠BOD（對頂角相等），所以 △AOC ≅ △BOD（SAS）","對應角 ∠OAC = ∠OBD，這是一組內錯角，所以 <span class=\"seg\">AC<\/span> ∥ <span class=\"seg\">BD<\/span>"]},{"q":"證明：等腰三角形 ABC 中 <span class=\"seg\">AB<\/span> = <span class=\"seg\">AC<\/span>，則 ∠B = ∠C。","a":["作 ∠A 的角平分線交 <span class=\"seg\">BC<\/span> 於 D：<span class=\"seg\">AB<\/span> = <span class=\"seg\">AC<\/span>（已知）、∠BAD = ∠CAD（角平分線）、<span class=\"seg\">AD<\/span> = <span class=\"seg\">AD<\/span>（公共邊）","所以 △ABD ≅ △ACD（SAS），對應角 ∠B = ∠C"]},{"q":"舉一個反例，說明「兩個奇數的和一定是奇數」是錯的。","a":["取 1 和 3，兩數都是奇數","1 + 3 = 4 是偶數，所以這個敘述是錯的"]}],"qs":[{"q":"下列哪一個可以當作證明中的理由？","o":["對頂角相等","從圖上看起來相等","用量角器量出來相等","多畫幾個例子都成立"],"a":0,"e":"證明要用已確定的性質；看起來、量出來或舉幾個例子都不夠。"},{"q":"要說明「所有質數都是奇數」是錯的，最簡單的方法是什麼？","o":["舉出反例：2 是偶數也是質數","列出 10 個奇數質數","說明奇數有無限多個","畫出數線"],"a":0,"e":"只要找到一個反例，就能說明敘述錯誤。"},{"q":"△ABC 中 <span class=\"seg\">AB<\/span> = <span class=\"seg\">AC<\/span>，D 是 <span class=\"seg\">BC<\/span> 的中點。要證明 △ABD ≅ △ACD，最直接的依據是什麼？","o":["SSS","AAA","SSA","RHS"],"a":0,"e":"<span class=\"seg\">AB<\/span> = <span class=\"seg\">AC<\/span>，<span class=\"seg\">BD<\/span> = <span class=\"seg\">CD<\/span>，<span class=\"seg\">AD<\/span> 是公共邊，三邊對應相等。題目沒有直接給直角，不能先用 RHS。"},{"q":"已知 L<sub>1<\/sub> ∥ L<sub>2<\/sub>，要推出一組同位角相等，應該寫哪一個理由？","o":["兩直線平行，同位角相等","同位角相等，兩直線平行","對頂角相等","三角形內角和是 180°"],"a":0,"e":"由「平行」推到「角相等」，用的是平行線的性質；反方向才是平行的判別。"},{"q":"證明「三角形內角和是 180°」時，常用哪一種方法？","o":["過一個頂點作對邊的平行線，利用內錯角相等","量出三個角再相加","多畫幾個三角形比較","用尺規作出三個角"],"a":0,"e":"平行線把三個內角移到同一條直線上，合成平角 180°。"},{"q":"已知 ∠1 與 ∠2 是對頂角，∠1 = 50°，推出 ∠2 = 50° 的理由是什麼？","o":["對頂角相等","同位角相等","內錯角相等","三角形內角和 180°"],"a":0,"e":"兩直線相交所成的對頂角相等。"},{"q":"要證明兩條線段等長，常用的方法是哪一個？","o":["證明它們所在的兩個三角形全等，而且它們是對應邊","用尺量出長度","看圖判斷","先假設它們相等"],"a":0,"e":"全等三角形的對應邊相等。"},{"q":"「若 <i>a<\/i> &gt; <i>b<\/i>，則 <i>a<\/i><sup>2<  class=\"kw\"><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> × 內切圓半徑 × 周長<\/strong>；直角三角形內切圓半徑 <i>r<\/i> = <span class=\"fr\"><span><i>a<\/i> + <i>b<\/i> − <i>c<\/i><\/span><span>2<\/span><\/span>（<i>c<\/i> 為斜邊）。"],"tip":[]},{"h":"重心","li":["三條<strong class=\"kw\">中線<\/strong>交於一點，叫做<strong class=\"kw\">重心<\/strong> G；重心一定在三角形內部。","重心把每條中線分成 <strong class=\"kw\">2 : 1<\/strong>（頂點到重心 : 重心到對邊中點）。","重心與三頂點的連線把三角形分成<strong class=\"kw\">三個面積相等的三角形<\/strong>；三條中線把三角形分成六塊等面積。"],"tip":[]},{"h":"正三角形","li":["正三角形的外心、內心、重心是<strong class=\"kw\">同一點<\/strong>；外接圓半徑是內切圓半徑的 2 倍。"],"tip":["外心找中垂線（到頂點等距），內心找角平分線（到邊等距），重心找中線（分成 2 : 1）。"]}],"ex":[{"q":"直角三角形兩股 6、8，求外接圓與內切圓的半徑。","a":["斜邊 = 10，外心在斜邊中點，外接圓半徑 = 5","內切圓半徑 <i>r<\/i> = <span class=\"fr\"><span>6 + 8 − 10<\/span><span>2<\/span><\/span> = 2"]},{"q":"△ABC 中 ∠A = 64°，I 是內心，求 ∠BIC。","a":["∠BIC = 90° + <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>∠A","= 90° + 32° = 122°"]},{"q":"G 是 △ABC 的重心，D 是 <span class=\"seg\">BC<\/span> 的中點，<span class=\"seg\">AD<\/span> = 15，△ABC 的面積是 60，求 <span class=\"seg\">AG<\/span> 與 △GBC 的面積。","a":["<span class=\"seg\">AG<\/span> : <span class=\"seg\">GD<\/span> = 2 : 1，<span class=\"seg\">AG<\/span> = 15 × <span class=\"fr\"><span>2<\/span><span>3<\/span><\/span> = 10","重心與三頂點連線分成三個等面積的三角形，△GBC = 60 ÷ 3 = 20"]}],"qs":[{"q":"△ABC 中 ∠A = 70°，I 是內心，∠BIC 是幾度？","o":["110","125","140","145"],"a":1,"e":"∠BIC = 90° + <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> × 70° = 125°。"},{"q":"G 是 △ABC 的重心，中線 <span class=\"seg\">AD<\/span> = 12，<span class=\"seg\">AG<\/span> 是多少？","o":["4","6","8","9"],"a":2,"e":"<span class=\"seg\">AG<\/span> : <span class=\"seg\">GD<\/span> = 2 : 1，<span class=\"seg\">AG<\/span> = 12 × <span class=\"fr\"><span>2<\/span><span>3<\/span><\/span> = 8。"},{"q":"哪一種三角形的外心在三角形外部？","o":["鈍角三角形","銳角三角形","直角三角形","正三角形"],"a":0,"e":"銳角在內部、直角在斜邊中點、鈍角在外部。"},{"q":"△ABC 的面積是 36，G 是重心，△GBC 的面積是多少？","o":["6","9","12","18"],"a":2,"e":"重心與三頂點連線分成三個等面積的三角形，36 ÷ 3 = 12 g>。","求法：先找中位數 Q<sub>2<\/sub>，再求前半段的中位數 Q<sub>1<\/sub>、後半段的中位數 Q<sub>3<\/sub>；資料個數是奇數時，<strong class=\"kw\">前後半段都不含中位數<\/strong>。","大約 <strong class=\"kw\">25% 的資料小於 Q<sub>1<\/sub><\/strong>，50% 小於 Q<sub>2<\/sub>，75% 小於 Q<sub>3<\/sub>。"],"tip":[]},{"h":"四分位距","li":["<strong class=\"kw\">四分位距<\/strong> = Q<sub>3<\/sub> − Q<sub>1<\/sub>，表示中間 50% 資料的分散程度，比全距不容易受極端值影響。"],"tip":[]},{"h":"盒狀圖","li":["用最小值、Q<sub>1<\/sub>、Q<sub>2<\/sub>、Q<sub>3<\/sub>、最大值五個數畫成：<strong class=\"kw\">盒子從 Q<sub>1<\/sub> 到 Q<sub>3<\/sub><\/strong>，盒內的線是中位數，兩側的線延伸到最小值與最大值。","盒子越長，<strong class=\"kw\">中間一半的資料越分散<\/strong>；比較兩組資料時可以並排畫。"],"tip":["盒狀圖看不出平均數，也看不出每一筆資料，只看得出這五個數。"]}],"ex":[{"q":"求資料 3、5、6、8、9、11、12、15 的四分位數。","a":["共 8 個，Q<sub>2<\/sub> = (8 + 9) ÷ 2 = 8.5","前半段 3、5、6、8 的中位數 Q<sub>1<\/sub> = 5.5；後半段 9、11、12、15 的中位數 Q<sub>3<\/sub> = 11.5"]},{"q":"求資料 12、15、17、20、22、25、30 的全距與四分位距。","a":["全距 = 30 − 12 = 18","中位數是 20；前半段 12、15、17 的中位數 Q<sub>1<\/sub> = 15，後半段 22、25、30 的中位數 Q<sub>3<\/sub> = 25，四分位距 = 10"]},{"q":"某盒狀圖的最小值 30、Q<sub>1<\/sub> = 52、Q<sub>2<\/sub> = 60、Q<sub>3<\/sub> = 71、最大值 95，大約有多少比例的資料在 60 分以上？","a":["Q<sub>2<\/sub> 就是中位數 60","大約一半（50%）的資料在 60 分以上"]}],"qs":[{"q":"資料 2、4、7、8、10、13、15 的 Q<sub>1<\/sub> 是多少？","o":["3","4","5.5","7"],"a":1,"e":"共 7 個，中位數是 8；前半段 2、4、7（不含 8）的中位數是 4。"},{"q":"資料 2、4、7、8、10、13、15 的四分位距是多少？","o":["6","9","11","13"],"a":1,"e":"後半段 10、13、15 的中位數 Q<sub>3<\/sub> = 13，四分位距 = 13 − 4 = 9。"},{"q":"盒狀圖中，盒子的左右兩端分別代表什麼？","o":["Q<sub>1<\/sub> 與 Q<sub>3<\/sub>","最小值與最大值","平均數與中位數","Q<sub>1<\/sub> 與 Q<sub>2<\/sub>"],"a":0,"e":"盒子從 Q<sub>1<\/sub> 畫到 Q<sub>3<\/sub>，中間的線是 Q<sub>2<\/sub>。"},{"q":"某班 40 人的成績都不相同，Q<sub>1<\/sub> = 60 分，Q<sub>3<\/sub> = 85 分，大約有多少比例的學生分數介於 60 到 85 分之間？","o":["25%","50%","75%","85%"],"a":1,"e":"Q<sub>1<\/sub> 到 Q<sub>3<\/sub> 之間大約是中間 50% 的資料。"},{"q":"資料 3、7、8、12、20 的全距是多少？","o":["9","12","17","20"],"a":2,"e":"20 − 3 = 17。"},{"q":"資料 1、3、5、7、9、11 的中位數（Q<sub>2<\/sub>）是多少？","o":["5","6","7","36"],"a":1,"e":"共 6 個，中位數 = (5 + 7) ÷ 2 = 6。"},{"q":"資料 const SEM = ['', '七上', '七下', '八上', '八下', '九上', '九下'];
const SNAME = {N:'數與量', A:'代數與函數', G:'幾何', D:'統計與機率'};
const L4 = ['A','B','C','D'];
const SECS = [], BYK = {};
DATA.books.forEach(b => b.chs.forEach(c => c.secs.forEach(s => { const o = {...s, b, c}; o.i = SECS.length; SECS.push(o); BYK[s.k] = o; })));
const C = DATA.c;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const strip = s => String(s).replace(/<[^>]+>/g, '');

/* ---------- state ---------- */
const KEY = 'mathGrid.v1', ROUND = 6;
let st = {first:{}, wrong:{}, cor:{}, done:{}, best:{}, round:{}, fz:0};
try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {}
if (st.ans) { for (const id in st.ans) if (st.ans[id] && st.ans[id].ok) st.cor[id] = 1; delete st.ans; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function qcount(k){ return C[k] ? C[k].qs.length : 0; }
function okCount(k){ let n = 0; for (let i = 0; i < qcount(k); i++) if (st.cor[k + '.' + i]) n++; return n; }
function isDone(k){ return !!st.done[k]; }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newRound(k){
  const n = qcount(k), pick = shuffle([...Array(n).keys()]).slice(0, Math.min(ROUND, n)), p = {};
  pick.forEach(i => { p[i] = shuffle([...Array(C[k].qs[i].o.length).keys()]); });
  return (st.round[k] = {q: pick, p, a: {}});
}
function getRound(k){
  const r = st.round[k], n = qcount(k);
  if (!r || !Array.isArray(r.q) || r.q.length !== Math.min(ROUND, n) || r.q.some(i => i >= n || !r.p[i])) { newRound(k); save(); }
  return st.round[k];
}
function roundStat(k){ const r = getRound(k), done = r.q.filter(i => r.a[i]).length, ok = r.q.filter(i => r.a[i] && r.a[i].ok).length; return {r, done, ok, all: r.q.length}; }
function starHTML(n){ return '<span class="stars" title="會考重要度（依 106–115 年題數）">' + '★'.repeat(n) + '<b>' + '★'.repeat(5 - n) + '</b></span>'; }

/* ---------- font size ---------- */
const FZ = ['標準','大','特大'];
function applyFz(){ document.documentElement.classList.remove('fz1','fz2'); if (st.fz) document.documentElement.classList.add('fz' + st.fz); $('#fzBtn').textContent = '字級：' + FZ[st.fz]; }
$('#fzBtn').addEventListener('click', () => { st.fz = (st.fz + 1) % 3; save(); applyFz(); });
applyFz();

/* ---------- views ---------- */
function strandBar(){
  const t = Object.values(DATA.strand).reduce((a, v) => a + v[0], 0);
  const order = ['N','A','G','D'];
  return `<div class="bar4" role="img" aria-label="會考十年各類題數比例">${order.map(k => `<div class="st-${k}" style="flex:${DATA.strand[k][0]}"></div>`).join('')}</div>
  <div class="legend4">${order.map(k => `<span><i class="dot st-${k}" style="padding:0"></i>${SNAME[k]} ${(100 * DATA.strand[k][0] / t).toFixed(1)}%</span>`).join('')}</div>`;
}
function home(){
  const total = SECS.length, written = SECS.filter(s => C[s.k]).length;
  const doneN = SECS.filter(s => isDone(s.k)).length;
  const qAll = SECS.reduce((a, s) => a + qcount(s.k), 0), qOk = SECS.reduce((a, s) => a + okCount(s.k), 0);
  const grade = (g, b1) => `<section class="grade"><h2>${g}年級</h2><div class="sems">${[b1, b1 + 1].map(b => {
    const B = DATA.books[b - 1];
    return `<div class="card sem"><h3><a href="#b${b}">${B.sem}</a><span class="muted small">${B.vol}</span></h3><ul class="chl">${B.chs.map(c => {
      const ks = c.secs.map(s => s.k), d = ks.filter(isDone).length;
      return `<li><a href="#s${c.secs[0].k}"><i class="dot st-${c.st}" style="padding:0"></i><span>第 ${c.no} 章 ${esc(c.pub[0])}<div class="pbar"><i style="width:${100 * d / ks.length}%"></i></div></span><span class="small muted">會考 ${c.n} 題</span></a></li>`;
    }).join('')}</ul></div>`;
  }).join('')}</div></section>`;
  return `<div class="stack">
  <div class="hero"><div class="eyebrow">國中數學 ・ 108 課綱 ・ 對照翰林、康軒、南一</div><h1>數學方格簿</h1>
  <p class="lead">七到九年級共 6 冊、24 章、${total} 個單元。每個單元有重點整理、圖解或互動工具、例題和練習題，並標出這個單元在 106–115 年會考出現過幾題。</p></div>
  <div class="card stack" style="gap:10px"><div class="blk-h" style="margin:0"><h2>我的進度</h2><span class="muted small">存在這台裝置的瀏覽器</span></div>
  <p>完成 <b class="num">${doneN}</b> / ${written} 個單元（隨機抽的一輪題目全對才算完成）；題庫 ${qAll} 題中答對過 <b class="num">${qOk}</b> 題。${Object.keys(st.wrong).length ? `錯題本還有 <a href="#wrong">${Object.keys(st.wrong).length} 題</a>。` : ''}</p></div>
  <div class="card stack" style="gap:8px"><h2>會考十年出題比例</h2><p class="muted small">106–115 年正式會考 275 題，依 108 課綱主題歸類。顏色也標在每一章前面。</p>${strandBar()}</div>
  ${grade('七', 1)}${grade('八', 3)}${grade('九', 5)}
  <div class="foot"><p>內容依 108 課綱與三家出版社的章節順序整理，文字、例題與練習題皆為本站自編。會考題號可到國中教育會考網站查詢原題。</p><p>答題紀錄只存在這台裝置的瀏覽器，清除瀏覽資料會一併清除。</p></div>
  </div>`;
}
function book(b){
  const B = DATA.books[b - 1];
  return `<div class="stack"><div class="crumb"><a href="#home">首頁</a><span>›</span><span>${B.sem}（${B.vol}）</span></div>
  <h1>${B.sem}・${B.vol}</h1>
  ${B.chs.map(c => `<section class="chapter card"><div><div class="eyebrow">第 ${c.no} 章 ・ ${SNAME[c.st]}</div><h2>${esc(c.pub[0])}</h2></div>
    <div class="pubs"><span>翰林：${esc(c.pub[0])}</span><span>康軒：${esc(c.pub[1])}</span><span>南一：${esc(c.pub[2])}</span><span>會考 10 年 ${c.n} 題</span></div>
    <div class="secl">${c.secs.map(s => `<a href="#s${s.k}"><span class="no">${s.no || '第 ' + c.no + ' 章'}</span><b>${esc(s.t)}</b><span class="meta"><span>${starHTML(s.imp)}</span><span>${isDone(s.k) ? '<span class="done">✓ 完成</span>' : C[s.k] ? '答對過 ' + okCount(s.k) + ' / ' + qcount(s.k) + ' 題' : '整理中'}</span></span></a>`).join('')}</div>
  </section>`).join('')}
  <div class="pager">${b > 1 ? `<a href="#b${b - 1}">← ${SEM[b - 1]}</a>` : '<span></span>'}${b < 6 ? `<a href="#b${b + 1}">${SEM[b + 1]} →</a>` : ''}</div></div>`;
}
const CHEER = ['答對了！', '太棒了！', '好厲害！', '完全正確！', '漂亮！', '繼續保持！'];
function qHTML(k, i, q, n, perm, a, mode){
  const id = k + '.' + i, disp = perm.map(o => o);
  return `<div class="q${a ? ' locked' : ''}" data-q="${id}" data-m="${mode}" data-p="${perm.join('')}"><p><span class="qn">${n}.</span>${q.q}</p>
  <div class="opts">${disp.map((o, j) => `<button type="button" data-i="${o}"${a ? ' disabled' : ''} class="${a ? (o === a.c ? (a.ok ? 'ok' : 'no') : (!a.ok && o === q.a ? 'ans' : '')) : ''}"><span class="L">(${L4[j]})</span><span>${q.o[o]}</span></button>`).join('')}</div>
  <div class="fb${a ? (a.ok ? ' ok' : ' no') : ''}"${a ? '' : ' hidden'}>${a ? fbHTML(q, a.ok, perm) : ''}</div></div>`;
}
function fbHTML(q, ok, perm){ return ok ? `<b>${CHEER[Math.floor(Math.random() * CHEER.length)]}</b>${q.e}` : `<b>再想想。</b>正確答案是 (${L4[perm.indexOf(q.a)]})。${q.e}`; }
function quizHTML(k){
  const {r, done, ok, all} = roundStat(k), d = C[k];
  return `<div class="blk-h"><h2>練習</h2><span class="muted small">題庫 ${d.qs.length} 題，每次隨機抽 ${all} 題</span><button class="btn" type="button" data-act="new" style="margin-left:auto">換一組題目</button></div>
  <div class="qbar"><span id="qprog">${progText(done, ok, all)}</span>${isDone(k) ? '<span class="chip okchip">✓ 曾經整輪全對</span>' : ''}</div>
  <div class="stack" style="gap:12px">${r.q.map((i, j) => qHTML(k, i, d.qs[i], j + 1, r.p[i], r.a[i], 'r')).join('')}</div>

/* 畢氏定理 */

/* 十字交乘 */
WN.cross = '輸入 ax² + bx + c 的係數，找整數的十字交乘分解';
W.cross = el => {
  const p = 'w' + (++uid), n = (id, v) => `<input type="number" id="${p}${id}" value="${v}" style="width:4.5em">`;
  mount(el, `<div class="ctrl"><span>${n('a', 2)} x<sup>2</sup> + ${n('b', 5)} x + ${n('c', -3)}</span></div><div class="out" id="${p}o"></div>`, () => {
    const a = intIn($('#' + p + 'a'), 0), b = intIn($('#' + p + 'b'), 0), c = intIn($('#' + p + 'c'), 0), o = $('#' + p + 'o');
    if (!a || Math.abs(a) > 200 || Math.abs(b) > 2000 || Math.abs(c) > 2000) { o.innerHTML = 'a 不能是 0，係數請在 ±2000 以內'; return; }
    const g0 = gcd(gcd(a, b), c) * (a < 0 ? -1 : 1), A = a / g0, B = b / g0, Cc = c / g0;
    const term = (u, v) => `(${u === 1 ? '' : u === -1 ? '−' : u}x ${v < 0 ? '−' : '+'} ${Math.abs(v)})`;
    let hit = null;
    if (Cc === 0) hit = 'zero';
    for (let pp = 1; !hit && pp <= Math.abs(A); pp++) if (A % pp === 0) { const r = A / pp;
      for (let q = -Math.abs(Cc); q <= Math.abs(Cc); q++) if (q && Cc % q === 0) { const s2 = Cc / q; if (pp * s2 + q * r === B) { hit = [pp, q, r, s2]; break; } } }
    const pre = g0 === 1 ? '' : (g0 === -1 ? '−' : g0);
    if (hit === 'zero') o.innerHTML = `<span>常數項是 0，直接提公因式：${pre}x(${A === 1 ? '' : A}x ${B < 0 ? '−' : '+'} ${Math.abs(B)})</span>`;
    else if (hit) { const [pp, q, r, s2] = hit;
      const pn = v => v < 0 ? `(${sgn(v)})` : `${v}`;
      o.innerHTML = `<span>${g0 !== 1 ? `先提出公因數 ${sgn(g0)}：${g0 === -1 ? '−' : g0}(${A}x² ${B < 0 ? '−' : '+'} ${Math.abs(B)}x ${Cc < 0 ? '−' : '+'} ${Math.abs(Cc)})<br>` : ''}拆 ${A} = ${pp} × ${r}，${sgn(Cc)} = ${pn(q)} × ${pn(s2)}</span>
      <span>交叉相乘：${pp} × ${pn(s2)} + ${pn(q)} × ${r} = ${sgn(pp * s2 + q * r)}，等於一次項係數 ${sgn(B)} ✓</span><span><b>${pre}${term(pp, q)}${term(r, s2)}</b></span>`; }
    else o.innerHTML = `<span>找不到整數組合使交叉相乘的和等於 ${sgn(B)}：這個式子在整數範圍內無法用十字交乘分解。</span><span class="small muted">判別式 b² − 4ac = ${b * b - 4 * a * c}${b * b - 4 * a * c >= 0 && Number.isInteger(Math.sqrt(b * b - 4 * a * c)) ? '' : '，不是完全平方數'}</span>`;
  });
};
/* 一元二次方程式 */
WN.quad = '輸入 ax² + bx + c = 0 的係數，看判別式與解';
W.quad = el => {
  const p = 'w' + (++uid), n = (id, v) => `<input type="number" id="${p}${id}" value="${v}" style="width:4.5em">`;
  mount(el, `<div class="ctrl"><span>${n('a', 1)} x<sup>2</sup> + ${n('b', -4)} x + ${n('c', 1)} = 0</span></div><div class="out" id="${p}o"></div>`, () => {
    const a = intIn($('#' + p + 'a'), 0), b = intIn($('#' + p + 'b'), 0), c = intIn($('#' + p + 'c'), 0), o = $('#' + p + 'o');
    if (!a) { o.innerHTML = 'a 不能是 0（否則不是一元二次方程式）'; return; }
    const D = b * b - 4 * a * c;
    let res;
    if (D < 0) res = '判別式小於 0，<b>沒有解</b>。';
    else { const [k, m] = D === 0 ? [0, 1] : sq(D), den = 2 * a;
      if (m === 1) { const r1 = (-b + k) / den, r2 = (-b - k) / den, fr = v => { const nu = Math.round(v * den), g = gcd(nu, den) || 1; let N = nu / g, M = den / g; if (M < 0) { N = -N; M = -M; } return M === 1 ? sgn(N) : `${N < 0 ? '−' : ''}${Math.abs(N)}/${M}`; };
        res = D === 0 ? `判別式 = 0，<b>重根 x = ${fr(r1)}</b>` : `判別式 = ${D} 是完全平方數，<b>x = ${fr(r1)} 或 x = ${fr(r2)}</b>（也可以用因式分解）`; }
      else { const g = gcd(gcd(b, k), den), sg = den / g < 0 ? -1 : 1, B2 = -b / g * sg, K2 = k / g, M2 = den / g * sg;
        res = `判別式 = ${D}，兩相異根：<b>x = ${M2 === 1 ? '' : '('}${B2 ? sgn(B2) + ' ± ' : '±'}${rtH(K2, m)}${M2 === 1 ? '' : ') / ' + M2}</b><br><span class="small">≈ ${fmt((-b + Math.sqrt(D)) / den, 3)}、${fmt((-b - Math.sqrt(D)) / den, 3)}</span>`; } }
    const pn = v => v < 0 ? `(${sgn(v)})` : `${v}`;
    o.innerHTML = `<span>b<sup>2</sup> − 4ac = ${pn(b)}<sup>2</sup> − 4 × ${pn(a)} × ${pn(c)} = ${sgn(D)}</span><span>${res}</span><span class="small muted">公式解：x = (−b ± √(b² − 4ac)) ÷ 2a</span>`;
  });
};

  el.innerHTML = `<div class="ctrl"><label><input type="checkbox" id="${p}o" checked> 外心 O</label><label><input type="checkbox" id="${p}i"> 內心 I</label><label><input type="checkbox" id="${p}g"> 重心 G</label></div>
    <svg class="plot" id="${p}s" viewBox="0 0 270 240" role="img" aria-label="可拖動頂點的三角形" style="touch-action:none"><g id="${p}d"></g></svg><div class="out" id="${p}t"></div>`;
  const svg = $('#' + p + 's');
  const dist = (P1, P2) => Math.hypot(P1[0] - P2[0], P1[1] - P2[1]);
  const draw = () => {
    const [A, B, C] = V, a = dist(B, C), b = dist(C, A), c = dist(A, B), D = 2 * (A[0] * (B[1] - C[1]) + B[0] * (C[1] - A[1]) + C[0] * (A[1] - B[1]));
    let g = `<polygon points="${V.map(q => q.join(',')).join(' ')}" fill="var(--fig-a)" stroke="var(--ink)" stroke-width="1.5"/>`, txt = [];
    const big = Math.max(a, b, c), rest = a * a + b * b + c * c - big * big, kind = Math.abs(rest - big * big) < 0.02 * big * big ? '直角' : rest > big * big ? '銳角' : '鈍角';
    if (Math.abs(D) > 1) {
      if ($('#' + p + 'o').checked) { const s2 = q => q[0] * q[0] + q[1] * q[1], ox = (s2(A) * (B[1] - C[1]) + s2(B) * (C[1] - A[1]) + s2(C) * (A[1] - B[1])) / D, oy = (s2(A) * (C[0] - B[0]) + s2(B) * (A[0] - C[0]) + s2(C) * (B[0] - A[0])) / D, R = dist([ox, oy], A);
        [[A, B], [B, C], [C, A]].forEach(([U, W2]) => { const mx = (U[0] + W2[0]) / 2, my = (U[1] + W2[1]) / 2; g += `<line x1="${mx}" y1="${my}" x2="${ox}" y2="${oy}" stroke="var(--p1)" stroke-dasharray="4 3"/>`; });
        g += `<circle cx="${ox}" cy="${oy}" r="${R}" fill="none" stroke="var(--p1)" stroke-width="1.5"/><circle cx="${ox}" cy="${oy}" r="4" fill="var(--p1)"/><text class="lbl" x="${ox + 6}" y="${oy - 6}">O</text>`;
        txt.push(`外心 O 到三頂點等距，是外接圓的圓心；${kind}三角形的外心在${kind === '銳角' ? '三角形內部' : kind === '直角' ? '斜邊中點' : '三角形外部'}`); }
      if ($('#' + p + 'i').checked) { const s = a + b + c, ix = (a * A[0] + b * B[0] + c * C[0]) / s, iy = (a * A[1] + b * B[1] + c * C[1]) / s, r = Math.abs(D) / 2 / (s / 2);
        V.forEach(q => g += `<line x1="${q[0]}" y1="${q[1]}" x2="${ix}" y2="${iy}" stroke="var(--p2)" stroke-dasharray="4 3"/>`);
        g += `<circle cx="${ix}" cy="${iy}" r="${r}" fill="none" stroke="var(--p2)" stroke-width="1.5"/><circle cx="${ix}" cy="${iy}" r="4" fill="var(--p2)"/><text class="lbl" x="${ix + 6}" y="${iy + 14}">I</text>`;
        txt.push('內心 I 到三邊等距，是內切圓的圓心，一定在三角形內部'); }
      if ($('#' + p + 'g').checked) { const gx = (A[0] + B[0] + C[0]) / 3, gy = (A[1] + B[1] + C[1]) / 3;
        V.forEach((q, i) => { const o1 = V[(i + 1) % 3], o2 = V[(i + 2) % 3]; g += `<line x1="${q[0]}" y1="${q[1]}" x2="${(o1[0] + o2[0]) / 2}" y2="${(o1[1] + o2[1]) / 2}" stroke="var(--ic)" stroke-dasharray="4 3"/>`; });
        g += `<circle cx="${gx}" cy="${gy}" r="4" fill="var(--ic)"/><text class="lbl" x="${gx - 14}" y="${gy - 6}">G</text>`;
        txt.push('重心 G 是三條中線的交點，把每條中線分成 2 : 1，一定在三角形內部'); }
    }
    V.forEach((q, i) => g += `<circle cx="${q[0]}" cy="${q[1]}" r="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5" style="cursor:grab"/><text class="lbl" x="${q[0]}" y="${q[1] + 4}" text-anchor="middle">${'ABC'[i]}</text>`);
    $('#' + p + 'd').innerHTML = g;
    $('#' + p + 't').innerHTML = `<span>這是<b>${kind}三角形</b>（拖動 A、B、C 試試看）</span>` + txt.map(x => `<span>${x}</span>`).join('');
  };
  const toSvg = e => { const r = svg.getBoundingClientRect(); return [Math.max(10, Math.min(260, (e.clientX - r.left) * 270 / r.width)), Math.max(10, Math.min(230, (e.clientY - r.top) * 240 / r.height))]; };
  svg.addEventListener('pointerdown', e => { const q = toSvg(e); let best = 22; V.forEach((v, i) => { const d = dist(v, q); if (d < best) { best = d; drag = i; } }); if (drag >= 0) svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => { if (drag < 0) return; V[drag] = toSvg(e); draw(); });
  ['pointerup', 'pointercancel'].forEach(t => svg.addEventListener(t, () => { drag = -1; }));
  el.addEventListener('change', draw); draw();
};
/* 二次函數 */
WN.quadfun = '調整 a、h、k，看 y = a(x − h)² + k 的圖形';
W.quadfun = el => {
  const p = 'w' + (++uid);
  mount(el, `<div class="ctrl"><label>a = <input type="range" id="${p}a" min="-3" max="3" step="0.5" value="1"></label><label>h = <input type="range" id="${p}h" min="-5" max="5" step="1" value="2"></label><label>k = <input type="range" id="${p}k" min="-6" max="6" step="1" value="-4"></label></div><div id="${p}o"></div>`, () => {
    let a = +$('#' + p + 'a').value; if (!a) a = 0.5;
    const h = +$('#' + p + 'h').value, k = +$('#' + p + 'k').value, P = plane({x0: -8, x1: 8, y0: -8, y1: 8});
    let d = '', on = false;
    for (let x = -8; x <= 8.001; x += 0.05) { const y = a * (x - h) ** 2 + k; if (y >= -8.5 && y <= 8.5) { d += (on ? 'L' : 'M') + P.X(x).toFixed(1) + ' ' + P.Y(y).toFixed(1); on = true; } else on = false; }
    let inner = `<line x1="${P.X(h)}" x2="${P.X(h)}" y1="${P.Y(-8)}" y2="${P.Y(8)}" stroke="var(--muted)" stroke-dasharray="5 4"/><path d="${d}" stroke="var(--p1)" stroke-width="2.4" fill="none"/><circle cx="${P.X(h)}" cy="${P.Y(k)}" r="5" fill="var(--ic)"/>`;
    const disc = -k / a, roots = disc > 0 ? [h - Math.sqrt(disc), h + Math.sqrt(disc)] : disc === 0 ? [h] : [];
    const fa = a === 1 ? '' : a === -1 ? '−' : fmt(a), xp = h === 0 ? 'x' : `(x ${h > 0 ? '−' : '+'} ${Math.abs(h)})`, kp = k === 0 ? '' : ` ${k > 0 ? '+' : '−'} ${Math.abs(k)}`;
    $('#' + p + 'o').innerHTML = svgWrap(P, inner, '二次函數圖形') + `<div class="out"><span><b>y = ${fa}${xp}<sup>2</sup>${kp}</b>，開口${a > 0 ? '向上' : '向下'}${Math.abs(a) > 1 ? '、比 y = x² 窄' : Math.abs(a) < 1 ? '、比 y = x² 寬' : ''}</span><span>頂點 (${sgn(h)}, ${sgn(k)})，對稱軸 x = ${sgn(h)}</span><span>x = ${sgn(h)} 時有<b>${a > 0 ? '最小值' : '最大值'} ${sgn(k)}</b></span><span>與 x 軸${roots.length === 2 ? `交於兩點，x ≈ ${fmt(roots[0])}、${fmt(roots[1])}` : roots.length === 1 ? `相切於 (${sgn(h)}, 0)` : '沒有交點'}；與 y 軸交於 (0, ${fmt(a * h * h + k)})</span></div>`;
  });
};
/* 盒狀圖 */
WN.boxplot = '輸入一組數，求四分位數並畫盒狀圖';
const median = s => { const n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
W.boxplot = el => {
  const p = 'w' + (++uid);
  mount(el, `<div class="ctrl" style="display:block"><label for="${p}t" class="small muted">用空格或逗號分開</label><textarea id="${p}t">35 42 48 50 53 57 60 62 66 71 88</textarea></div><div id="${p}o"></div>`, () => {
    const s = ($('#' + p + 't').value.match(/-?\d+(\.\d+)?/g) || []).map(Number).sort((x, y) => x - y), n = s.length, o = $('#' + p + 'o');
    if (n < 4) { o.innerHTML = '<div class="out">請至少輸入 4 個數</div>'; return; }
    const lo = s.slice(0, Math.floor(n / 2)), hi = s.slice(Math.ceil(n / 2)), q1 = median(lo), q2 = median(s), q3 = median(hi), mn = s[0], mx = s[n - 1];
    const span = mx - mn || 1, X = v => 20 + (v - mn) / span * 380;
    const svg = `<svg class="plot" viewBox="0 0 420 92" role="img" aria-label="盒狀圖"><line x1="${X(mn)}" x2="${X(q1)}" y1="40" y2="40" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(q3)}" x2="${X(mx)}" y1="40" y2="40" stroke="var(--ink)" stroke-width="1.5"/>
      <rect x="${X(q1)}" y="22" width="${Math.max(1, X(q3) - X(q1))}" height="36" fill="var(--fig-a)" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(q2)}" x2="${X(q2)}" y1="22" y2="58" stroke="var(--ic)" stroke-width="2.5"/>
      ${[mn, mx].map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="30" y2="50" stroke="var(--ink)" stroke-width="1.5"/>`).join('')}
      ${[[mn, '最小'], [q1, 'Q₁'], [q2, 'Q₂'], [q3, 'Q₃'], [mx, '最大']].map(([v, t], i) => `<text x="${X(v)}" y="${i % 2 ? 14 : 76}" text-anchor="middle">${t} ${fmt(v)}</text>`).join('')}</svg>`;
    o.innerHTML = svg + `<div class="out"><span>由小到大（${n} 個）：${s.join('、')}</span><span>Q<sub>2</sub>（中位數）= ${fmt(q2)}；前半段 ${lo.join('、')} 的中位數 Q<sub>1</sub> = ${fmt(q1)}；後半段 ${hi.join('、')} 的中位數 Q<sub>3</sub> = ${fmt(q3)}</span><span>全距 = ${fmt(mx)} − ${fmt(mn)} = <b>${fmt(mx - mn)}</b>；四分位距 = Q<sub>3</sub> − Q<sub>1</sub> = <b>${fmt(q3 - q1)}</b></span><span class="small muted">資料個數是奇數時，前後半段都不含中位數本身。</span></div>`;
  });
};
/* 機率模擬 */
WN.prob = '重複做實驗，比較實際出現的比例與理論機率';
W.prob = el => {
  const p = 'w' + (++uid), EXP = [
    ['擲一枚硬幣，出現正面', 1, 2, () => Math.random() < 0.5],
    ['擲一顆骰子，出現 6 點', 1, 6, () => Math.floor(Math.random() * 6) === 5],
    ['擲兩顆骰子，點數和為 7', 6, 36, () => Math.floor(Math.random() * 6) + Math.floor(Math.random() * 6) + 2 === 7],
    ['擲兩枚硬幣，兩枚都是正面', 1, 4, () => Math.random() < 0.5 && Math.random() < 0.5]];
  let n = 0, hit = 0;
  el.innerHTML = `<div class="ctrl"><label><select id="${p}e">${EXP.map((x, i) => `<option value="${i}">${x[0]}</option>`).join('')}</select></label></div><div class="ctrl">${[10, 100, 1000].map(k => `<button class="btn" type="button" data-k="${k}">做 ${k} 次</button>`).join('')}<button class="btn" type="button" data-k="0">重設</button></div><div class="out" id="${p}o"></div>`;
  const show = () => { const e = EXP[+$('#' + p + 'e').value], th = e[1] / e[2];
    $('#' + p + 'o').innerHTML = `<span>理論機率 = ${e[1]} / ${e[2]} ≈ <b>${th.toFixed(4)}</b></span><span>已做 ${n} 次，成功 ${hit} 次，相對次數 = ${n ? (hit / n).toFixed(4) : '—'}</span>
      <svg class="plot" viewBox="0 0 420 50" role="img" aria-label="相對次數與理論機率"><rect x="10" y="12" width="400" height="14" fill="var(--line)"/><rect x="10" y="12" width="${n ? 400 * hit / n : 0}" height="14" fill="var(--p1)"/><line x1="${10 + 400 * th}" x2="${10 + 400 * th}" y1="6" y2="32" stroke="var(--ic)" stroke-width="2.5"/><text x="${10 + 400 * th}" y="45" text-anchor="middle">理論值</text></svg>
      <span class="small muted">次數越多，相對次數通常越接近理論機率，但每次實驗結果都可能不同。</span>`; };
  el.addEventListener('click', ev => { const b = ev.target.closest('button[data-k]'); if (!b) return; const k = +b.dataset.k, e = EXP[+$('#' + p + 'e').value]; if (!k) { n = hit = 0; } else { for (let i = 0; i < k; i++) if (e[3]()) hit++; n += k; } show(); });
  el.addEventListener('change', () => { n = hit = 0; show(); }); show();
};
/* 立體圖形 */
WN.solid = '選一種立體圖形，輸入尺寸，算表面積與體積';
W.solid = el => {
  const p = 'w' + (++uid), n = (id, l, v) => `<label>${l} <input type="number" id="${p}${id}" value="${v}" min="0" step="any" style="width:4.5em"></label>`;
  const cone = el.dataset.o === 'cone';
  mount(el, `<div class="ctrl"><label><select id="${p}k"><option value="0">長方體（直角柱）</option><option value="1">直圓柱</option><option value="2"${cone ? ' selected' : ''}>正四角錐</option><option value="3">直圓錐</option></select></label></div><div class="ctrl" id="${p}in"></div><div class="out" id="${p}o"></div>`, () => {
    const k = +$('#' + p + 'k').value, box = $('#' + p + 'in');
    const want = [['長 a', '寬 b', '高 h'], ['底面半徑 r', '高 h'], ['底邊 a', '斜高 l'], ['底面半徑 r', '母線長 l']][k];
    if (box.dataset.k !== String(k)) { box.dataset.k = k; box.innerHTML = want.map((l, i) => n('v' + i, l, [[6, 4, 5], [3, 10], [6, 5], [3, 5]][k][i])).join(''); }
    const v = want.map((_, i) => Math.max(0, parseFloat($('#' + p + 'v' + i).value) || 0)), o = $('#' + p + 'o');
    if (k === 0) { const [a, b, h] = v; o.innerHTML = `<span>表面積 = 2(ab + bh + ah) = 2(${a * b} + ${b * h} + ${a * h}) = <b>${fmt(2 * (a * b + b * h + a * h))}</b></span><span>體積 = 底面積 × 高 = ${a} × ${b} × ${h} = <b>${fmt(a * b * h)}</b></span>`; }
    else if (k === 1) { const [r, h] = v; o.innerHTML = `<span>展開圖：兩個半徑 ${r} 的圓 + 長 2πr、寬 ${h} 的長方形</span><span>表面積 = 2πr² + 2πrh = ${fmt(2 * r * r)}π + ${fmt(2 * r * h)}π = <b>${fmt(2 * r * r + 2 * r * h)}π</b> ≈ ${fmt((2 * r * r + 2 * r * h) * Math.PI)}</span><span>體積 = 底面積 × 高 = πr²h = <b>${fmt(r * r * h)}π</b> ≈ ${fmt(r * r * h * Math.PI)}</span>`; }
    else if (k === 2) { const [a, l] = v; o.innerHTML = `<span>展開圖：一個邊長 ${a} 的正方形 + 4 個底 ${a}、高 ${l} 的等腰三角形</span><span>表面積 = a² + 4 × (a × l ÷ 2) = ${fmt(a * a)} + ${fmt(2 * a * l)} = <b>${fmt(a * a + 2 * a * l)}</b></span>`; }
    else { const [r, l] = v; o.innerHTML = l <= r ? '<span>母線長必須大於底面半徑</span>' : `<span>展開圖：底面圓 + 半徑 ${l} 的扇形，扇形弧長 = 底面圓周長 2πr</span><span>扇形圓心角 = 360° × r ÷ l = 360° × ${r} ÷ ${l} = <b>${fmt(360 * r / l)}°</b></span><span>側面積 = πrl = ${fmt(r * l)}π；表面積 = πr² + πrl = <b>${fmt(r * r + r * l)}π</b> ≈ ${fmt((r * r + r * l) * Math.PI)}</span>`; }
  });
};

route();
</script>
