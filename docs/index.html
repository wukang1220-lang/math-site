<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>數學方格簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif:ital@1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: graph-paper notebook. Sticky top bar, one reading column (max 860px); section pages read top→bottom: 重點 → 圖解 → 動手試 → 例題 → 練習 */
:root{
  --bg:#f3f6f5; --paper:#fcfdfc; --ink:#15201f; --ink-2:#465452; --muted:#6f7c7a; --line:#d9e2e0;
  --grid:rgba(15,82,87,.075); --accent:#0f5257; --accent-soft:#e2eeed; --kw:#c0281f;
  --ok:#1b7a3a; --ok-soft:#e3f3e8; --bad:#b4232c; --bad-soft:#fbe7e7;
  --s-N:#2a78d6; --s-A:#eb6834; --s-G:#1baf7a; --s-D:#eda100; --p1:#2a78d6; --p2:#eb6834;
  --fig-ink:var(--ink); --fig-soft:var(--muted); --fig-line:var(--line); --fig-paper:var(--paper);
  --ic:#e8590c; --fig-a:#dceafb; --fig-b:#ffe6d2; --fig-c:#d6f2e2;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-var:"Noto Serif","Cambria","Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --fz:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1413; --paper:#161d1c; --ink:#e9efee; --ink-2:#b5c1bf; --muted:#8a9694; --line:#2a3432;
  --grid:rgba(124,200,204,.06); --accent:#7cc8cc; --accent-soft:#1a2a2a; --kw:#ff8a7a;
  --ok:#5fd18a; --ok-soft:#173523; --bad:#ff8a8a; --bad-soft:#3a1b1d;
  --s-N:#3987e5; --s-A:#d95926; --s-G:#199e70; --s-D:#c98500; --p1:#3987e5; --p2:#d95926;
  --ic:#ff922b; --fig-a:#1d3554; --fig-b:#4d2e17; --fig-c:#1b4230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1413; --paper:#161d1c; --ink:#e9efee; --ink-2:#b5c1bf; --muted:#8a9694; --line:#2a3432;
  --grid:rgba(124,200,204,.06); --accent:#7cc8cc; --accent-soft:#1a2a2a; --kw:#ff8a7a;
  --ok:#5fd18a; --ok-soft:#173523; --bad:#ff8a8a; --bad-soft:#3a1b1d;
  --s-N:#3987e5; --s-A:#d95926; --s-G:#199e70; --s-D:#c98500; --p1:#3987e5; --p2:#d95926;
  --ic:#ff922b; --fig-a:#1d3554; --fig-b:#4d2e17; --fig-c:#1b4230; color-scheme:dark}
html.fz1{--fz:18px} html.fz2{--fz:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fz);line-height:1.8;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:6px 14px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.brand{font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-block;width:22px;height:22px;border:2px solid var(--accent);border-radius:4px;
  background-image:linear-gradient(var(--accent) 1px,transparent 1px),linear-gradient(90deg,var(--accent) 1px,transparent 1px);background-size:6px 6px;background-position:2px 2px;opacity:.85}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a,.nav button{border:1px solid transparent;background:none;border-radius:6px;padding:3px 10px;text-decoration:none;color:var(--ink-2);cursor:pointer;font-size:.92rem}
.nav a:hover,.nav button:hover{background:var(--accent-soft)}
.nav a.on{border-color:var(--accent);color:var(--accent);font-weight:500}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px}
.col{max-width:860px}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.2rem)} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}
.stack{display:grid;gap:18px}
.eyebrow{font-size:.8rem;letter-spacing:.1em;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--ink-2);background:var(--paper)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.st-N{background:var(--s-N)}.st-A{background:var(--s-A)}.st-G{background:var(--s-G)}.st-D{background:var(--s-D)}
.stars{color:var(--ic);letter-spacing:1px;font-size:.85rem}
.stars b{color:var(--line);font-weight:400}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* math markup */
i{font-family:var(--f-var);font-style:italic;font-size:1.04em;padding:0 .04em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.15;margin:0 .15em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.rt{white-space:nowrap}.rt>span{border-top:1px solid currentColor;padding:0 .1em;margin-left:.05em}
.seg,.arc{position:relative;display:inline-block;padding-top:.15em}
.seg{border-top:1px solid currentColor;line-height:1.2}
.arc::before{content:"⌒";position:absolute;left:0;right:0;top:-.72em;text-align:center;font-size:.9em;line-height:1}
.sys{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .2em}
.sys::before{content:"";width:.45em;align-self:stretch;border:1.5px solid currentColor;border-right:0;border-radius:.45em 0 0 .45em;margin-right:.3em}
.eqs{display:inline-flex;flex-direction:column;line-height:1.45}
sup,sub{font-size:.72em;line-height:0}
.kw{color:var(--kw);font-weight:700}
/* home */
.hero{display:grid;gap:10px;padding-block:8px 6px}
.lead{color:var(--ink-2);max-width:44em}
.bar4{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden}
.legend4{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--ink-2)}
.legend4 span{display:inline-flex;align-items:center;gap:6px}
.grade{display:grid;gap:12px}
.sems{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sem h3{display:flex;align-items:baseline;gap:10px}
.sem h3 a{text-decoration:none;color:var(--ink)}
.chl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.chl li a{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink)}
.chl li a:hover{background:var(--accent-soft)}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--ok);padding:0;font-size:0}
/* book */
.chapter{display:grid;gap:10px}
.pubs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.secl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.secl a{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-decoration:none;color:var(--ink)}
.secl a:hover{border-color:var(--accent)}
.secl .no{font-family:var(--f-mono);color:var(--muted);font-size:.82rem}
.secl .meta{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted)}
.done{color:var(--ok);font-weight:700}
/* section */
.crumb{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.crumb a{color:var(--muted)}
.shead{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
details.capd summary{cursor:pointer;color:var(--ink-2);font-size:.88rem}
.capids{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:4px;word-break:break-word}
.rows{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.row{display:grid;grid-template-columns:9.5em 1fr;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .lab{background:var(--accent-soft);padding:12px 14px;font-weight:700;color:var(--accent);display:flex;align-items:center}
.row .body{padding:10px 16px;min-width:0}
.row ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.tip{margin-top:8px;font-size:.92em;color:var(--ink-2);background:var(--bg);border-radius:6px;padding:6px 10px}
.tip::before{content:"小叮嚀";font-weight:700;color:var(--accent);margin-right:8px;font-size:.85em}
@media (max-width:620px){.row{grid-template-columns:1fr}.row .lab{padding:8px 14px}}
.figs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px}
.fig svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
.fig svg text{font-family:var(--f-body)}
.blk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.blk-h h2{font-size:1.15rem}
.ex{border-left:3px solid var(--accent);padding:6px 0 6px 14px;display:grid;gap:6px}
.ex+.ex{margin-top:14px}
.ex .sol{color:var(--ink-2)}
.ex details summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.ex ol{margin:6px 0 0;padding-left:1.4em}
.q{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--paper);display:grid;gap:10px}
.q .qn{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.opts button:hover{border-color:var(--accent)}
.opts button .L{font-family:var(--f-mono);color:var(--muted)}
.opts button.ok{border-color:var(--ok);background:var(--ok-soft)}
.opts button.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:6px;padding:8px 12px;font-size:.95em}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{margin-right:6px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--paper);text-decoration:none;max-width:48%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.empty{color:var(--muted);font-style:normal}
/* widgets */
.tool{display:grid;gap:12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.92rem}
.ctrl label{display:inline-flex;align-items:center;gap:6px}
.ctrl input[type=number],.ctrl input[type=text]{width:6.5em;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.ctrl input[type=range]{width:150px;accent-color:var(--accent)}
.ctrl select{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.ctrl textarea{width:100%;min-height:3.2em;padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.out{background:var(--bg);border-radius:6px;padding:8px 12px;font-size:.95em;display:grid;gap:2px}
.plot{width:100%;max-width:420px;height:auto;display:block;touch-action:manipulation}
.plot text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.plot .lbl{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
/* search & wrong book */
.search{position:relative}
.search input{width:11em;border:1px solid var(--line);border-radius:6px;padding:3px 10px;background:var(--bg)}
.sres{position:absolute;right:0;top:calc(100% + 6px);width:min(340px,86vw);max-height:60vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:20}
.sres a{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink)}
.sres a:hover,.sres a:focus{background:var(--accent-soft)}
.sres small{display:block;color:var(--muted)}
@media (max-width:700px){.top{position:static}.nav{flex-wrap:nowrap;overflow-x:auto;width:100%}.nav a,.nav button{white-space:nowrap}.search,.search input{width:100%}.brand{margin-right:0}}
.foot{margin-top:40px;font-size:.84rem;color:var(--muted);display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== two-column layout ===== */
:root{--hero:#e4f0ef;--on-accent:#ffffff;--r-lg:18px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero:#14292a;--on-accent:#0e1413}}
:root[data-theme="dark"]{--hero:#14292a;--on-accent:#0e1413}
.top-in{max-width:1320px;gap:8px 12px}
.brand span{display:grid;line-height:1.25}
.brand small{font-size:.72rem;color:var(--accent);font-weight:500}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 12px;cursor:pointer;font-size:.9rem;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.pill:hover{border-color:var(--accent)}
.pill-ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}
.page{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 72px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs a,.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 16px;text-decoration:none;color:var(--ink);font-weight:500;cursor:pointer}
.tabs a:hover,.tabs button:hover{border-color:var(--accent)}
.tabs a.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#sideBtn{display:none}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
#main{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 100px);overflow:auto;overscroll-behavior:contain}
.side-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 14px}
.side-h{display:flex;align-items:center;gap:10px;margin:0 6px 12px}
.side-h h2{font-size:1.15rem}
.grid-ic{width:18px;height:18px;flex:none;border:1.5px solid var(--accent);border-radius:3px;background-image:linear-gradient(var(--accent) 1px,transparent 1px),linear-gradient(90deg,var(--accent) 1px,transparent 1px);background-size:5px 5px;background-position:1px 1px;opacity:.85}
.gseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.gseg button{border:0;background:none;border-radius:9px;padding:7px 0;cursor:pointer;color:var(--ink-2);font-weight:500}
.gseg button.on{background:var(--accent);color:var(--on-accent)}
.side-sub{font-size:.86rem;color:var(--ink-2);font-weight:700;margin:16px 8px 4px}
.chs{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.chs .semh{font-size:.76rem;color:var(--muted);letter-spacing:.08em;margin:10px 8px 2px}
.ch{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:500}
.ch .n{width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2);flex:none}
.ch .t{min-width:0}
.ch:hover{background:var(--accent-soft)}
.ch.on{background:var(--accent-soft)}
.ch.on .n{background:var(--accent);color:var(--on-accent)}
.secs{list-style:none;margin:2px 0 6px 21px;padding:0 0 0 10px;border-left:2px solid var(--line);display:grid;gap:1px}
.secs a{display:flex;gap:6px;padding:6px 10px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-size:.92rem}
.secs a:hover{background:var(--bg)}
.secs a.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.ok{color:var(--ok);font-weight:700;margin-left:auto}
.crumb a{text-decoration:none}
.hero2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,1fr);gap:22px;align-items:center;border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;
  background-color:var(--hero);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:right top}
.hero-l{display:grid;gap:8px;min-width:0}
.hero2 h1{font-size:clamp(1.9rem,4.2vw,2.8rem);letter-spacing:.03em}
.codes{font-family:var(--f-mono);color:var(--ink-2);font-size:.86rem;align-self:center}
.secno{color:var(--ink-2);font-size:.92rem}
.sum{font-size:1.04rem;color:var(--ink)}
.exam{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(15,82,87,.08)}
.exam-l{font-size:.82rem;color:var(--muted);letter-spacing:.06em}
.exam-n{font-size:1rem}
.exam-n b{font-family:var(--f-mono);font-size:2.6rem;line-height:1;margin-right:4px}
.pubs{font-size:.86rem;color:var(--muted);margin-top:-6px}
.blk{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.blk>.blk-h h2{font-size:1.2rem}
.blk .ex{border-left:3px solid var(--accent)}
.blk-tool{background:var(--paper)}
.fig{position:relative;margin:0;padding:12px}
.zoom{position:absolute;top:8px;right:8px;font-size:.8rem;padding:2px 10px;z-index:1}
.q{background:var(--bg)}
.opts button{background:var(--paper)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-in{background:var(--paper);border-radius:16px;padding:16px;width:min(980px,100%);max-height:100%;overflow:auto;display:grid;gap:10px}
.modal-h{display:flex;justify-content:space-between;align-items:center}
#figBig svg{display:block;width:100%;height:auto}
#figBig svg text{font-family:var(--f-body)}
#sideBack{display:none}
@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);max-height:none;z-index:30;transform:translateX(-105%);transition:transform .2s ease;background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
  body.side-open .side{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  body.side-open #sideBack{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  #sideBtn{display:inline-flex}
  #mapTab{display:none}
  .hero2{grid-template-columns:1fr;padding:22px}
}

":"3-2","t":"角錐與圓錐","th":"S","st":"G","codes":"S-9-12、S-9-13","cap":["114-12"],"imp":2}]}]}],"c":{"1-1-1":{"rows":[{"h":"數的分類","li":["比 0 大的數叫做<strong class=\"kw\">正數<\/strong>，比 0 小的數叫做負數；正數前面的「＋」可以省略。","0 不屬於正數，也不屬於負數，它是<strong class=\"kw\">正、負數的分界<\/strong>。","正整數、0、負整數合稱<strong class=\"kw\">整數<\/strong>；正整數也叫做自然數。","正負數常用來表示<strong class=\"kw\">意義相反的量<\/strong>，例如零上 8 °C 記為 ＋8，零下 3 °C 記為 −3。"],"tip":["最小的正整數是 1，最大的負整數是 −1；沒有最大的正數，也沒有最小的負數。"]},{"h":"數線","li":["畫數線要先決定三件事：<strong class=\"kw\">原點<\/strong>、正向、單位長。","數線上<strong class=\"kw\">越右邊的點代表的數越大<\/strong>，越左邊越小。","點 P 代表的數是 <i>a<\/i>，就說 <i>a<\/i> 是 P 的<strong class=\"kw\">坐標<\/strong>，寫成 P(<i>a<\/i>)。"],"tip":["要標小數或分數時，先把它們化成同一種寫法，再找位置。"]},{"h":"相反數","li":["在原點兩側、到原點距離相同的兩個數互為<strong class=\"kw\">相反數<\/strong>，例如 7 與 −7。","<strong class=\"kw\">0 的相反數是 0<\/strong>；<i>a<\/i> 的相反數寫成 −<i>a<\/i>。"],"tip":[]},{"h":"絕對值","li":["數 <i>a<\/i> 在數線上的點到原點的距離，叫做 <i>a<\/i> 的<strong class=\"kw\">絕對值<\/strong>，記作 |<i>a<\/i>|。","正數的絕對值是它本身，<strong class=\"kw\">負數的絕對值是它的相反數<\/strong>，|0| = 0。","任何數的絕對值都不小於 0：<strong class=\"kw\">|<i>a<\/i>| ≥ 0<\/strong>。","兩個負數比大小，<strong class=\"kw\">絕對值大的反而小<\/strong>，例如 −8 &lt; −3。"],"tip":["若 |<i>x<\/i>| = 5，則 <i>x<\/i> = 5 或 <i>x<\/i> = −5；若 |<i>a<\/i>| + |<i>b<\/i>| = 0，則 <i>a<\/i> = 0 且 <i>b<\/i> = 0。"]}],"ex":[{"q":"數線上 A(−3)、B(2)，哪一點離原點比較遠？","a":["|−3| = 3，|2| = 2","3 &gt; 2，所以 A 離原點比較遠。"]},{"q":"把 −2.5、3、−4、0、<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> 由小到大排列。","a":["負數小於 0，0 小於正數；兩個負數中 |−4| &gt; |−2.5|，所以 −4 &lt; −2.5。","−4 &lt; −2.5 &lt; 0 &lt; <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> &lt; 3"]},{"q":"若 |<i>x<\/i>| = 3 且 <i>x<\/i> &lt; 0，求 <i>x<\/i>；若 |<i>y<\/i> − 1| = 0，求 <i>y<\/i>。","a":["絕對值是 3 的數有 3 和 −3，又 <i>x<\/i> &lt; 0，所以 <i>x<\/i> = −3。","只有 0 的絕對值是 0，所以 <i>y<\/i> − 1 = 0，<i>y<\/i> = 1。"]}],"qs":[{"q":"下列哪一個數最小？","o":["−2","0","−5","1"],"a":2,"e":"負數中絕對值越大的越小，所以 −5 &lt; −2 &lt; 0 &lt; 1。"},{"q":"若 |<i>x<\/i>| = 6，則 <i>x<\/i> 可能是多少？","o":["6 或 −6","只有 6","只有 −6","0"],"a":0,"e":"到原點距離 6 的點有兩個，坐標分別是 6 和 −6。"},{"q":"下列敘述何者正確？","o":["0 是最小的整數","−1 是最大的負整數","正數的相反數還是正數","絕對值相等的兩數一定相等"],"a":1,"e":"負整數有 −1、−2、−3……，其中 −1 最大。3 與 −3 絕對值相等但不相等。"},{"q":"數線上點 P 在原點左邊 4 個單位，P 的坐標是多少？","o":["4","−4","−3","−5"],"a":1,"e":"原點左邊的點是負數，距離 4 個單位，所以是 −4。"},{"q":"下列哪一個數是負整數？","o":["0","3","−6","−<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>"],"a":2,"e":"−6 小於 0 而且是整數；0 不是負數，−<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> 不是整數。"},{"q":"零上 5 °C 記為 ＋5，零下 12 °C 應該記為多少？","o":["−12","＋12","−7","＋7"],"a":0,"e":"零下表示與零上相反，用負數表示，記為 −12。"},{"q":"下列哪一個數的絕對值最大？","o":["−4","3","−7","5"],"a":2,"e":"四個數的絕對值依序是 4、3、7、5，最大的是 |−7| = 7。"},{"q":"−9 的相反數是多少？","o":["9","−9","<span class=\"fr\"><span>1<\/span><span>9<\/span><\/span>","−<span class=\"fr\"><span>1<\/span><span>9<\/span><\/span>"],"a":0,"e":"在原點另一側、到原點距離相同的數是 9。"},{"q":"若 <i>a<\/i> 的相反數是 −2.5，則 <i>a<\/i> 是多少？","o":["2.5","−2.5","0.4","−0.4"],"a":0,"e":"−2.5 的相反數是 2.5，所以 <i>a<\/i> = 2.5。"},{"q":"數線上，介於 −3 和 5 之間（不含兩端）的整數共有幾個？","o":["6","7","8","9"],"a":1,"e":"有 −2、−1、0、1、2、3、4，共 7 個。"},{"q":"下列哪一個敘述正確？","o":["−0.5 &gt; −1","−3 &gt; −2","|−4| &lt; 0","−1 &lt; −10"],"a":0,"e":"兩個負數比較，絕對值小的較大：|−0.5| &lt; |−1|，所以 −0.5 &gt; −1。"},{"q":"若 |<i>x<\/i>| = 0，則 <i>x<\/i> 是多少？","o":["0","1","−1","1 或 −1"],"a":0,"e":"只有 0 到原點的距離是 0。"},{"q":"數線上與 −2 的距離是 5 的點，代表哪些數？","o":["3 或 −7","只有 3","只有 −7","7 或 −3"],"a":0,"e":"往右 5 單位是 −2 + 5 = 3，往左 5 單位是 −2 − 5 = −7。"},{"q":"若 <i>a<\/i> &lt; 0，則 |<i>a<\/i>| 等於什麼？","o":["−<i>a<\/i>","<i>a<\/i>","0","<i>a<\/i><sup>2<\/sup>"],"a":0,"e":"負數的絕對值是它的相反數，<i>a<\/i> &lt; 0 時 |<i>a<\/i>| = −<i>a<\/i>（是正數）。"},{"q":"把 −3、2、−<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>、0 由小到大排列，正確的是哪一個？","o":["−3 &lt; −<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> &lt; 0 &lt; 2","−<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> &lt; −3 &lt; 0 &lt; 2","−3 &lt; 0 &lt; −<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> &lt; 2","2 &lt; 0 &lt; −<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> &lt; −3"],"a":0,"e":"負數小於 0，0 小於正數；兩個負數中 −3 的絕對值較大，所以較小。"}],"fig":[],"w":"numline","sum":"認識正數與負數，在數線上找位置、比大小、求絕對值。","wo":""},"1-1-2":{"rows":[{"h":"加法","li":["同號兩數相加：<strong class=\"kw\">絕對值相加<\/strong>，再加上它們共同的符號。例：(−6) + (−9) = −15。","異號兩數相加：<strong class=\"kw\">用絕對值大的減絕對值小的<\/strong>，符號跟絕對值較大的數相同。例：(−11) + 4 = −7。","互為相反數的兩數<strong class=\"kw\">相加等於 0<\/strong>：<i>a<\/i> + (−<i>a<\/i>) = 0。"],"tip":[]},{"h":"減法","li":["<strong class=\"kw\">減去一個數，等於加上這個數的相反數<\/strong>：<i>a<\/i> − <i>b<\/i> = <i>a<\/i> + (−<i>b<\/i>)。","<strong class=\"kw\">減去負數變成加正數<\/strong>：5 − (−8) = 5 + 8 = 13。"],"tip":["先把減法都改寫成加法，再用加法規則計算，比較不會漏掉負號。"]},{"h":"數線上兩點的距離","li":["A(<i>a<\/i>)、B(<i>b<\/i>) 兩點的距離 <strong class=\"kw\"><span class=\"seg\">AB<\/span> = |<i>a<\/i> − <i>b<\/i>|<\/strong>，也就是「大的數減小的數」。","例：A(−7)、B(3)，距離 = |−7 − 3| = |−10| = 10。"],"tip":[]},{"h":"中點坐標","li":["A(<i>a<\/i>)、B(<i>b<\/i>) 的<strong class=\"kw\">中點<\/strong>坐標是 <span class=\"fr\"><span><i>a<\/i> + <i>b<\/i><\/span><span>2<\/span><\/span>。","例：A(−7)、B(3)，中點 = <span class=\"fr\"><span>−7 + 3<\/span><span>2<\/span><\/span> = −2。"],"tip":["|<i>x<\/i> − 2| 可以讀成「<i>x<\/i> 與 2 在數線上的距離」，解絕對值的題目時很好用。"]}],"ex":[{"q":"計算 (−15) + 8 − (−6)。","a":["先把減法改成加法：(−15) + 8 + 6","= −7 + 6 = −1"]},{"q":"計算 −7 − (−12) + (−9) − 4。","a":["把減法改成加法：−7 + 12 + (−9) + (−4)","= 5 + (−9) + (−4) = −4 + (−4) = −8"]},{"q":"數線上 A(−9)、B(5)，求 <span class=\"seg\">AB<\/span> 的長與中點 M 的坐標。","a":["<span class=\"seg\">AB<\/span> = |−9 − 5| = 14","M 的坐標 = <span class=\"fr\"><span>−9 + 5<\/span><span>2<\/span><\/span> = −2"]}],"qs":[{"q":"(−12) + (−7) 的值是多少？","o":["−19","−5","5","19"],"a":0,"e":"同號相加，絕對值相加 12 + 7 = 19，符號為負。"},{"q":"7 − (−9) 的值是多少？","o":["16","−2","2","−16"],"a":0,"e":"減去 −9 等於加上 9，7 + 9 = 16。"},{"q":"數線上 A(−5)、B(9)，<span class=\"seg\">AB<\/span> 的長度是多少？","o":["4","7","9","14"],"a":3,"e":"<span class=\"seg\">AB<\/span> = |−5 − 9| = |−14| = 14。"},{"q":"數線上 A(−8)、B(2)，<span class=\"seg\">AB<\/span> 中點的坐標是多少？","o":["−3","−5","3","5"],"a":0,"e":"中點 = <span class=\"fr\"><span>−8 + 2<\/span><span>2<\/span><\/span> = <span class=\"fr\"><span>−6<\/span><span>2<\/span><\/span> = −3。"},{"q":"若 |<i>x<\/i> − 4| = 3，則 <i>x<\/i> 可能是多少？","o":["1 或 7","−1 或 7","1 或 −7","只有 7"],"a":0,"e":"|<i>x<\/i> − 4| = 3 表示 <i>x<\/i> 與 4 的距離是 3，所以 <i>x<\/i> = 4 − 3 = 1 或 <i>x<\/i> = 4 + 3 = 7。"},{"q":"(−8) + 13 的值是多少？","o":["5","−5","21","−21"],"a":0,"e":"異號相加，13 − 8 = 5，符號跟絕對值大的 13 相同，得 5。"},{"q":"(−4.5) + (−2.5) 的值是多少？","o":["−7","−2","7","2"],"a":0,"e":"同號相加，絕對值 4.5 + 2.5 = 7，符號為負。"},{"q":"−6 − 9 的值是多少？","o":["−15","3","−3","15"],"a":0,"e":"−6 − 9 = −6 + (−9) = −15。"},{"q":"3 − 11 + (−5) 的值是多少？","o":["−13","−3","9","13"],"a":0,"e":"3 − 11 = −8，−8 + (−5) = −13。"},{"q":"清晨氣溫是 −4 °C，到中午上升了 11 °C，中午氣溫是多少？","o":["7 °C","−15 °C","15 °C","−7 °C"],"a":0,"e":"−4 + 11 = 7。"},{"q":"(−12) − (−20) + (−3) 的值是多少？","o":["5","−35","−11","29"],"a":0,"e":"(−12) + 20 + (−3) = 8 + (−3) = 5。"},{"q":"數線上 A(−6)、B(−1)，<span class=\"seg\">AB<\/span> 的長是多少？","o":["5","6","7","−7"],"a":0,"e":"<span class=\"seg\">AB<\/span> = |−6 − (−1)| = |−5| = 5。"},{"q":"數線上 A(−10)、B(4)，<span class=\"seg\">AB<\/span> 中點的坐標是多少？","o":["−3","−7","3","7"],"a":0,"e":"中點 = <span class=\"fr\"><span>−10 + 4<\/span><span>2<\/span><\/span> = −3。"},{"q":"數線上 M 是 <span class=\"seg\">AB<\/span> 的中點，A(−2)、M(3)，B 的坐標是多少？","o":["1","4","5","8"],"a":3,"e":"A 到 M 往右 5 單位，M 到 B 也往右 5 單位：3 + 5 = 8。"},{"q":"若 |<i>x<\/i> + 3| = 4，則 <i>x<\/i> 可能是多少？","o":["1 或 −7","−1 或 7","1 或 7","只有 1"],"a":0,"e":"|<i>x<\/i> + 3| = |<i>x<\/i> − (−3)| 表示 <i>x<\/i> 與 −3 的距離是 4，所以 <i>x<\/i> = −3 + 4 = 1 或 <i>x<\/i> = −3 − 4 = −7。"}],"fig":[],"w":"numline","sum":"把減法改成加法來算，並用數線求兩點的距離與中點。","wo":""},"1-1-3":{"rows":[{"h":"乘除的符號","li":["兩數相乘或相除：<strong class=\"kw\">同號得正，異號得負<\/strong>。","多個不為 0 的數連乘除：負數有偶數個，結果為正；<strong class=\"kw\">負數有奇數個，結果為負<\/strong>。","任何數乘以 0 都得 0；<strong class=\"kw\">0 不能當除數<\/strong>。","除以一個數，等於乘以它的<strong class=\"kw\  (−1) 的值是多少？","o":["−1","1","−5","5"],"a":0,"e":"5 個負數相乘，負數有奇數個，結果為負，絕對值是 1。"},{"q":"(−2) × 3 × (−4) × 0 × (−5) 的值是多少？","o":["0","−120","120","−24"],"a":0,"e":"連乘中只要有一個因數是 0，結果就是 0。"},{"q":"下列哪一個算式的值是負數？","o":["(−3) × (−4) × (−2)","(−6) ÷ (−2)","(−1) × (−1)","(−5) × 0"],"a":0,"e":"(−3) × (−4) × (−2) 有 3 個負數，結果 −24；其他依序是 3、1、0。"},{"q":"−20 ÷ 4 × (−5) 的值是多少？","o":["25","1","−1","−25"],"a":0,"e":"乘除同級，由左往右：−20 ÷ 4 = −5，(−5) × (−5) = 25。若先算 4 × (−5) 會錯算成 1。"},{"q":"(−3) + 4 × (−2) 的值是多少？","o":["−11","−2","−5","5"],"a":0,"e":"先乘後加：4 × (−2) = −8，−3 + (−8) = −11。"},{"q":"計算 125 × (−37) × 8，先算哪兩個數最方便？","o":["125 × 8","125 × (−37)","(−37) × 8","沒有比較快的算法"],"a":0,"e":"用交換律與結合律，125 × 8 = 1000，再乘 −37 得 −37000。"},{"q":"(−6) × 17 + (−6) × 3 的值是多少？","o":["−120","120","−84","−126"],"a":0,"e":"用分配律：(−6) × (17 + 3) = (−6) × 20 = −120。"},{"q":"(−48) ÷ (−6) − 3 × (−2) 的值是多少？","o":["14","2","−14","10"],"a":0,"e":"先乘除：(−48) ÷ (−6) = 8，3 × (−2) = −6；再算 8 − (−6) = 14。"},{"q":"若 <i>a<\/i> &lt; 0 且 <i>b<\/i> &lt; 0，下列何者一定是正數？","o":["<i>ab<\/i>","<i>a<\/i> + <i>b<\/i>","<i>a<\/i> − <i>b<\/i>","−<i>ab<\/i>"],"a":0,"e":"兩個負數相乘得正數。<i>a<\/i> + <i>b<\/i> 一定是負數；<i>a<\/i> − <i>b<\/i> 可能是正、0 或負；<i>ab<\/i> &gt; 0，所以 −<i>ab<\/i> 一定是負數。"}],"fig":[],"w":"","sum":"掌握乘除的正負號規則，以及四則運算的先後順序。"},"1-1-4":{"rows":[{"h":"指數記法","li":["<i>n<\/i> 個 <i>a<\/i> 相乘寫成 <i>a<\/i><sup><i>n<\/i><\/sup>，<i>a<\/i> 叫做<strong class=\"kw\">底數<\/strong>，<i>n<\/i> 叫做<strong class=\"kw\">指數<\/strong>。例：5 × 5 × 5 = 5<sup>3<\/sup>。","<i>a<\/i><sup>2<\/sup> 讀作 <strong class=\"kw\"><i>a<\/i> 的平方<\/strong>，<i>a<\/i><sup>3<\/sup> 讀作 <i>a<\/i> 的立方；指數是 1 時通常省略不寫。","<strong class=\"kw\">底數是負數要加括號<\/strong>：(−2)<sup>4<\/sup> = 16，但 −2<sup>4<\/sup> = −(2<sup>4<\/sup>) = −16。","負數的<strong class=\"kw\">偶數次方為正，奇數次方為負<\/strong>：(−3)<sup>2<\/sup> = 9，(−3)<sup>3<\/sup> = −27。"],"tip":[]},{"h":"零次方與負整數次方","li":["<i>a<\/i> ≠ 0 時，規定 <strong class=\"kw\"><i>a<\/i><sup>0<\/sup> = 1<\/strong>。","<strong class=\"kw\">10<sup>−<i>n<\/i><\/sup> = <span class=\"fr\"><span>1<\/span><span>10<sup><i>n<\/i><\/sup><\/span><\/span><\/strong>，例如 10<sup>−3<\/sup> = <span class=\"fr\"><span>1<\/span><span>1000<\/span><\/span> = 0.001。"],"tip":[]},{"h":"科學記號","li":["把正數寫成 <i>a<\/i> × 10<sup><i>n<\/i><\/sup>（1 ≤ <i>a<\/i> &lt; 10，<i>n<\/i> 為整數），叫做<strong class=\"kw\">科學記號<\/strong>。","小數點向左移 <i>n<\/i> 位，<strong class=\"kw\">指數就是 <i>n<\/i><\/strong>：3200000 = 3.2 × 10<sup>6<\/sup>。","小數點向右移 <i>n<\/i> 位，<strong class=\"kw\">指數就是 −<i>n<\/i><\/strong>：0.00047 = 4.7 × 10<sup>−4<\/sup>。"],"tip":[]},{"h":"判斷位數與比大小","li":["整數 N = <i>a<\/i> × 10<sup><i>n<\/i><\/sup>（<i>n<\/i> 為正整數），N 是 <strong class=\"kw\">(<i>n<\/i> + 1) 位數<\/strong>。例：6.1 × 10<sup>7<\/sup> 是 8 位數。","<i>a<\/i> × 10<sup>−<i>n<\/i><\/sup>（<i>n<\/i> 為正整數）從<strong class=\"kw\">小數點後第 <i>n<\/i> 位<\/strong>開始出現不是 0 的數字。例：2.5 × 10<sup>−4<\/sup> = 0.00025。","用科學記號比大小：<strong class=\"kw\">先比指數<\/strong>，指數大的數較大；指數相同再比 <i>a<\/i>。"],"tip":["1.2 × 10<sup>9<\/sup> &gt; 9.8 × 10<sup>8<\/sup>，因為先看指數，10<sup>9<\/sup> 比 10<sup>8<\/sup> 大。"]}],"ex":[{"q":"把 0.000063 與 58000000 用科學記號表示。","a":["0.000063：小數點向右移 5 位，得 6.3 × 10<sup>−5<\/sup>。","58000000：小數點向左移 7 位，得 5.8 × 10<sup>7<\/sup>。"]},{"q":"計算 (−2)<sup>3<\/sup> − 3<sup>2<\/sup> × (−1)<sup>4<\/sup>。","a":["(−2)<sup>3<\/sup> = −8，3<sup>2<\/sup> = 9，(−1)<sup>4<\/sup> = 1","−8 − 9 × 1 = −17"]},{"q":"比較 <i>a<\/i> = 4.5 × 10<sup>−6<\/sup> 與 <i>b<\/i> = 9 × 10<sup>−7<\/sup> 的大小，並把 <i>a<\/i> 寫成小數。","a":["先比指數：−6 &gt; −7，所以 <i>a<\/i> &gt; <i>b<\/i>。","<i>a<\/i> = 0.0000045，從小數點後第 6 位開始出現不是 0 的數字。"]}],"qs":[{"q":"(−2)<sup>5<\/sup> 的值是多少？","o":["−32","32","−10","10"],"a":0,"e":"5 個 −2 相乘，負數有奇數個，結果為負，2<sup>5<\/sup> = 32，所以是 −32。"},{"q":"下列哪一個是正確的科學記號表示法？","o":["4.06 × 10<sup>−3<\/sup>","40.6 × 10<sup>−4<\/sup>","0.406 × 10<sup>−2<\/sup>","406 × 10<sup>−5<\/sup>"],"a":0,"e":"科學記號的 <i>a<\/i> 要滿足 1 ≤ <i>a<\/i> &lt; 10，只有 4.06 符合。"},{"q":"7.02 × 10<sup>8<\/sup> 是幾位數？","o":["7","8","9","10"],"a":2,"e":"7.02 × 10<sup>8<\/sup> = 702000000，共 9 位；正整數寫成 <i>a<\/i> [{"q":"求 252 的標準分解式。","a":["252 = 2 × 126 = 2 × 2 × 63 = 2 × 2 × 3 × 21 = 2 × 2 × 3 × 3 × 7","標準分解式：252 = 2<sup>2<\/sup> × 3<sup>2<\/sup> × 7"]},{"q":"判斷 7425 是不是 3、5、9、11 的倍數。","a":["數字和 7 + 4 + 2 + 5 = 18，是 3 和 9 的倍數；個位數是 5，是 5 的倍數。","奇數位數字和 5 + 4 = 9，偶數位數字和 2 + 7 = 9，差是 0，所以也是 11 的倍數（7425 = 11 × 675）。"]},{"q":"求 540 的標準分解式與正因數個數。","a":["540 = 4 × 135 = 2<sup>2<\/sup> × 3<sup>3<\/sup> × 5","正因數個數 = (2 + 1)(3 + 1)(1 + 1) = 24 個"]}],"qs":[{"q":"下列哪一個數是質數？","o":["81","87","89","91"],"a":2,"e":"81 = 9 × 9，87 = 3 × 29，91 = 7 × 13，只有 89 沒有 1 和本身以外的因數。"},{"q":"四位數 53□8 是 9 的倍數，□ 應填哪一個數字？","o":["2","3","5","7"],"a":0,"e":"各位數字和 5 + 3 + □ + 8 = 16 + □ 要是 9 的倍數，所以 □ = 2。"},{"q":"180 的標準分解式是哪一個？","o":["2<sup>2<\/sup> × 3<sup>2<\/sup> × 5","2 × 3<sup>2<\/sup> × 10","2<sup>2<\/sup> × 45","4 × 9 × 5"],"a":0,"e":"180 = 4 × 45 = 2<sup>2<\/sup> × 3<sup>2<\/sup> × 5；其他選項含有不是質數的因數。"},{"q":"72 共有幾個正因數？","o":["6","8","10","12"],"a":3,"e":"72 = 2<sup>3<\/sup> × 3<sup>2<\/sup>，正因數個數 = (3 + 1)(2 + 1) = 12。"},{"q":"下列哪一個數是 3 的倍數？","o":["2457","2453","3401","1000"],"a":0,"e":"2 + 4 + 5 + 7 = 18 是 3 的倍數；其他數的數字和是 14、8、1。"},{"q":"下列哪一個數是 4 的倍數？","o":["7316","5534","9118","2222"],"a":0,"e":"看末兩位：16 是 4 的倍數，34、18、22 都不是。"},{"q":"下列哪一個數是 11 的倍數？","o":["3091","3092","4512","1234"],"a":0,"e":"3091 的奇數位數字和 1 + 0 = 1，偶數位數字和 9 + 3 = 12，差是 11，所以是 11 的倍數（3091 = 11 × 281）。"},{"q":"下列哪一個數是合數？","o":["57","53","59","61"],"a":0,"e":"57 = 3 × 19，除了 1 和本身還有其他因數；53、59、61 都是質數。"},{"q":"介於 30 到 50 之間的質數共有幾個？","o":["4","5","6","7"],"a":1,"e":"有 31、37、41、43、47，共 5 個。"},{"q":"84 的標準分解式是哪一個？","o":["2<sup>2<\/sup> × 3 × 7","2 × 6 × 7","2<sup>2<\/sup> × 21","4 × 3 × 7"],"a":0,"e":"84 = 4 × 21 = 2<sup>2<\/sup> × 3 × 7；其他選項含有不是質數的因數。"},{"q":"2<sup>3<\/sup> × 3 × 5<sup>2<\/sup> 的值是多少？","o":["120","240","300","600"],"a":3,"e":"8 × 3 × 25 = 600。"},{"q":"下列哪一個數是 2<sup>2<\/sup> × 3<sup>3<\/sup> × 5 的因數？","o":["18","8","25","81"],"a":0,"e":"18 = 2 × 3<sup>2<\/sup>，每個質因數的次方都不超過原數；8 = 2<sup>3<\/sup>、25 = 5<sup>2<\/sup>、81 = 3<sup>4<\/sup> 都超過了。"},{"q":"100 共有幾個正因數？","o":["6","8","9","10"],"a":2,"e":"100 = 2<sup>2<\/sup> × 5<sup>2<\/sup>，正因數個數 = (2 + 1)(2 + 1) = 9。"},{"q":"三位數 3□5 是 9 的倍數，□ 應填哪一個數字？","o":["0","1","4","9"],"a":1,"e":"3 + □ + 5 = 8 + □ 要是 9 的倍數，所以 □ = 1。"},{"q":"正整數 N = 2<sup><i>a<\/i><\/sup> × 7（<i>a<\/i> 為正整數）共有 8 個正因數，<i>a<\/i> 是多少？","o":["2","3","4","7"],"a":1,"e":"正因數個數 = (<i>a<\/i> + 1)(1 + 1) = 8，<i>a<\/i> + 1 = 4，<i>a<\/i> = 3。"}],"fig":[],"w":"factor","sum":"判斷倍數與質數，寫出一個數的標準分解式。","wo":""},"1-2-2":{"rows":[{"h":"最大公因數","li":["幾個整數共同的因數叫做<strong class=\"kw\">公因數<\/strong>，其中最大的叫做<strong class=\"kw\">最大公因數<\/strong>，<i>a<\/i>、<i>b<\/i> 的最大公因數記作 (<i>a<\/i>, <i>b<\/i>)。","公因數一定是<strong class=\"kw\">最大公因數的因數<\/strong>。","用標準分解式求：取<strong class=\"kw\">共同<\/strong>的質因數，次方取<strong class=\"kw\">較小<\/strong>的相乘。例：(2<sup>3<\/sup> × 3<sup>2<\/sup> × 5, 2<sup>2<\/sup> × 3<sup>3<\/sup> × 7) = 2<sup>2<\/sup> × 3<sup>2<\/sup> = 36。"],"tip":[]},{"h":"互質","li":["兩個整數的最大公因數是 1，就說它們<strong class=\"kw\">互質<\/strong>，例如 8 與 15。","<strong class=\"kw\">相異的兩個質數一定互質<\/strong>，但互質的兩數不一定是質數。","相鄰的兩個正整數<strong class=\"kw\">一定互質<\/strong>。"],"tip":[]},{"h":"最小公倍數","li":["幾個整數共同的倍數叫做<strong class=\"kw\">公倍數<\/strong>，其中最小的正公倍數叫做<strong class=\"kw\">最小公倍數<\/strong>，<i>a<\/i>、<i>b<\/i> 的最小公倍數記作 [<i>a<\/i>, <i>b<\/i>]。","公倍數一定是<strong class=\"kw\">最小公倍數的倍數<\/strong>。","用標準分解式求：<strong class=\"kw\">全部<\/strong>出現過的質因數都要取，次方取<strong class=\"kw\">較大<\/strong>的相乘。例：[2<sup>3<\/sup> × 3<sup>2<\/sup> × 5, 2<sup>2<\/sup> × 3<sup>3<\/sup> × 7] = 2<sup>3<\/sup> × 3<sup>3<\/sup> × 5 × 7 = 7560。"],"tip":["也可以用短除法：同時除以公因數，左邊相乘是最大公因數，左邊與底下全部相乘是最小公倍數。"]},{"h":"常用性質與應用","li":["兩個正整數 <i>a<\/i>、<i>b<\/i>：<strong class=\"kw\"><i>a<\/i> × <i>b<\/i> = (<i>a<\/i>, <i>b<\/i>) × [<i>a<\/i>, <i>b<\/i>]<\/strong>。","「最多平分成幾份、剪成最大的正方形」→ <strong class=\"kw\">想最大公因數<\/strong>。","「至少要多少、多久會再同時發生」→ <strong class=\"kw\">想最小公倍數<\/strong>。"],"tip":[]}],"ex":[{"q":"長 84 公分、寬 60 公分的紙，要剪成大小相同、邊長為整數的最大正方形且沒有剩餘，邊長是多少？可剪幾張？","a":["邊長要同時整除 84 和 60，取最大公因數 (84, 60) = 12。","可剪 (84 ÷ 12) × (60 ÷ 12) = 7 × 5 = 35 張。"]},{"q":"求 (90, 126) 與 [90, 126]。","a":["90 = 2 × 3<sup>2<\/sup> × 5，126 = 2 × 3<sup>2<\/sup> × 7","(90, 126) = 2 × 3<sup>2<\/sup> = 18；[90, 126] = 2 × 3<sup>2<\/sup> × 5 × 7 = 630"]},{"q":"一盒巧克力每 8 顆裝一袋會多 3 顆，每 12 顆裝一袋也多 3 顆。巧克力至少有幾顆（多於 3 顆）？","a":["巧克力數減去 3，是 8 和 12 的公倍數。","最少是 [8, 12] + 3 = 24 + 3 = 27 顆"]}],"qs":[{"q":"(48, 72) 是多少？","o":["8","12","24","144"],"a":2,"e":"48 = 2<sup>4<\/sup> × 3，72 = 2<sup>3<\/sup> × 3<sup>2<\/sup>，取次方較小：2<sup>3<\/sup> × 3 = 24。"},{"q":"[12, 18] 是多少？","o":["6","36","72","216"],"a":1,"e":"12 = 2<sup>2<\/sup> × 3，18 = 2 × 3<sup>2<\/sup>，取次方較大：2<sup>2<\/sup> × 3<sup>2<\/sup> = 36。"},{"q":"甲、乙兩路公車 7:00 同時從總站發車，甲每 12 分鐘一班，乙每 20 分鐘一班。下一次同時發車是幾點？","o":["8:00","7:32","7:40","11:00"],"a":0,"e":"[12, 20] = 60，過 60 分鐘再同時發車，就是 8:00。"},{"q":"正整數 <i>a<\/i>、<i>b<\/i> 的最大公因數是 6，最小公倍數是 90。若 <i>a<\/i> = 18，則 <i>b<\/i> 是多少？","o":["15","30","45","60"],"a":1,"e":"<i>a<\/i> × <i>b<\/i> = 6 × 90 = 540，<i>b<\/i> = 540 ÷ 18 = 30；檢查 (18, 30) = 6，[18, 30] = 90。"},{"q":"下列哪一組數互質？","o":["14 與 21","9 與 16","12 與 30","25 與 35"],"a":1,"e":"9 = 3<sup>2<\/sup>，16 = 2<sup>4<\/sup>，沒有共同的質因數，最大公因數是 1。"},{"q":"(36, 60) 是多少？","o":["4","6","12","180"],"a":2,"e":"36 = 2<sup>2<\/sup> × 3<sup>2<\/sup>，60 = 2<sup>2<\/sup> × 3 × 5，共同質因數取次方較小：2<sup>2<\/sup> × 3 = 12。"},{"q":"[8, 14] 是多少？","o":["2","28","56","112"],"a":2,"e":"8 = 2<sup>3<\/sup>，14 = 2 × 7，全部質因數取次方較大：2<sup>3<\/sup> × 7 = 56。"},{"q":"(2<sup>4<\/sup> × 3 × 5<sup>2<\/sup>, 2<sup>2<\/sup> × 3<sup>3<\/sup> × 5) 是多少？","o":["2<sup>2<\/sup> × 3 × 5","2<sup>4<\/sup> × 3<sup>3<\/sup> × 5<sup>2<\/sup>","2 × 3 × 5","2<sup>2<\/sup> × 3<sup>3<\/sup> × 5"],"a":0,"e":"最大公因數取共同質因數、次方較小：2<sup>2<\/sup>、3<sup>1<\/sup>、5<sup>1<\/sup>。"},{"q":"[2<sup>3<\/sup> × 7, 2 × 3 × 7<sup>2<\/sup>] 是多少？","o":["2<sup>3<\/sup> × 3 × 7<sup>2<\/sup>","2 × 7","2<sup>3<\/sup> × 7<sup>2<\/sup>","2<sup>4<\/sup> × 3 × 7<sup>3<\/sup>"],"a":0,"e":"最小公倍數取全部質因數、次方較大：2<sup>3<\/sup>、3<sup>1<\/sup>、7<sup>2<\/sup>。"},{"q":"有 48 枝鉛筆和 72 本筆記本，要平均分給一些學生而且都沒有剩，最多可以分給幾位學生？","o":["8","12","24","144"],"a":2,"e":"人數要同時整除 48 和 72，最多是 (48, 72) = 24 人。"},{"q":"一堆糖果每 6 顆裝一包剛好裝完，每 8 顆裝一包也剛好裝完，糖果至少有幾顆？","o":["14","24","48","2"],"a":1,"e":"糖果數是 6 和 8 的公倍數，最少是 [6, 8] = 24。"},{"q":"兩個正整數的最大公因數是 4、最小公倍數是 48，其中一數是 12，另一數是多少？","o":["4","16","24","36"],"a":1,"e":"兩數乘積 = 4 × 48 = 192，192 ÷ 12 = 16；檢查 (12, 16) = 4，[12, 16] = 48。"},{"q":"若正整數 <i>a<\/i> 與 <i>b<\/i> 互質，則 (<i>a<\/i>, <i>b<\/i>) 是多少？","o":["1","<i>a<\/i>","<i>a<\/i> × <i>b<\/i>","0"],"a":0,"e":"互質的意思就是最大公因數是 1。"},{"q":"甲每 4 天值日一次，乙每 6 天值日一次，兩人今天一起值日，至少再過幾天會再一起值日？","o":["2","10","12","24"],"a":2,"e":"[4, 6] = 12。"},{"q":"用大小相同的正方形磁磚剛好鋪滿長 180 公分、寬 120 公分的長方形地面，磁磚邊長最大是幾公分？（邊長為整數）","o":["20","30","60","360"],"a":2,"e":"邊長要同時整除 180 和 120，最大是 (180, 120) = 60 公分。"}],"fig":[],"w":"gcdlcm","sum":"用標準分解式求最大公因數與最小公倍數，解決分組與週期問題。","wo":""},"1-2-3":{"rows":[{"h":"分數的基本概念","li":["分子、分母同乘或同除一個不為 0 的數，分數的值不變，這些分數叫做<strong class=\"kw\">等值分數<\/strong>。","分子與分母互質的分數叫做<strong class=\"kw\">最簡分數<\/strong>。","負分數有<strong class=\"kw\">三種寫法<\/strong>：−<span class=\"fr\"><span><i>a<\/i><\/span><span><i>b<\/i><\/span><\/span> = <span class=\"fr\"><span>−<i>a<\/i><\/span><span><i>b<\/i><\/span><\/span> = <span class=\"fr\"><span><i>a<\/i><\/span><span>−<i>b<\/i><\/span><\/span>。","帶分數的<strong class=\"kw\">負號管整個數<\/strong>：−2<span class=\"fr\"><span>1<\/span><span>3<\/span><\/span> = −(2 + <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>)。"],"tip":[]},{"h":"比大小","li":["分母相同比分子；分子相同時，<strong class=\"kw\">分母越大的分數越小<\/strong>。","分母不同時，<strong class=\"kw\">先通分<\/strong>（或化成同分子）再比。","兩個負分數比大小，<strong class=\"kw\">絕對值大的反而小<\/strong>。例：−<span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> &lt; −<span class=\"fr\"><span>2<\/span><span>3<\/span><\/span>，因為 <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> &gt; <span class=\"fr\"><span>2<\/span><span>3<\/span><\/span>。"],"tip":[]},{"h":"加減","li":["同分母：<strong class=\"kw\">分母不變， /i> − 6。"},{"q":"化簡 <span class=\"fr\"><span><i>x<\/i><\/span><span>2<\/span><\/span> + <span class=\"fr\"><span><i>x<\/i><\/span><span>3<\/span><\/span> 的結果是什麼？","o":["<span class=\"fr\"><span>5<i>x<\/i><\/span><span>6<\/span><\/span>","<span class=\"fr\"><span>2<i>x<\/i><\/span><span>5<\/span><\/span>","<span class=\"fr\"><span><i>x<\/i><\/span><span>5<\/span><\/span>","<span class=\"fr\"><span><i>x<\/i><\/span><span>6<\/span><\/span>"],"a":0,"e":"通分：<span class=\"fr\"><span>3<i>x<\/i><\/span><span>6<\/span><\/span> + <span class=\"fr\"><span>2<i>x<\/i><\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>5<i>x<\/i><\/span><span>6<\/span><\/span>。"},{"q":"若 A = 2<i>x<\/i> + 1，B = <i>x<\/i> − 3，則 A − 2B 化簡後是什麼？","o":["7","4<i>x<\/i> − 5","−5","4<i>x<\/i> + 7"],"a":0,"e":"2<i>x<\/i> + 1 − 2(<i>x<\/i> − 3) = 2<i>x<\/i> + 1 − 2<i>x<\/i> + 6 = 7。"}],"fig":[],"w":"","sum":"用文字符號列出式子，並合併同類項化簡。"},"1-3-2":{"rows":[{"h":"方程式與解","li":["含有等號、只有一個未知數且最高次方是 1 的等式，叫做<strong class=\"kw\">一元一次方程式<\/strong>，例如 3<i>x<\/i> − 4 = 11。","代入後能使等號兩邊相等的數，叫做方程式的<strong class=\"kw\">解<\/strong>（或根）。"],"tip":[]},{"h":"等量公理","li":["等號兩邊同加、同減、同乘同一個數，<strong class=\"kw\">等式仍然成立<\/strong>。","等號兩邊同除以一個<strong class=\"kw\">不為 0 的數<\/strong>，等式仍然成立。"],"tip":[]},{"h":"移項法則","li":["把一項從等號一邊移到另一邊，<strong class=\"kw\">運算要改變<\/strong>：＋ 變 −、− 變 ＋、× 變 ÷、÷ 變 ×。","例：<i>x<\/i> + 7 = 3 → <i>x<\/i> = 3 − 7 = −4；<span class=\"fr\"><span><i>x<\/i><\/span><span>5<\/span><\/span> = −2 → <i>x<\/i> = −10。"],"tip":["移項是由等量公理推得的，兩者結果相同。"]},{"h":"解題步驟","li":["① <strong class=\"kw\">去分母<\/strong>（兩邊同乘分母的最小公倍數）、去括號。","② <strong class=\"kw\">移項<\/strong>：含 <i>x<\/i> 的項放一邊，常數放另一邊。","③ 合併成 <i>ax<\/i> = <i>b<\/i>，再兩邊同除以 <i>a<\/i>，得 <strong class=\"kw\"><i>x<\/i> = <span class=\"fr\"><span><i>b<\/i><\/span><span><i>a<\/i><\/span><\/span><\/strong>。","④ <strong class=\"kw\">驗算<\/strong>：把解代回原方程式檢查。"],"tip":["去分母時每一項都要乘，沒有分母的項也不能漏掉。"]}],"ex":[{"q":"解 <span class=\"fr\"><span><i>x<\/i> − 1<\/span><span>2<\/span><\/span> − <span class=\"fr\"><span><i>x<\/i> + 2<\/span><span>3<\/span><\/span> = 1。","a":["兩邊同乘 6：3(<i>x<\/i> − 1) − 2(<i>x<\/i> + 2) = 6","3<i>x<\/i> − 3 − 2<i>x<\/i> − 4 = 6，<i>x<\/i> − 7 = 6，<i>x<\/i> = 13"]},{"q":"解 3(2<i>x<\/i> − 5) = 4<i>x<\/i> + 7。","a":["去括號：6<i>x<\/i> − 15 = 4<i>x<\/i> + 7","移項：2<i>x<\/i> = 22，<i>x<\/i> = 11"]},{"q":"解 0.4<i>x<\/i> − 1.5 = 0.1<i>x<\/i> + 0.3。","a":["兩邊乘 10：4<i>x<\/i> − 15 = <i>x<\/i> + 3","3<i>x<\/i> = 18，<i>x<\/i> = 6"]}],"qs":[{"q":"解方程式 5<i>x<\/i> − 8 = 2<i>x<\/i> + 7，<i>x<\/i> 是多少？","o":["−5","3","5","15"],"a":2,"e":"移項：5<i>x<\/i> − 2<i>x<\/i> = 7 + 8，3<i>x<\/i> = 15，<i>x<\/i> = 5。"},{"q":"解方程式 3(<i>x<\/i> − 2) = −2(<i>x<\/i> + 8)，<i>x<\/i> 是多少？","o":["−2","2","−10","10"],"a":0,"e":"3<i>x<\/i> − 6 = −2<i>x<\/i> − 16，5<i>x<\/i> = −10，<i>x<\/i> = −2。"},{"q":"若 <i>x<\/i> = 3 是方程式 <i>ax<\/i> − 4 = 2<i>x<\/i> + 5 的解，則 <i>a<\/i> 是多少？","o":["−5","3","5","7"],"a":2,"e":"代入 <i>x<\/i> = 3：3<i>a<\/i> − 4 = 6 + 5，3<i>a<\/i> = 15，<i>a<\/i> = 5。"},{"q":"解方程式 <span class=\"fr\"><span>2<i>x<\/i> + 1<\/span><span>3<\/span><\/span> = <span class=\"fr\"><span><i>x<\/i> − 1<\/span><span>2<\/span><\/span> + 1，<i>x<\/i> 是多少？","o":["1","−4","5","−1"],"a":0,"e":"兩邊同乘 6：2(2<i>x<\/i> + 1) = 3(<i>x<\/i> − 1) + 6，4<i>x<\/i> + 2 = 3<i>x<\/i> + 3，<i>x<\/i> = 1。若忘了把「＋1」也乘 6，會算成 −4。"},{"q":"下列哪一個是一元一次方程式？","o":["3<i>x<\/i> − 5 = 10","<i>x<\/i> + <i>y<\/i> = 3","<i>x<\/i><sup>2<\/sup> = 4","2<i>x<\/i> + 7"],"a":0,"e":"只有一個未知數、次方是 1、而且有等號。2<i>x<\/i> + 7 沒有等號，只是式子。"},{"q":"<i>x<\/i> = 4 是下列哪一個方程式的解？","o":["2<i>x<\/i> − 3 = 5","3<i>x<\/i> + 1 = 12","<i>x<\/i> − 7 = 3","5<i>x<\/i> = 9"],"a":0,"e":"代入 <i>x<\/i> = 4：2 × 4 − 3 = 5，等號兩邊相等。"},{"q":"解方程式 4<i>x<\/i> + 9 = 1，<i>x<\/i> 是多少？","o":["−2","2","<span class=\"fr\"><span>5<\/span><span>2<\/span><\/span>","−<span class=\"fr\"><span>5<\/span><span>2<\/span><\/span>"],"a":0,"e":"4<i>x<\/i> = 1 − 9 = −8，<i>x<\/i> = −2。"},{"q":"解方程式 7 − 2<i>x<\/i> = 15，<i>x<\/i> 是多少？","o":["−4","4","11","−11"],"a":0,"e":"−2<i>x<\/i> = 15 − 7 = 8，<i>x<\/i> = −4。"},{"q":"解方程式 <span class=\"fr\"><span><i>x<\/i><\/span><span>3<\/span><\/span> − 2 = 5，<i>x<\/i> 是多少？","o":["1","<span class=\"fr\"><span>7<\/span><span>3<\/span><\/span>","9","21"],"a":3,"e":"<span class=\"fr\"><span><i>x<\/i><\/span><span>3<\/span><\/span> = 7，<i>x<\/i> = 21。"},{"q":"解方程式 2(<i>x<\/i> + 5) = 3(<i>x<\/i> − 1)，<i>x<\/i> 是多少？","o":["7","11","13","−13"],"a":2,"e":"2<i>x<\/i> + 10 = 3<i>x<\/i> − 3，<i>x<\/i> = 13。"},{"q":"解方程式 0.3<i>x<\/i> − 1.2 = 0.5<i>x<\/i>，<i>x<\/i> 是多少？","o":["−6","6","−0.6","2.4"],"a":0,"e":"兩邊乘 10：3<i>x<\/i> − 12 = 5<i>x<\/i>，−2<i>x<\/i> = 12，<i>x<\/i> = −6。"},{"q":"解方程式 <span class=\"fr\"><span><i>x<\/i> + 1<\/span><span>4<\/span><\/span> = <span class=\"fr\"><span><i>x<\/i> − 2<\/span><span>3<\/span><\/span>，<i>x<\/i> 是多少？","o":["11","−11","5","1"],"a":0,"e":"交叉相乘（兩邊同乘 12）：3(<i>x<\/i> + 1) = 4(<i>x<\/i> − 2)，3<i>x<\/i> + 3 = 4<i>x<\/i> − 8，<i>x<\/i> = 11。"},{"q":"若 2<i>x<\/i> − 3 = 7，則 4<i>x<\/i> − 1 的值是多少？","o":["9","13","19","27"],"a":2,"e":"由 2<i>x<\/i> − 3 = 7 得 <i>x<\/i> = 5，4 × 5 − 1 = 19。"},{"q":"方程式 5<i>x<\/i> − 2 = 3<i>x<\/i> + <i>a<\/i> 的解是 <i>x<\/i> = 4，<i>a<\/i> 是多少？","o":["−6","2","6","10"],"a":2,"e":"代入 <i>x<\/i> = 4：20 − 2 = 12 + <i>a<\/i>，<i>a<\/i> = 6。"},{"q":"由 3<i>x<\/i> = 12 得到 <i>x<\/i> = 4，用的是哪一個等量公理？","o":["等號兩邊同除以 3","等號兩邊同減 3","等號兩邊同乘 3","等號兩邊同加 3"],"a":0,"e":"兩邊同除以 3：3<i>x<\/i> ÷ 3 = 12 ÷ 3，<i>x<\/i> = 4。"}],"fig":[],"w":"","sum":"用等量公理與移項，一步步解出一元一次方程式。"},"1-3-3":{"rows":[{"h":"解應用問題的步驟","li":["審題：找出已知、所求，以及題目中<strong class=\"kw\">「相等」的關係<\/strong>。","設未知數：通常把所求設為 <i>x<\/i>，<strong class=\"kw\">記得寫單位<\/strong>。","列方程式 → 解方程式 → <strong class=\"kw\">驗算答案是否合理<\/strong>（人數、物品數要是正整數）。"],"tip":[]},{"h":"常見類型","li":["價錢：<strong class=\"kw\">總價 = 單價 × 數量<\/strong>；打 8 折就是原價 × 0.8。","年齡：每過一年每個人都增加 1 歲，兩人的<strong class=\"kw\">年齡差不變<\/strong>。","行程：<strong class=\"kw\">距離 = 速率 × 時間<\/strong>；相向而行看「速率和」，同向追趕看「速率差」。","分配：「每人分 <i>a<\/i> 個多 <i>b<\/i> 個，每人分 <i>c<\/i> 個少 <i>d<\/i> 個」→ <strong class=\"kw\"><i>ax<\/i> + <i>b<\/i> = <i>cx<\/i> − <i>d<\/i><\/strong>。","雞兔：設其中一種為 <i>x<\/i> 隻，另一種寫成<strong class=\"kw\">「總數 − <i>x<\/i>」<\/strong>。"],"tip":["列式後先估一下答案的範圍，算完可以檢查是否合理。"]}],"ex":[{"q":"一些糖果分給學生，每人 4 顆會多 9 顆，每人 6 顆則少 7 顆。學生有幾人？","a":["設學生 <i>x<\/i> 人，糖果數相同：4<i>x<\/i> + 9 = 6<i>x<\/i> − 7","2<i>x<\/i> = 16，<i>x<\/i> = 8，學生 8 人（糖果 41 顆）。"]},{"q":"甲、乙兩人從相距 18 公里的兩地同時出發、相向而行，甲每小時走 5 公里，乙每小時走 4 公里，幾小時後相遇？","a":["兩人每小時共靠近 5 + 4 = 9 公里。","設 <i>x<\/i> 小時後相遇：9<i>x<\/i> = 18，<i>x<\/i> = 2"]},{"q":"一件商品先打 8 折，再折價 30 元，結果賣 290 元，原價多少元？","a":["設原價 <i>x<\/i> 元：0.8<i>x<\/i> − 30 = 290","0.8<i>x<\/i> = 320，<i>x<\/i> = 400"]}],"qs":[{"q":"父親今年 42 歲，兒子 12 歲，幾年後父親的年齡是兒子的 2.5 倍？","o":["6","8","10","12"],"a":1,"e":"設 <i>x<\/i> 年後：42 + <i>x<\/i> = 2.5(12 + <i>x<\/i>)，42 + <i>x<\/i> = 30 + 2.5<i>x<\/i>，<i>x<\/i> = 8（50 歲與 20 歲）。"},{"q":"一件外套打 8 折後賣 1440 元，原價是多少元？","o":["1152","1600","1800","2000"],"a":2,"e":"設原價 <i>x<\/i> 元：0.8<i>x<\/i> = 1440，<i>x<\/i> = 1800。"},{"q":"籠子裡雞和兔共 20 隻，腳共 56 隻，兔有幾隻？","o":["6","8","10","12"],"a":1,"e":"設兔 <i>x<\/i> 隻、雞 (20 − <i>x<\/i>) 隻：4<i>x<\/i> + 2(20 − <i>x<\/i>) = 56，2<i>x<\/i> = 16，<i>x<\/i> = 8。"},{"q":"甲、乙兩地相距 210 公里，汽車從甲地、機車從乙地同時出發相向而行，汽車每小時 50 公里，機車每小時 20 公里，幾小時後相遇？","o":["3","4.2","7","10.5"],"a":0,"e":"相向而行看速率和：50 + 20 = 70，210 ÷ 70 = 3 小時。"},{"q":"某數的 3 倍加 8 等於 35，某數是多少？","o":["9","11","27","43"],"a":0,"e":"3<i>x<\/i> + 8 = 35，3<i>x<\/i> = 27，<i>x<\/i> = 9。"},{"q":"三個連續整數的和是 84，其中最大的數是多少？","o":["27","28","29","30"],"a":2,"e":"設中間的數為 <i>x<\/i>：(<i>x<\/i> − 1) + <i>x<\/i> + (<i>x<\/i> + 1) = 84，<i>x<\/i> = 28，最大的是 29。"},{"q":"哥哥比弟弟大 4 歲，兩人年齡和是 30 歲，哥哥幾歲？","o":["13","15","17","26"],"a":2,"e":"設弟弟 <i>x<\/i> 歲：<i>x<\/i> + (<i>x<\/i> + 4) = 30，<i>x<\/i> = 13，哥哥 17 歲。"},{"q":"一件襯衫打 75 折後比原價便宜 150 元，原價是多少元？","o":["200","450","600","750"],"a":2,"e":"打 75 折便宜了原價的 25%：0.25<i>x<\/i> = 150，<i>x<\/i> = 600。"},{"q":"從家到學校，騎腳踏車每小時 12 公里，走路每小時 4 公里，騎車比走路少花 40 分鐘。家到學校多遠？","o":["3 公里","4 公里","6 公里","8 公里"],"a":1,"e":"設距離 <i>x<\/i> 公里：<span class=\"fr\"><span><i>x<\/i><\/span><span>4<\/span><\/span> − <span class=\"fr\"><span><i>x<\/i><\/span><span>12<\/span><\/span> = <span class=\"fr\"><span>40<\/span><span>60<\/span><\/span>，<span class=\"fr\"><span>2<i>x<\/i><\/span><span>12<\/span><\/span> = <span class=\"fr\"><span>2<\/span><span>3<\/span><\/span>，<i>x<\/i> = 4。"},{"q":"一些蘋果分給學生，每人 3 個會多 8 個，每人 5 個會少 4 個。蘋果有幾個？","o":["6","22","26","30"],"a":2,"e":"設學生 <i>x<\/i> 人：3<i>x<\/i> + 8 = 5<i>x<\/i> − 4，<i>x<\/i> = 6，蘋果 3 × 6 + 8 = 26 個。"},{"q":"甲、乙兩車同時從同一地點同向出發，甲每小時 60 公里，乙每小時 45 公里，幾小時後甲比乙多走 45 公里？","o":["1","3","9","15"],"a":1,"e":"每小時多走 60 − 45 = 15 公里，15<i>t<\/i> = 45，<i>t<\/i> = 3。"},{"q":"雞和兔共 35 隻，腳共 94 隻，雞有幾隻？","o":["11","12","23","24"],"a":2,"e":"設兔 <i>x<\/i> 隻：4<i>x<\/i> + 2(35 − <i>x<\/i>) = 94，2<i>x<\/i> = 24，<i>x<\/i> = 12，雞有 35 − 12 = 23 隻。"},{"q":"某校七年級共 360 人，男生比女生多 20 人，女生有幾人？","o":["160","170","180","190"],"a":1,"e":"設女生 <i>x<\/i> 人：<i>x<\/i> + (<i>x<\/i> + 20) = 360，<i>x<\/i> = 170。"},{"q":"爸爸今年 40 歲，女兒 10 歲，幾年前爸爸的年齡是女兒的 7 倍？","o":["3","4","5","6"],"a":2,"e":"設 <i>x<\/i> 年前：40 − <i>x<\/i> = 7(10 − <i>x<\/i>)，6<i>x<\/i> = 30，<i>x<\/i> = 5（當時 35 歲與 5 歲）。"},{"q":"長方形的周長 54 公分，長是寬的 2 倍，面積是多少平方公分？","o":["81","108","162","324"],"a":2,"e":"設寬 <i>x<\/i>：2(2<i>x<\/i> + <i>x<\/i>) = 54，<i>x<\/i> = 9，長 18，面積 9 × 18 = 162。"}],"fig":[],"w":"","sum":"從題目找出相等關係，列方程式解決生活問題。"},"2-1-1":{"rows":[{"h":"二元一次式","li":["化簡後含有兩種文字，而且每一種文字的次方都是 1，叫做<strong class=\"kw\">二元一次式<\/strong>，例如 4<i>x<\/i> − 3<i>y<\/i> + 1。","化簡時只合併<strong class=\"kw\">同類項<\/strong>：<i>x<\/i> 項和 <i>x<\/i> 項、<i>y<\/i> 項和 <i>y<\/i> 項、常數和常數。","有括號先用分配律去括號；有分母<strong class=\"kw\">先通分<\/strong>：<span class=\"fr\"><span><i>x<\/i> + <i>y<\/i><\/span><span>2<\/span><\/span> − <span class=\"fr\"><span><i>x<\/i> − <i>y<\/i><\/span><span>3<\/span><\/span> = <span class=\"fr\"><span>3(<i>x<\/i> + <i>y<\/i>) − 2(<i>x<\/i> − <i>y<\/i>)<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span><i>x<\/i> + 5<i>y<\/i><\/span><span>6<\/span><\/span>。"],"tip":[]},{"h":"二元一次方程式","li":["含有兩個未知數、未知數的次方都是 1 的等式，叫做<strong class=\"kw\">二元一次方程式<\/strong>，例如 2<i>x<\/i> + <i>y<\/i> = 7。","能使等式成立的一組數 (<i>x<\/i>, <i>y<\/i>)，叫做它的一組<strong class=\"kw\">解<\/strong>。","沒有其他條件時，一個二元一次方程式有<strong class=\"kw\">無限多組解<\/strong>。","加上「<i>x<\/i>、<i>y<\/i> 為正整數」之類的條件，解就可能<strong class=\"kw\">只有幾組<\/strong>。例：2<i>x<\/i> + <i>y<\/i> = 7 的正整數解有 (1, 5)、(2, 3)、(3, 1)。"],"tip":["已知一組解，把它代入方程式，可以求出式子中未知的係數。"]}],"ex":[{"q":"若 <i>x<\/i> = 2、<i>y<\/i> = −1 是 3<i>x<\/i> + <i>ay<\/i> = 10 的解，求 <i>a<\/i>。","a":["代入：3 × 2 + <i>a<\/i> × (−1) = 10，6 − <i>a<\/i> = 10","<i>a<\/i> = −4"]},{"q":"求 3<i>x<\/i> + <i>y<\/i> = 10 的所有正整數解。","a":["<i>y<\/i> = 10 − 3<i>x<\/i> 要大於 0，所以 <i>x<\/i> 只能是 1、2、3。","解為 (1, 7)、(2, 4)、(3, 1)。"]},{"q":"化簡 2(3<i>x<\/i> − <i>y<\/i>) − <span class=\"fr\"><span>4<i>x<\/i> − 6<i>y<\/i><\/span><span>2<\/span><\/span>。","a":["<span class=\"fr\"><span>4<i>x<\/i> − 6<i>y<\/i><\/span><span>2<\/span><\/span> = 2<i>x<\/i> − 3<i>y<\/i>","6<i>x<\/i> − 2<i>y<\/i> − (2<i>x<\/i> − 3<i>y<\/i>) = 6<i>x<\/i> − 2<i>y<\/i> − 2<i>x<\/i> + 3<i>y<\/i> = 4<i>x<\/i> + <i>y<\/i>"]}],"qs":[{"q":"下列哪一個是二元一次方程式？","o":["3<i>x<\/i> − 2<i>y<\/i> = 5","<i>x<\/i><sup>2<\/sup> + <i>y<\/i> = 4","2<i>x<\/i> + 5","<i>xy<\/i> = 6"],"a":0,"e":"3<i>x<\/i> − 2<i>y<\/i> = 5 有兩個未知數且次方都是 1。<i>x<\/i><sup>2<\/sup> 是二次；2<i>x<\/i> + 5 沒有等號，不是方程式；<i>xy<\/i> 是二次項。"},{"q":"化簡 3(2<i>x<\/i> − <i>y<\/i>) − 2(<i>x<\/i> − 4<i>y<\/i>) 的結果是什麼？","o":["4<i>x<\/i> + 5<i>y<\/i>","4<i>x<\/i> − 11<i>y<\/i>","4<i>x<\/i> − 5<i>y<\/i>","8<i>x<\/i> + 5<i>y<\/i>"],"a":0,"e":"6<i>x<\/i> − 3<i>y<\/i> − 2<i>x<\/i> + 8<i>y<\/i> = 4<i>x<\/i> + 5<i>y<\/i>。注意 −2 × (−4<i>y<\/i>) = +8<i>y<\/i>。"},{"q":"<i>x<\/i> + 2<i>y<\/i> = 9 的正整數解共有幾組？","o":["2","3","4","5"],"a":2,"e":"<i>y<\/i> = 1、2、3、4 時，<i>x<\/i> = 7、5、3、1，共 4 組；<i>y<\/i> = 5 時 <i>x<\/i> = −1 不是正整數。"},{"q":"若 (<i>x<\/i>, <i>y<\/i>) = (−1, 3) 是 <i>ax<\/i> + 2<i>y<\/i> = 10 的一組解，則 <i>a<\/i> 是多少？","o":["−4","4","16","−16"],"a":0,"e":"−<i>a<\/i> + 6 = 10，<i>a<\/i> = −4。"},{"q":"下列哪一個是二元一次式？","o":["3<i>x<\/i> − 2<i>y<\/i> + 5","<i>x<\/i><sup>2<\/sup> + <i>y<\/i>","<i>xy<\/i> − 1","2<i>x<\/i> + 7"],"a":0,"e":"3<i>x<\/i> − 2<i>y<\/i> + 5 含兩種文字，次方都是 1。<i>x<\/i><sup>2<\/sup>、<i>xy<\/i> 是二次；2<i>x<\/i> + 7 只有一種文字。"},{"q":"化簡 (4<i>x<\/i> − 3<i>y<\/i>) + (2<i>x<\/i> + 5<i>y<\/i>) 的結果是什麼？","o":["6<i>x<\/i> + 2<i>y<\/i>","6<i>x<\/i> − 8<i>y<\/i>","2<i>x<\/i> + 2<i>y<\/i>","6<i>x<\/i> + 8<i>y<\/i>"],"a":0,"e":"4<i>x<\/i> + 2<i>x<\/i> = 6<i>x<\/i>，−3<i>y<\/i> + 5<i>y<\/i> = 2<i>y<\/i>。"},{"q":"化簡 (5<i>x<\/i> + <i>y<\/i>) − (2<i>x<\/i> − 3<i>y<\/i>) 的結果是什麼？","o":["3<i>x<\/i> + 4<i>y<\/i>","3<i>x<\/i> − 2<i>y<\/i>","7<i>x<\/i> − 2<i>y<\/i>","3<i>x<\/i> + 2<i>y<\/i>"],"a":0,"e":"5<i>x<\/i> + <i>y<\/i> − 2<i>x<\/i> + 3<i>y<\/i> = 3<i>x<\/i> + 4<i>y<\/i>。"},{"q":"當 <i>x<\/i> = 2、<i>y<\/i> = −3 時，3<i>x<\/i> − 2<i>y<\/i> 的值是多少？","o":["0","6","12","−12"],"a":2,"e":"3 × 2 − 2 × (−3) = 6 + 6 = 12。"},{"q":"下列哪一組是 <i>x<\/i> + <i>y<\/i> = 6 的解？","o":["(2, 4)","(2, 3)","(4, 1)","(−1, 5)"],"a":0,"e":"2 + 4 = 6；其他組的和分別是 5、5、4。"},{"q":"下列哪一組不是 2<i>x<\/i> − <i>y<\/i> = 4 的解？","o":["(2, 1)","(3, 2)","(0, −4)","(1, −2)"],"a":0,"e":"2 × 2 − 1 = 3 ≠ 4；其他三組代入都等於 4。"},{"q":"3<i>x<\/i> + 2<i>y<\/i> = 18 的正整數解共有幾組？","o":["1","2","3","6"],"a":1,"e":"<i>x<\/i> = 2 時 <i>y<\/i> = 6，<i>x<\/i> = 4 時 <i>y<\/i> = 3；<i>x<\/i> = 6 時 <i>y<\/i> = 0 不是正整數，所以只有 2 組。"},{"q":"若 (<i>a<\/i>, 3) 是 2<i>x<\/i> + 5<i>y<\/i> = 7 的一組解，<i>a<\/i> 是多少？","o":["−4","4","11","−11"],"a":0,"e":"2<i>a<\/i> + 15 = 7，2<i>a<\/i> = −8，<i>a<\/i> = −4。"},{"q":"化簡 <span class=\"fr\"><span><i>x<\/i> + 2<i>y<\/i><\/span><span>3<\/span><\/span> + <span class=\"fr\"><span><i>x<\/i> − <i>y<\/i><\/span><span>2<\/span><\/span> 的結果是什麼？","o":["<span class=\"fr\"><span>5<i>x<\/i> + <i>y<\/i><\/span><span>6<\/span><\/span>","<span class=\"fr\"><span>5<i>x<\/i> + 7<i>y<\/i><\/span><span>6<\/span><\/span>","<span class=\"fr\"><span>2<i>x<\/i> + <i>y<\/i><\/span><span>5<\/span><\/span>","<span class=\"fr\"><span>5<i>x<\/i> − <i>y<\/i><\/span><span>6<\/span><\/span>"],"a":0,"e":"通分：<span class=\"fr\"><span>2(<i>x<\/i> + 2<i>y<\/i>) + 3(<i>x<\/i> − <i>y<\/i>)<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>2<i>x<\/i> + 4<i>y<\/i> + 3<i>x<\/i> − 3<i>y<\/i><\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>5<i>x<\/i> + <i>y<\/i><\/span><span>6<\/span><\/span>。"},{"q":"「每個 <i>x<\/i> 元的蛋糕買 3 個，每杯 <i>y<\/i> 元的飲料買 2 杯，共 250 元」寫成方程式是哪一個？","o":["3<i>x<\/i> + 2<i>y<\/i> = 250","2<i>x<\/i> + 3<i>y<\/i> = 250","3<i>x<\/i> = 2<i>y<\/i> + 250","<i>x<\/i> + <i>y<\/i> = 250"],"a":0,"e":"蛋糕 3<i>x<\/i> 元加飲料 2<i>y<\/i> 元等於 250 元。"},{"q":"方程式 4<i>x<\/i> − <i>ky<\/i> = 10 有一組解是 (4, 2)，<i>k<\/i> 是多少？","o":["3","−3","13","2"],"a":0,"e":"16 − 2<i>k<\/i> = 10，2<i>k<\/i> = 6，<i>k<\/i> = 3。"}],"fig":[],"w":"","sum":"認識有兩個未知數的方程式，以及它的無限多組解。"},"2-1-2":{"rows":[{"h":"聯立方程式與它的解","li":["兩個二元一次方程式寫在一起，叫做<strong class=\"kw\">二元一次聯立方程式<\/strong>，例如 <span class=\"sys\"><span class=\"eqs\"><span><i>x<\/i> + <i>y<\/i> = 5<\/span><span><i>x<\/i> − <i>y<\/i> = 1<\/span><\/span><\/span>。","能同時使兩個方程式成立的一組 (<i>x<\/i>, <i>y<\/i>)，就是聯立方程式的<strong class=\"kw\">解<\/strong>。"],"tip":[]},{"h":"代入消去法","li":["把其中一式改寫成 <i>y<\/i> = …（或 <i>x<\/i> = …），<strong class=\"kw\">代入另一式<\/strong>，消去一個未知數。","適合某個未知數的<strong class=\"kw\">係數是 1 或 −1<\/strong> 的時候。"],"tip":[]},{"h":"加減消去法","li":["把兩式乘上適當的數，讓某個未知數的<strong class=\"kw\">係數相同或互為相反數<\/strong>。","係數相同就兩式<strong class=\"kw\">相減<\/strong>，係數互為相反數就兩式<strong class=\"kw\">相加<\/strong>，消去它。"],"tip":["係數有分數或小數時，先乘上適當的數化成整數係數再解。"]},{"h":"特殊形式","li":["<strong class=\"kw\">A = B = C<\/strong> 的形式：拆成 <span class=\"sys\"><span class=\"eqs\"><span>A = B<\/span><span>B = C<\/span><\/span><\/span> 或 <span class=\"sys\"><span class=\"eqs\"><span>A = C<\/span><span>B = C<\/span><\/span><\/span> 再解。","若 |A| + |B| = 0 或 A<sup>2<\/sup> + B<sup>2<\/sup> = 0，則 <strong class=\"kw\">A = 0 且 B = 0<\/strong>，列成聯立方程式。"],"tip":[]}],"ex":[{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span>3<i>x<\/i> + 2<i>y<\/i> = 4<\/span><span>5<i>x<\/i> − 2<i>y<\/i> = 12<\/span><\/span><\/span>。","a":["<i>y<\/i> 的係數互為相反數，兩式相加：8<i>x<\/i> = 16，<i>x<\/i> = 2。","代回第一式：6 + 2<i>y<\/i> = 4，<i>y<\/i> = −1，解為 (2, −1)。"]},{"q":"用代入消去法解 <span class=\"sys\"><span class=\"eqs\"><span><i>y<\/i> = <i>x<\/i> + 2<\/span><span>3<i>x<\/i> + 2<i>y<\/i> = 14<\/span><\/span><\/span>。","a":["代入：3<i>x<\/i> + 2(<i>x<\/i> + 2) = 14，5<i>x<\/i> = 10，<i>x<\/i> = 2","<i>y<\/i> = 2 + 2 = 4，解為 (2, 4)"]},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span>2<i>x<\/i> + 3<i>y<\/i> = 13<\/span><span>3<i>x<\/i> − 2<i>y<\/i> = 0<\/span><\/span><\/span>。","a":["第一式乘 2、第二式乘 3：4<i>x<\/i> + 6<i>y<\/i> = 26，9<i>x<\/i> − 6<i>y<\/i> = 0","兩式相加：13<i>x<\/i> = 26，<i>x<\/i> = 2；代回得 <i>y<\/i> = 3"]}],"qs":[{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span><i>x<\/i> + <i>y<\/i> = 7<\/span><span><i>x<\/i> − <i>y<\/i> = 3<\/span><\/span><\/span>，<i>x<\/i> 是多少？","o":["2","4","5","10"],"a":2,"e":"兩式相加：2<i>x<\/i> = 10，<i>x<\/i> = 5（<i>y<\/i> = 2）。"},{"q":"聯立方程式 <span class=\"sys\"><span class=\"eqs\"><span>2<i>x<\/i> + 3<i>y<\/i> = 1<\/span><span>3<i>x<\/i> + 2<i>y<\/i> = 9<\/span><\/span><\/span> 的解是哪一組？","o":["(5, −3)","(−3, 5)","(5, 3)","(2, −1)"],"a":0,"e":"兩式相加：5<i>x<\/i> + 5<i>y<\/i> = 10，<i>x<\/i> + <i>y<\/i> = 2；兩式相減：<i>x<\/i> − <i>y<\/i> = 8。得 <i>x<\/i> = 5，<i>y<\/i> = −3。"},{"q":"若 |<i>x<\/i> − 2<i>y<\/i>| + |<i>x<\/i> + <i>y<\/i> − 6| = 0，則 <i>x<\/i>、<i>y<\/i> 各是多少？","o":["<i>x<\/i> = 4，<i>y<\/i> = 2","<i>x<\/i> = 2，<i>y<\/i> = 4","<i>x<\/i> = 6，<i>y<\/i> = 0","<i>x<\/i> = 3，<i>y<\/i> = 3"],"a":0,"e":"兩個絕對值都要是 0：<i>x<\/i> = 2<i>y<\/i> 且 <i>x<\/i> + <i>y<\/i> = 6，代入得 3<i>y<\/i> = 6，<i>y<\/i> = 2，<i>x<\/i> = 4。"},{"q":"解 <i>x<\/i> + 2<i>y<\/i> = 2<i>x<\/i> − <i>y<\/i> = 5，(<i>x<\/i>, <i>y<\/i>) 是哪一組？","o":["(3, 1)","(1, 3)","(5, 0)","(1, 2)"],"a":0,"e":"拆成 <i>x<\/i> + 2<i>y<\/i> = 5 與 2<i>x<\/i> − <i>y<\/i> = 5。由第二式 <i>y<\/i> = 2<i>x<\/i> − 5，代入第一式：<i>x<\/i> + 4<i>x<\/i> − 10 = 5，<i>x<\/i> = 3，<i>y<\/i> = 1。"},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span><i>y<\/i> = 2<i>x<\/i><\/span><span><i>x<\/i> + <i>y<\/i> = 12<\/span><\/span><\/span>，(<i>x<\/i>, <i>y<\/i>) 是哪一組？","o":["(4, 8)","(8, 4)","(6, 6)","(3, 6)"],"a":0,"e":"把 <i>y<\/i> = 2<i>x<\/i> 代入第二式：3<i>x<\/i> = 12，<i>x<\/i> = 4，<i>y<\/i> = 8。"},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span><i>x<\/i> + <i>y<\/i> = 10<\/span><span><i>x<\/i> − <i>y<\/i> = 2<\/span><\/span><\/span>，<i>y<\/i> 是多少？","o":["2","4","6","8"],"a":1,"e":"兩式相減：2<i>y<\/i> = 8，<i>y<\/i> = 4（<i>x<\/i> = 6）。"},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span>2<i>x<\/i> + <i>y<\/i> = 7<\/span><span><i>x<\/i> − <i>y<\/i> = 2<\/span><\/span><\/span>，(<i>x<\/i>, <i>y<\/i>) 是哪一組？","o":["(3, 1)","(1, 3)","(3, −1)","(2, 3)"],"a":0,"e":"兩式相加：3<i>x<\/i> = 9，<i>x<\/i> = 3，代回得 <i>y<\/i> = 1。"},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span>3<i>x<\/i> + 2<i>y<\/i> = 12<\/span><span>3<i>x<\/i> − <i>y<\/i> = 3<\/span><\/span><\/span>，(<i>x<\/i>, <i>y<\/i>) 是哪一組？","o":["(2, 3)","(3, 2)","(4, 0)","(1, 0)"],"a":0,"e":"兩式相減：3<i>y<\/i> = 9，<i>y<\/i> = 3，代回 3<i>x<\/i> − 3 = 3，<i>x<\/i> = 2。"},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span><i>x<\/i> = <i>y<\/i> + 3<\/span><span>2<i>x<\/i> + 3<i>y<\/i> = 16<\/span><\/span><\/span>，<i>x<\/i> + <i>y<\/i> 是多少？","o":["3","5","7","9"],"a":2,"e":"代入：2(<i>y<\/i> + 3) + 3<i>y<\/i> = 16，5<i>y<\/i> = 10，<i>y<\/i> = 2，<i>x<\/i> = 5，<i>x<\/i> + <i>y<\/i> = 7。"},{"q":"用加減消去法解 <span class=\"sys\"><span class=\"eqs\"><span>4<i>x<\/i> + 3<i>y<\/i> = 5<\/span><span>2<i>x<\/i> + <i>y<\/i> = 1<\/span><\/span><\/span>，要消去 <i>x<\/i>，第二式應先乘以多少再與第一式相減？","o":["1","2","3","4"],"a":1,"e":"第二式乘 2 得 4<i>x<\/i> + 2<i>y<\/i> = 2，<i>x<\/i> 的係數就和第一式相同。"},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span>0.2<i>x<\/i> + 0.3<i>y<\/i> = 1.2<\/span><span><i>x<\/i> − <i>y<\/i> = 1<\/span><\/span><\/span>，(<i>x<\/i>, <i>y<\/i>) 是哪一組？","o":["(3, 2)","(2, 3)","(4, 3)","(1.5, 0.5)"],"a":0,"e":"第一式乘 10：2<i>x<\/i> + 3<i>y<\/i> = 12；由 <i>x<\/i> = <i>y<\/i> + 1 代入：5<i>y<\/i> + 2 = 12，<i>y<\/i> = 2，<i>x<\/i> = 3。"},{"q":"若 <span class=\"sys\"><span class=\"eqs\"><span><i>ax<\/i> + <i>by<\/i> = 7<\/span><span><i>bx<\/i> + <i>ay<\/i> = 8<\/span><\/span><\/span> 的解是 <i>x<\/i> = 2、<i>y<\/i> = 1，則 <i>a<\/i> + <i>b<\/i> 是多少？","o":["3","5","7","15"],"a":1,"e":"代入得 2<i>a<\/i> + <i>b<\/i> = 7、<i>a<\/i> + 2<i>b<\/i> = 8，兩式相加 3<i>a<\/i> + 3<i>b<\/i> = 15，<i>a<\/i> + <i>b<\/i> = 5。"},{"q":"若 (<i>x<\/i> − 3)<sup>2<\/sup> + |<i>y<\/i> + 2| = 0，則 <i>x<\/i> + <i>y<\/i> 是多少？","o":["1","5","−1","−5"],"a":0,"e":"平方和絕對值都不小於 0，相加為 0 時兩者都是 0：<i>x<\/i> = 3，<i>y<\/i> = −2。"},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span><span class=\"fr\"><span><i>x<\/i><\/span><span>2<\/span><\/span> + <span class=\"fr\"><span><i>y<\/i><\/span><span>3<\/span><\/span> = 3<\/span><span><i>x<\/i> − <i>y<\/i> = 1<\/span><\/span><\/span>，(<i>x<\/i>, <i>y<\/i>) 是哪一組？","o":["(4, 3)","(3, 4)","(6, 0)","(2, 1)"],"a":0,"e":"第一式乘 6：3<i>x<\/i> + 2<i>y<\/i> = 18；<i>x<\/i> = <i>y<\/i> + 1 代入：5<i>y<\/i> + 3 = 18，<i>y<\/i> = 3，<i>x<\/i> = 4。"},{"q":"解 <span class=\"sys\"><span class=\"eqs\"><span>5<i>x<\/i> + 2<i>y<\/i> = 1<\/span><span>3<i>x<\/i> + 4<i>y<\/i> = 9<\/span><\/span><\/span>，(<i>x<\/i>, <i>y<\/i>) 是哪一組？","o":["(−1, 3)","(1, −2)","(3, −1)","(−1, −3)"],"a":0,"e":"第一式乘 2 得 10<i>x<\/i> + 4<i>y<\/i> = 2，減去第二式：7<i>x<\/i> = −7，<i>x<\/i> = −1，代回得 <i>y<\/i> = 3。"}],"fig":[],"w":"lines","sum":"用代入或加減消去法，把兩個未知數變成一個。","wo":""},"2-1-3":{"rows":[{"h":"解題步驟","li":["找出<strong class=\"kw\">兩個未知量<\/strong>，分別設為 <i>x<\/i>、<i>y<\/i>（寫清楚單位）。","從題目找出<strong class=\"kw\">兩個<\/strong>相等關係，列成聯立方程式。","解出後驗算，並檢查是否<strong class=\"kw\">符合題意<\/strong>，例如人數、張數要是正整數。"],"tip":["題目給了兩種方案或兩種情況時，通常就對應兩個方程式。"]},{"h":"常見類型","li":["買賣：分別用<strong class=\"kw\">「數量」與「總價」<\/strong>各列一式。","數字問題：兩位數 = <strong class=\"kw\">10 × 十位數字 + 個位數字<\/strong>。","雞兔、票價：「隻數（張數）和」與「腳數（總價）和」<strong class=\"kw\">各列一式<\/strong>。","行船：順流速率 = <strong class=\"kw\">船速 + 水速<\/strong>，逆流速率 = 船速 − 水速。"],"tip":[]}],"ex":[{"q":"2 杯奶茶加 3 個麵包共 145 元，1 杯奶茶加 2 個麵包共 85 元。奶茶與麵包各多少元？","a":["設奶茶 <i>x<\/i> 元、麵包 <i>y<\/i> 元：<span class=\"sys\"><span class=\"eqs\"><span>2<i>x<\/i> + 3<i>y<\/i> = 145<\/span><span><i>x<\/i> + 2<i>y<\/i> = 85<\/span><\/span><\/span>","第二式乘 2 再減去第一式：<i>y<\/i> = 25，代回得 <i>x<\/i> = 35。"]},{"q":"雞兔共 30 隻，腳共 84 隻，雞、兔各幾隻？","a":["設雞 <i>x<\/i> 隻、兔 <i>y<\/i> 隻：<span class=\"sys\"><span class=\"eqs\"><span><i>x<\/i> + <i>y<\/i> = 30<\/span><span>2<i>x<\/i> + 4<i>y<\/i> = 84<\/span><\/span><\/span>","第二式除以 2 再減第一式：<i>y<\/i> = 12，<i>x<\/i> = 18"]},{"q":"一艘船順流 2 小時行 36 公里，逆流 3 小時行 36 公里，求船在靜水中的速率與水流速率。","a":["順流速率 36 ÷ 2 = 18，逆流速率 36 ÷ 3 = 12：<span class=\"sys\"><span class=\"eqs\"><span>船速 + 水速 = 18<\/span><span>船速 − 水速 = 12<\/span><\/span><\/span>","船速每小時 15 公里，水速每小時 3 公里"]}],"qs":[{"q":"電影票全票 300 元、半票 150 元。某班 36 人共付 8550 元，全票有幾張？","o":["15","18","21","24"],"a":2,"e":"設全票 <i>x<\/i> 張、半票 <i>y<\/i> 張：<i>x<\/i> + <i>y<\/i> = 36，300<i>x<\/i> + 150<i>y<\/i> = 8550。第二式除以 150 得 2<i>x<\/i> + <i>y<\/i> = 57，減去第一式得 <i>x<\/i> = 21。"},{"q":"一個兩位數的十位數字與個位數字和為 11，把兩個數字對調後，新數比原數大 27。原數是多少？","o":["47","74","38","56"],"a":0,"e":"設十位 <i>a<\/i>、個位 <i>b<\/i>：<i>a<\/i> + <i>b<\/i> = 11，(10<i>b<\/i> + <i>a<\/i>) − (10<i>a<\/i> + <i>b<\/i>) = 27，得 <i>b<\/i> − <i>a<\/i> = 3，所以 <i>a<\/i> = 4、<i>b<\/i> = 7。"},{"q":"一艘船順流每小時行 18 公里，逆流每小時行 12 公里，水流速率是每小時幾公里？","o":["3","6","15","30"],"a":0,"e":"船速 + 水速 = 18，船速 − 水速 = 12，兩式相減：2 × 水速 = 6，水速 = 3。"},{"q":"文具店的原子筆每枝 <i>x<\/i> 元、筆記本每本 <i>y<\/i> 元。買 3 枝筆和 2 本筆記本要 110 元，買 1 枝筆和 4 本筆記本要 120 元。筆記本每本多少元？","o":["20","25","30","35"],"a":1,"e":"3<i>x<\/i> + 2<i>y<\/i> = 110，<i>x<\/i> + 4<i>y<\/i> = 120。第二式乘 3 減第一式：10<i>y<\/i> = 250，<i>y<\/i> = 25（<i>x<\/i> = 20）。"},{"q":"兩數的和是 40、差是 8，較大的數是多少？","o":["16","20","24","32"],"a":2,"e":"設兩數 <i>x<\/i>、<i>y<\/i>：<i>x<\/i> + <i>y<\/i> = 40，<i>x<\/i> − <i>y<\/i> = 8，相加得 2<i>x<\/i> = 48，<i>x<\/i> = 24。"},{"q":"3 個蘋果和 2 個梨共 80 元，1 個蘋果和 2 個梨共 40 元。蘋果每個多少元？","o":["10","15","20","30"],"a":2,"e":"兩式相減：2 個蘋果 = 40 元，蘋果每個 20 元（梨每個 10 元）。"},{"q":"停車場有汽車和機車共 30 輛，輪子共 96 個，汽車有幾輛？","o":["12","15","18","24"],"a":2,"e":"設汽車 <i>x<\/i> 輛、機車 <i>y<\/i> 輛：<i>x<\/i> + <i>y<\/i> = 30，4<i>x<\/i> + 2<i>y<\/i> = 96；第二式除以 2 減第一式得 <i>x<\/i> = 18。"},{"q":"便當店賣甲、乙兩種便當，甲 80 元、乙 100 元，一天賣出 50 個共 4400 元。甲便當賣出幾個？","o":["20","25","30","35"],"a":2,"e":"設甲 <i>x<\/i> 個、乙 <i>y<\/i> 個：<i>x<\/i> + <i>y<\/i> = 50，80<i>x<\/i> + 100<i>y<\/i> = 4400，解得 <i>x<\/i> = 30、<i>y<\/i> = 20。"},{"q":"一個兩位數的十位數字比個位數字大 2，兩個數字的和是 12，這個兩位數是多少？","o":["57","64","75","84"],"a":2,"e":"設十位 <i>a<\/i>、個位 <i>b<\/i>：<i>a<\/i> − <i>b<\/i> = 2，<i>a<\/i> + <i>b<\/i> = 12，得 <i>a<\/i> = 7、<i>b<\/i> = 5。"},{"q":"船在靜水中每小時行 20 公里，順流 3 小時行了 72 公里，水流速率是每小時幾公里？","o":["2","4","6","24"],"a":1,"e":"順流速率 = 72 ÷ 3 = 24 = 20 + 水速，水速 = 4。"},{"q":"甲、乙兩人存款共 5000 元，甲的存款是乙的 1.5 倍，甲存款多少元？","o":["2000","2500","3000","3500"],"a":2,"e":"設乙 <i>y<\/i> 元、甲 1.5<i>y<\/i> 元：2.5<i>y<\/i> = 5000，<i>y<\/i> = 2000，甲 3000 元。"},{"q":"一張考卷有選擇題和填充題共 25 題，選擇題每題 3 分、填充題每題 5 分，滿分 95 分。填充題有幾題？","o":["8","10","12","15"],"a":1,"e":"設選擇 <i>x<\/i> 題、填充 <i>y<\/i> 題：<i>x<\/i> + <i>y<\/i> = 25，3<i>x<\/i> + 5<i>y<\/i> = 95，代入得 75 + 2<i>y<\/i> = 95，<i>y<\/i> = 10。"},{"q":"小華有 10 元和 50 元硬幣共 22 枚，總共 620 元。50 元硬幣有幾枚？","o":["8","10","12","14"],"a":1,"e":"設 10 元 <i>x<\/i> 枚、50 元 <i>y<\/i> 枚：<i>x<\/i> + <i>y<\/i> = 22，10<i>x<\/i> + 50<i>y<\/i> = 620，得 40<i>y<\/i> = 400，<i>y<\/i> = 10。"},{"q":"父子兩人年齡和是 52 歲，4 年後父親的年齡是兒子的 3 倍。父親今年幾歲？","o":["39","40","41","44"],"a":2,"e":"設父 <i>x<\/i> 歲、子 <i>y<\/i> 歲：<i>x<\/i> + <i>y<\/i> = 52，<i>x<\/i> + 4 = 3(<i>y<\/i> + 4)，得 <i>y<\/i> = 11、<i>x<\/i> = 41。"},{"q":"3 個大盒和 4 個小盒共裝 100 顆球，2 個大盒和 3 個小盒共裝 70 顆球。一個大盒裝幾顆？","o":["10","15","20","25"],"a":2,"e":"設大盒 <i>x<\/i> 顆、小盒 <i>y<\/i> 顆：3<i>x<\/i> + 4<i>y<\/i> = 100，2<i>x<\/i> + 3<i>y<\/i> = 70；第一式乘 3 減第二式乘 4：<i>x<\/i> = 20（<i>y<\/i> = 10）。"}],"fig":[],"w":"","sum":"找出兩個相等關係，列聯立方程式解應用題。"},"2-2-1":{"rows":[{"h":"坐標平面","li":["兩條互相垂直、交於原點 O 的數線，構成<strong class=\"kw\">直角坐標平面<\/strong>。","水平的叫 <strong class=\"kw\"><i>x<\/i> 軸（橫軸）<\/strong>，向右為正；鉛直的叫 <i>y<\/i> 軸（縱軸），向上為正。"],"tip":[]},{"h":"點的坐標","li":["點 P 的位置用數對 (<i>a<\/i>, <i>b<\/i>) 表示，<i>a<\/i> 是 <strong class=\"kw\"><i>x<\/i> 坐標<\/strong>，<i>b<\/i> 是 <strong class=\"kw\"><i>y<\/i> 坐標<\/strong>，記作 P(<i>a<\/i>, <i>b<\/i>)。","原點是 (0, 0)；<strong class=\"kw\"><i>x<\/i> 軸上的點是 (<i>a<\/i>, 0)<\/strong>；<i>y<\/i> 軸上的點是 (0, <i>b<\/i>)。","若 (<i>a<\/i>, <i>b<\/i>) 與 (<i>c<\/i>, <i>d<\/i>) 是同一點，則 <strong class=\"kw\"><i>a<\/i> = <i>c<\/i> 且 <i>b<\/i> = <i>d<\/i><\/strong>。"],"tip":[]},{"h":"點到兩軸的距離","li":["P(<i>a<\/i>, <i>b<\/i>) 到 <strong class=\"kw\"><i>x<\/i> 軸<\/strong>的距離是 |<i>b<\/i>|，到 <strong class=\"kw\"><i>y<\/i> 軸<\/strong>的距離是 |<i>a<\/i>|。"],"tip":["「到 <i>x<\/i> 軸的距離」看的是 <i>y<\/i> 坐標，兩者很容易弄反。"]},{"h":"象限","li":["兩軸把平面分成四個<strong class=\"kw\">象限<\/strong>，從右上開始逆時針依序是第一、二、三、四象限。","坐標符號：<strong class=\"kw\">第一 (＋, ＋)、第二 (−, ＋)、第三 (−, −)、第四 (＋, −)<\/strong>。","坐標軸上的點<strong class=\"kw\">不屬於任何象限<\/strong>。"],"tip":[]},{"h":"點的平移","li":["向右平移 <i>s<\/i> 單位：<strong class=\"kw\">(<i>a<\/i> + <i>s<\/i>, <i>b<\/i>)<\/strong>；向左：(<i>a<\/i> − <i>s<\/i>, <i>b<\/i>)。","向上平移 <i>t<\/i> 單位：<strong class=\"kw\">(<i>a<\/i>, <i>b<\/i> + <i>t<\/i>)<\/strong>；向下：(<i>a<\/i>, <i>b<\/i> − <i>t<\/i>)。","同一條水平線上兩點的距離 = <strong class=\"kw\"><i>x<\/i> 坐標相減的絕對值<\/strong>；同一條鉛直線上看 <i>y<\/i> 坐標。"],"tip":[]}],"ex":[{"q":"點 A(−3, 5) 先向右移 7 單位，再向下移 8 單位得到點 B。B 在第幾象限？","a":["B(−3 + 7, 5 − 8) = B(4, −3)","<i>x<\/i> 坐標為正、<i>y<\/i> 坐標為負，在第四象限。"]},{"q":"點 P(2<i>a<\/i> − 4, <i>a<\/i> + 3) 在 <i>x<\/i> 軸上，求 P 的坐標。","a":["<i>x<\/i> 軸上的點 <i>y<\/i> 坐標是 0：<i>a<\/i> + 3 = 0，<i>a<\/i> = −3","P(2 × (−3) − 4, 0) = P(−10, 0)"]},{"q":"求 A(−2, 3)、B(4, 3)、C(4, −1) 三點圍成的三角形面積。","a":["<span class=\"seg\">AB<\/span> 在水平線上，長 4 − (−2) = 6；<span class=\"seg\">BC<\/span> 在鉛直線上，長 3 − (−1) = 4。","直角在 B，面積 = 6 × 4 ÷ 2 = 12"]}],"qs":[{"q":"點 P(−4, 7) 到 <i>x<\/i> 軸的距離是多少？","o":["−4","4","7","11"],"a":2,"e":"到 <i>x<\/i> 軸的距離看 <i>y<\/i> 坐標：|7| = 7。"},{"q":"若 <i>a<\/i> &gt; 0、<i>b<\/i> &lt; 0，點 (−<i>a<\/i>, <i>b<\/i>) 在第幾象限？","o":["第三象限","第一象限","第二象限","第四象限"],"a":0,"e":"−<i>a<\/i> &lt; 0，<i>b<\/i> &lt; 0，坐標符號 (−, −)，在第三象限。"},{"q":"已知點 (2<i>m<\/i> − 6, <i>m<\/i> + 1) 在 <i>y<\/i> 軸上，<i>m<\/i> 是多少？","o":["−3","−1","3","6"],"a":2,"e":"<i>y<\/i> 軸上的點 <i>x<\/i> 坐標為 0：2<i>m<\/i> − 6 = 0，<i>m<\/i> = 3。"},{"q":"A(−2, 3)、B(5, 3) 兩點的距離是多少？","o":["3","6","7","10"],"a":2,"e":"兩點 <i>y<\/i> 坐標相同，在同一條水平線上，距離 = |5 − (−2)| = 7。"},{"q":"點 (3, −5) 在第幾象限？","o":["第一象限","第二象限","第三象限","第四象限"],"a":3,"e":"<i>x<\/i> 坐標為正、<i>y<\/i> 坐標為負，是第四象限。"},{"q":"點 (−2, 0) 在哪裡？","o":["<i>x<\/i> 軸上","<i>y<\/i> 軸上","第二象限","第三象限"],"a":0,"e":"<i>y<\/i> 坐標為 0 的點在 <i>x<\/i> 軸上，不屬於任何象限。"},{"q":"點 P(−6, 2) 到 <i>y<\/i> 軸的距離是多少？","o":["6","2","−6","8"],"a":0,"e":"到 <i>y<\/i> 軸的距離看 <i>x<\/i> 坐標的絕對值：|−6| = 6。"},{"q":"若點 (<i>a<\/i> − 4, 3) 在 <i>y<\/i> 軸上，<i>a<\/i> 是多少？","o":["4","−4","3","−3"],"a":0,"e":"<i>y<\/i> 軸上的點 <i>x<\/i> 坐標為 0：<i>a<\/i> − 4 = 0，<i>a<\/i> = 4。"},{"q":"點 A(2, −3) 向左平移 5 單位後的坐標是什麼？","o":["(−3, −3)","(7, −3)","(2, −8)","(2, 2)"],"a":0,"e":"向左平移只改 <i>x<\/i> 坐標：2 − 5 = −3。"},{"q":"點 B(−1, 4) 向下平移 6 單位後，在第幾象限？","o":["第一象限","第二象限","第三象限","第四象限"],"a":2,"e":"平移後是 (−1, −2)，<i>x<\/i>、<i>y<\/i> 都為負，是第三象限。"},{"q":"若點 (<i>a<\/i>, <i>b<\/i>) 在第二象限，則點 (<i>b<\/i>, <i>a<\/i>) 在第幾象限？","o":["第一象限","第二象限","第三象限","第四象限"],"a":3,"e":"第二象限 <i>a<\/i> &lt; 0、<i>b<\/i> &gt; 0，所以 (<i>b<\/i>, <i>a<\/i>) 的 <i>x<\/i> 為正、<i>y<\/i> 為負，在第四象限。"},{"q":"A(4, −1)、B(4, 6) 兩點的距離是多少？","o":["3","5","7","8"],"a":2,"e":"兩點 <i>x<\/i> 坐標相同，在同一條鉛直線上，距離 = |6 − (−1)| = 7。"},{"q":"長方形 ABCD 的三個頂點是 A(−2, 1)、B(3, 1)、C(3, 4)，第四個頂點 D 的坐標是什麼？","o":["(−2, 4)","(4, −2)","(3, −2)","(−2, −4)"],"a":0,"e":"AB 是水平邊、BC 是鉛直邊，D 的 <i>x<\/i> 坐標跟 A 相同、<i>y<\/i> 坐標跟 C 相同。"},{"q":"若點 (<i>m<\/i> + 2, 3) 與點 (5, <i>n<\/i> − 1) 是同一點，<i>m<\/i> + <i>n<\/i> 是多少？","o":["1","5","7","9"],"a":2,"e":"<i>m<\/i> + 2 = 5，<i>n<\/i> − 1 = 3，所以 <i>m<\/i> = 3、<i>n<\/i> = 4，<i>m<\/i> + <i>n<\/i> = 7。"},{"q":"三角形 ABC 的頂點是 A(0, 0)、B(6, 0)、C(2, 4)，面積是多少？","o":["8","10","12","24"],"a":2,"e":"底 <span class=\"seg\">AB<\/span> = 6，C 到 <i>x<\/i> 軸的高是 4，面積 = 6 × 4 ÷ 2 = 12。"}],"fig":[],"w":"coord","sum":"用數對表示點的位置，判斷象限並做平移。","wo":""},"2-2-2":{"rows":[{"h":"圖形是一條直線","li":["把方程式 <i>ax<\/i> + <i>by<\/i> = <i>c<\/i> 的每一組解畫成點，所有的點連起來是一條<strong class=\"kw\">直線<\/strong>，就是它的圖形。","畫圖只要找出<strong class=\"kw\">兩組解<\/strong>（常令 <i>x<\/i> = 0、<i>y<\/i> = 0），描點後連成直線即可。","點 (<i>x<\/i><sub>1<\/sub>, <i>y<\/i><sub>1<\/sub>) 在 <i>ax<\/i> + <i>by<\/i> = <i>c<\/i> 的圖形上，表示 <strong class=\"kw\"><i>a<\/i> <i>x<\/i><sub>1<\/sub> + <i>b<\/i> <i>y<\/i><sub>1<\/sub> = <i>c<\/i><\/strong>。"],"tip":[]},{"h":"三種直線","li":["<i>y<\/i> = <i>k<\/i>（<i>k<\/i> 為常數）：<strong class=\"kw\">水平線<\/strong>，與 <i>x<\/i> 軸平行；<i>x<\/i> 軸的方程式是 <i>y<\/i> = 0。","<i>x<\/i> = <i>h<\/i>（<i>h<\/i> 為常數）：<strong class=\"kw\">鉛垂線<\/strong>，與 <i>y<\/i> 軸平行；<i>y<\/i> 軸的方程式是 <i>x<\/i> = 0。","其他的 <i>ax<\/i> + <i>by<\/i> = <i>c<\/i>（<i>a<\/i>、<i>b<\/i> 都不為 0）：<strong class=\"kw\">斜直線<\/strong>，可寫成 <i>y<\/i> = <i>mx<\/i> + <i>k<\/i> 的形式。"],"tip":[]},{"h":"已知兩點求直線","li":["兩點 <i>y<\/i> 坐標相同：<strong class=\"kw\">水平線 <i>y<\/i> = <i>k<\/i><\/strong>；<i>x<\/i> 坐標相同：鉛垂線 <i>x<\/i> = <i>h<\/i>。","都不相同：<strong class=\"kw\">設 <i>y<\/i> = <i>ax<\/i> + <i>b<\/i><\/strong>，把兩點代入，解聯立方程式求 <i>a<\/i>、<i>b<\/i>。"],"tip":[]},{"h":"聯立方程式的圖形","li":["兩條直線的<strong class=\"kw\">交點坐標<\/strong>就是聯立方程式的解。","兩直線交於一點，聯立方程式<strong class=\"kw\">恰有一組解<\/strong>。"],"tip":[]}],"ex":[{"q":"求通過 (1, 3) 與 (3, 7) 的直線方程式。","a":["設 <i>y<\/i> = <i>ax<\/i> + <i>b<\/i>，代入：<span class=\"sys\"><span class=\"eqs\"><span><i>a<\/i> + <i>b<\/i> = 3<\/span><span>3<i>a<\/i> + <i>b<\/i> = 7<\/span><\/span><\/span>","相減得 <i>a<\/i> = 2，<i>b<\/i> = 1，直線為 <i>y<\/i> = 2<i>x<\/i> + 1。"]},{"q":"畫 2<i>x<\/i> + 3<i>y<\/i> = 6 的圖形，可以先找哪兩個點？","a":["令 <i>x<\/i> = 0：3<i>y<\/i> = 6，<i>y<\/i> = 2，得 (0, 2)","令 <i>y<\/i> = 0：2<i>x<\/i> = 6，<i>x<\/i> = 3，得 (3, 0)；把兩點連成直線"]},{"q":"求直線 <i>x<\/i> − <i>y<\/i> = 1 與 <i>x<\/i> + 2<i>y<\/i> = 7 的交點。","a":["交點就是聯立方程式的解：第二式減第一式，3<i>y<\/i> = 6，<i>y<\/i> = 2","<i>x<\/i> = 1 + 2 = 3，交點是 (3, 2)"]}],"qs":[{"q":"通過點 (−2, 5) 且與 <i>x<\/i> 軸平行的直線是哪一條？","o":["<i>y<\/i> = 5","<i>x<\/i> = −2","<i>y<\/i> = −2","<i>x<\/i> = 5"],"a":0,"e":"與 <i>x<\/i> 軸平行是水平線，線上每一點的 <i>y<\/i> 坐標都是 5。"},{"q":"直線 3<i>x<\/i> − 2<i>y<\/i> = 12 與 <i>x<\/i> 軸的交點坐標是什麼？","o":["(4, 0)","(0, −6)","(0, 4)","(−6, 0)"],"a":0,"e":"<i>x<\/i> 軸上 <i>y<\/i> = 0：3<i>x<\/i> = 12，<i>x<\/i> = 4，交點 (4, 0)。(0, −6) 是與 <i>y<\/i> 軸的交點。"},{"q":"點 (<i>k<\/i>, 2) 在直線 2<i>x<\/i> + 3<i>y<\/i> = 4 上，<i>k<\/i> 是多少？","o":["−1","1","5","−5"],"a":0,"e":"代入：2<i>k<\/i> + 6 = 4，<i>k<\/i> = −1。"},{"q":"直線 <i>x<\/i> + <i>y<\/i> = 4 與 <i>x<\/i> − <i>y<\/i> = 2 的交點是哪一點？","o":["(3, 1)","(1, 3)","(2, 2)","(4, 2)"],"a":0,"e":"兩式相加 2<i>x<\/i> = 6，<i>x<\/i> = 3，<i>y<\/i> = 1。交點就是聯立方程式的解。"},{"q":"下列哪一點在直線 2<i>x<\/i> + <i>y<\/i> = 5 上？","o":["(1, 3)","(2, 2)","(3, 1)","(0, 4)"],"a":0,"e":"2 × 1 + 3 = 5；其他點代入分別得 6、7、4。"},{"q":"直線 <i>y<\/i> = 3 是哪一種直線？","o":["與 <i>x<\/i> 軸平行的水平線","與 <i>y<\/i> 軸平行的鉛垂線","通過原點的斜直線","<i>x<\/i> 軸本身"],"a":0,"e":"線上每一點的 <i>y<\/i> 坐標都是 3，是水平線。"},{"q":"直線 <i>x<\/i> + 2<i>y<\/i> = 8 與 <i>y<\/i> 軸的交點是哪一點？","o":["(0, 4)","(8, 0)","(0, 8)","(4, 0)"],"a":0,"e":"<i>y<\/i> 軸上 <i>x<\/i> = 0：2<i>y<\/i> = 8，<i>y<\/i> = 4。"},{"q":"通過點 (3, −1) 且與 <i>y<\/i> 軸平行的直線是哪一條？","o":["<i>x<\/i> = 3","<i>y<\/i> = −1","<i>x<\/i> = −1","<i>y<\/i> = 3"],"a":0,"e":"與 <i>y<\/i> 軸平行是鉛垂線，線上每一點的 <i>x<\/i> 坐標都是 3。"},{"q":"直線 2<i>x<\/i> − 3<i>y<\/i> = 6 與 <i>x<\/i> 軸、<i>y<\/i> 軸的交點分別是什麼？","o":["(3, 0) 與 (0, −2)","(−3, 0) 與 (0, 2)","(2, 0) 與 (0, −3)","(6, 0) 與 (0, 6)"],"a":0,"e":"令 <i>y<\/i> = 0 得 <i>x<\/i> = 3；令 <i>x<\/i> = 0 得 −3<i>y<\/i> = 6，<i>y<\/i> = −2。"},{"q":"通過 (0, 2) 與 (2, 6) 的直線方程式是哪一個？","o":["<i>y<\/i> = 2<i>x<\/i> + 2","<i>y<\/i> = 3<i>x<\/i> + 2","<i>y<\/i> = 2<i>x<\/i> + 6","<i>y<\/i> = <i>x<\/i> + 4"],"a":0,"e":"設 <i>y<\/i> = <i>ax<\/i> + <i>b<\/i>：<i>b<\/i> = 2，2<i>a<\/i> + 2 = 6，<i>a<\/i> = 2。"},{"q":"直線 <i>y<\/i> = 2<i>x<\/i> − 1 與 <i>y<\/i> = −<i>x<\/i>
