<title>數學方格簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif:ital@1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: graph-paper notebook. Sticky top bar, one reading column (max 860px); section pages read top→bottom: 重點 → 圖解 → 動手試 → 例題 → 練習 */
:root{
  --bg:#f3f6f5; --paper:#fcfdfc; --ink:#15201f; --ink-2:#465452; --muted:#6f7c7a; --line:#d9e2e0;
  --grid:rgba(15,82,87,.075); --accent:#0f5257; --accent-soft:#e2eeed; --kw:#c0281f;
  --ok:#1b7a3a; --ok-soft:#e3f3e8; --bad:#b4232c; --bad-soft:#fbe7e7;
  --s-N:#2a78d6; --s-A:#eb6834; --s-G:#1baf7a; --s-D:#eda100; --p1:#2a78d6; --p2:#eb6834;
  --fig-ink:var(--ink); --fig-soft:var(--muted); --fig-line:var(--line); --fig-paper:var(--paper);
  --ic:#e8590c; --fig-a:#dceafb; --fig-b:#ffe6d2; --fig-c:#d6f2e2;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-var:"Noto Serif","Cambria","Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --fz:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1413; --paper:#161d1c; --ink:#e9efee; --ink-2:#b5c1bf; --muted:#8a9694; --line:#2a3432;
  --grid:rgba(124,200,204,.06); --accent:#7cc8cc; --accent-soft:#1a2a2a; --kw:#ff8a7a;
  --ok:#5fd18a; --ok-soft:#173523; --bad:#ff8a8a; --bad-soft:#3a1b1d;
  --s-N:#3987e5; --s-A:#d95926; --s-G:#199e70; --s-D:#c98500; --p1:#3987e5; --p2:#d95926;
  --ic:#ff922b; --fig-a:#1d3554; --fig-b:#4d2e17; --fig-c:#1b4230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1413; --paper:#161d1c; --ink:#e9efee; --ink-2:#b5c1bf; --muted:#8a9694; --line:#2a3432;
  --grid:rgba(124,200,204,.06); --accent:#7cc8cc; --accent-soft:#1a2a2a; --kw:#ff8a7a;
  --ok:#5fd18a; --ok-soft:#173523; --bad:#ff8a8a; --bad-soft:#3a1b1d;
  --s-N:#3987e5; --s-A:#d95926; --s-G:#199e70; --s-D:#c98500; --p1:#3987e5; --p2:#d95926;
  --ic:#ff922b; --fig-a:#1d3554; --fig-b:#4d2e17; --fig-c:#1b4230; color-scheme:dark}
html.fz1{--fz:18px} html.fz2{--fz:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fz);line-height:1.8;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:6px 14px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.brand{font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-block;width:22px;height:22px;border:2px solid var(--accent);border-radius:4px;
  background-image:linear-gradient(var(--accent) 1px,transparent 1px),linear-gradient(90deg,var(--accent) 1px,transparent 1px);background-size:6px 6px;background-position:2px 2px;opacity:.85}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a,.nav button{border:1px solid transparent;background:none;border-radius:6px;padding:3px 10px;text-decoration:none;color:var(--ink-2);cursor:pointer;font-size:.92rem}
.nav a:hover,.nav button:hover{background:var(--accent-soft)}
.nav a.on{border-color:var(--accent);color:var(--accent);font-weight:500}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px}
.col{max-width:860px}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.2rem)} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}
.stack{display:grid;gap:18px}
.eyebrow{font-size:.8rem;letter-spacing:.1em;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--ink-2);background:var(--paper)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.st-N{background:var(--s-N)}.st-A{background:var(--s-A)}.st-G{background:var(--s-G)}.st-D{background:var(--s-D)}
.stars{color:var(--ic);letter-spacing:1px;font-size:.85rem}
.stars b{color:var(--line);font-weight:400}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* math markup */
i{font-family:var(--f-var);font-style:italic;font-size:1.04em;padding:0 .04em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.15;margin:0 .15em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.rt{white-space:nowrap}.rt>span{border-top:1px solid currentColor;padding:0 .1em;margin-left:.05em}
.seg,.arc{position:relative;display:inline-block;padding-top:.15em}
.seg{border-top:1px solid currentColor;line-height:1.2}
.arc::before{content:"⌒";position:absolute;left:0;right:0;top:-.72em;text-align:center;font-size:.9em;line-height:1}
.sys{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .2em}
.sys::before{content:"";width:.45em;align-self:stretch;border:1.5px solid currentColor;border-right:0;border-radius:.45em 0 0 .45em;margin-right:.3em}
.eqs{display:inline-flex;flex-direction:column;line-height:1.45}
sup,sub{font-size:.72em;line-height:0}
.kw{color:var(--kw);font-weight:700}
/* home */
.hero{display:grid;gap:10px;padding-block:8px 6px}
.lead{color:var(--ink-2);max-width:44em}
.bar4{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden}
.legend4{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--ink-2)}
.legend4 span{display:inline-flex;align-items:center;gap:6px}
.grade{display:grid;gap:12px}
.sems{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sem h3{display:flex;align-items:baseline;gap:10px}
.sem h3 a{text-decoration:none;color:var(--ink)}
.chl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.chl li a{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink)}
.chl li a:hover{background:var(--accent-soft)}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--ok);padding:0;font-size:0}
/* book */
.chapter{display:grid;gap:10px}
.pubs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.secl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.secl a{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-decoration:none;color:var(--ink)}
.secl a:hover{border-color:var(--accent)}
.secl .no{font-family:var(--f-mono);color:var(--muted);font-size:.82rem}
.secl .meta{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted)}
.done{color:var(--ok);font-weight:700}
/* section */
.crumb{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.crumb a{color:var(--muted)}
.shead{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
details.capd summary{cursor:pointer;color:var(--ink-2);font-size:.88rem}
.capids{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:4px;word-break:break-word}
.rows{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.row{display:grid;grid-template-columns:9.5em 1fr;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .lab{background:var(--accent-soft);padding:12px 14px;font-weight:700;color:var(--accent);display:flex;align-items:center}
.row .body{padding:10px 16px;min-width:0}
.row ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.tip{margin-top:8px;font-size:.92em;color:var(--ink-2);background:var(--bg);border-radius:6px;padding:6px 10px}
.tip::before{content:"小叮嚀";font-weight:700;color:var(--accent);margin-right:8px;font-size:.85em}
@media (max-width:620px){.row{grid-template-columns:1fr}.row .lab{padding:8px 14px}}
.figs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px}
.fig svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
.fig svg text{font-family:var(--f-body)}
.blk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.blk-h h2{font-size:1.15rem}
.ex{border-left:3px solid var(--accent);padding:6px 0 6px 14px;display:grid;gap:6px}
.ex+.ex{margin-top:14px}
.ex .sol{color:var(--ink-2)}
.ex details summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.ex ol{margin:6px 0 0;padding-left:1.4em}
.q{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--paper);display:grid;gap:10px}
.q .qn{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.opts button:hover{border-color:var(--accent)}
.opts button .L{font-family:var(--f-mono);color:var(--muted)}
.opts button.ok{border-color:var(--ok);background:var(--ok-soft)}
.opts button.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:6px;padding:8px 12px;font-size:.95em}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{margin-right:6px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--paper);text-decoration:none;max-width:48%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.empty{color:var(--muted);font-style:normal}
/* widgets */
.tool{display:grid;gap:12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.92rem}
.ctrl label{display:inline-flex;align-items:center;gap:6px}
.ctrl input[type=number],.ctrl input[type=text]{width:6.5em;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.ctrl input[type=range]{width:150px;accent-color:var(--accent)}
.ctrl select{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.ctrl textarea{width:100%;min-height:3.2em;padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.out{background:var(--bg);border-radius:6px;padding:8px 12px;font-size:.95em;display:grid;gap:2px}
.plot{width:100%;max-width:420px;height:auto;display:block;touch-action:manipulation}
.plot text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.plot .lbl{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
/* search & wrong book */
.search{position:relative}
.search input{width:11em;border:1px solid var(--line);border-radius:6px;padding:3px 10px;background:var(--bg)}
.sres{position:absolute;right:0;top:calc(100% + 6px);width:min(340px,86vw);max-height:60vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:20}
.sres a{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink)}
.sres a:hover,.sres a:focus{background:var(--accent-soft)}
.sres small{display:block;color:var(--muted)}
@media (max-width:700px){.top{position:static}.nav{flex-wrap:nowrap;overflow-x:auto;width:100%}.nav a,.nav button{white-space:nowrap}.search,.search input{width:100%}.brand{margin-right:0}}
.foot{margin-top:40px;font-size:.84rem;color:var(--muted);display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== two-column layout ===== */
:root{--hero:#e4f0ef;--on-accent:#ffffff;--r-lg:18px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero:#14292a;--on-accent:#0e1413}}
:root[data-theme="dark"]{--hero:#14292a;--on-accent:#0e1413}
.top-in{max-width:1320px;gap:8px 12px}
.brand span{display:grid;line-height:1.25}
.brand small{font-size:.72rem;color:var(--accent);font-weight:500}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 12px;cursor:pointer;font-size:.9rem;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.pill:hover{border-color:var(--accent)}
.pill-ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}
.page{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 72px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs a,.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 16px;text-decoration:none;color:var(--ink);font-weight:500;cursor:pointer}
.tabs a:hover,.tabs button:hover{border-color:var(--accent)}
.tabs a.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#sideBtn{display:none}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
#main{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 100px);overflow:auto;overscroll-behavior:contain}
.side-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 14px}
.side-h{display:flex;align-items:center;gap:10px;margin:0 6px 12px}
.side-h h2{font-size:1.15rem}
.grid-ic{width:18px;height:18px;flex:none;border:1.5px solid var(--accent);border-radius:3px;background-image:linear-gradient(var(--accent) 1px,transparent 1px),linear-gradient(90deg,var(--accent) 1px,transparent 1px);background-size:5px 5px;background-position:1px 1px;opacity:.85}
.gseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.gseg button{border:0;background:none;border-radius:9px;padding:7px 0;cursor:pointer;color:var(--ink-2);font-weight:500}
.gseg button.on{background:var(--accent);color:var(--on-accent)}
.side-sub{font-size:.86rem;color:var(--ink-2);font-weight:700;margin:16px 8px 4px}
.chs{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.chs .semh{font-size:.76rem;color:var(--muted);letter-spacing:.08em;margin:10px 8px 2px}
.ch{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:500}
.ch .n{width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2);flex:none}
.ch .t{min-width:0}
.ch:hover{background:var(--accent-soft)}
.ch.on{background:var(--accent-soft)}
.ch.on .n{background:var(--accent);color:var(--on-accent)}
.secs{list-style:none;margin:2px 0 6px 21px;padding:0 0 0 10px;border-left:2px solid var(--line);display:grid;gap:1px}
.secs a{display:flex;gap:6px;padding:6px 10px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-size:.92rem}
.secs a:hover{background:var(--bg)}
.secs a.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.ok{color:var(--ok);font-weight:700;margin-left:auto}
.crumb a{text-decoration:none}
.hero2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,1fr);gap:22px;align-items:center;border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;
  background-color:var(--hero);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:right top}
.hero-l{display:grid;gap:8px;min-width:0}
.hero2 h1{font-size:clamp(1.9rem,4.2vw,2.8rem);letter-spacing:.03em}
.codes{font-family:var(--f-mono);color:var(--ink-2);font-size:.86rem;align-self:center}
.secno{color:var(--ink-2);font-size:.92rem}
.sum{font-size:1.04rem;color:var(--ink)}
.exam{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(15,82,87,.08)}
.exam-l{font-size:.82rem;color:var(--muted);letter-spacing:.06em}
.exam-n{font-size:1rem}
.exam-n b{font-family:var(--f-mono);font-size:2.6rem;line-height:1;margin-right:4px}
.pubs{font-size:.86rem;color:var(--muted);margin-top:-6px}
.blk{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.blk>.blk-h h2{font-size:1.2rem}
.blk .ex{border-left:3px solid var(--accent)}
.blk-tool{background:var(--paper)}
.fig{position:relative;margin:0;padding:12px}
.zoom{position:absolute;top:8px;right:8px;font-size:.8rem;padding:2px 10px;z-index:1}
.q{background:var(--bg)}
.opts button{background:var(--paper)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-in{background:var(--paper);border-radius:16px;padding:16px;width:min(980px,100%);max-height:100%;overflow:auto;display:grid;gap:10px}
.modal-h{display:flex;justify-content:space-between;align-items:center}
#figBig svg{display:block;width:100%;height:auto}
#figBig svg text{font-family:var(--f-body)}
#sideBack{display:none}
@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);max-height:none;z-index:30;transform:translateX(-105%);transition:transform .2s ease;background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
  body.side-open .side{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  body.side-open #sideBack{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  #sideBtn{display:inline-flex}
  #mapTab{display:none}
  .hero2{grid-template-columns:1fr;padding:22px}
}
@media (max-width:700px){.top-in{display:grid;grid-template-columns:1fr auto auto}.top-in .search{grid-column:1 / -1;grid-row:2}.blk{padding:16px}.hero2{padding:18px}}
/* ===== quiz rounds & petals ===== */
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:-2px 0 12px;font-size:.92rem;color:var(--ink-2)}
.okchip{border-color:transparent;background:var(--ok-soft);color:var(--ok);font-weight:700}
.opts button:disabled{cursor:default;opacity:1;color:inherit}
.opts button.ans{border-color:var(--ok);border-style:dashed}
.q.locked .opts button:not(.ok):not(.no):not(.ans){opacity:.6}
.qsum{margin-top:14px;border-radius:14px;padding:14px 16px;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.qsum b{font-size:1.1rem}
.qsum.win{background:var(--ok-soft)}
.qsum.win b{color:var(--ok);font-size:1.3rem}
.qsum .btn{margin-left:auto}
#petalCv{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:61;
  background:var(--ok);color:var(--on-accent);font-weight:700;font-size:1.15rem;padding:12px 24px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.big{bottom:auto;top:38%;white-space:nowrap;font-size:clamp(1.5rem,5vw,2.2rem);padding:18px 34px;border-radius:24px;transform:translate(-50%,-50%) scale(.8)}
#toast.big.on{transform:translate(-50%,-50%) scale(1)}
</style>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#home"><i></i><span>數學方格簿<small>國中數學 七・八・九年級</small></span></a>
    <div class="search"><input id="q" type="search" placeholder="搜尋單元或名詞" aria-label="搜尋單元或名詞" autocomplete="off"><div class="sres" id="sres" hidden></div></div>
    <button id="fzBtn" class="pill" type="button" title="切換字級">字級：標準</button>
    <a class="pill pill-ok" href="#home">我的進度</a>
  </div>
</header>
<div class="page">
  <nav class="tabs" id="tabs" aria-label="主要頁面">
    <button id="sideBtn" type="button" aria-controls="side" aria-expanded="false">☰ 課程地圖</button>
    <a id="mapTab" href="#s1-1-1" data-n="map">課程地圖</a><a href="#home" data-n="home">會考重點</a><a href="#wrong" data-n="wrong">錯題本</a>
  </nav>
  <div class="layout">
    <aside class="side" id="side" aria-label="課程地圖"></aside>
    <main id="main"></main>
  </div>
</div>
<div id="sideBack"></div>
<div class="modal" id="figModal" hidden><div class="modal-in" role="dialog" aria-modal="true" aria-label="放大圖解"><div class="modal-h"><b>放大圖解</b><button class="btn" type="button" id="figClose">關閉</button></div><div id="figBig"></div></div></div>

<script>
const DATA = /*DATA*/null;
const SEM = ['', '七上', '七下', '八上', '八下', '九上', '九下'];
const SNAME = {N:'數與量', A:'代數與函數', G:'幾何', D:'統計與機率'};
const L4 = ['A','B','C','D'];
const SECS = [], BYK = {};
DATA.books.forEach(b => b.chs.forEach(c => c.secs.forEach(s => { const o = {...s, b, c}; o.i = SECS.length; SECS.push(o); BYK[s.k] = o; })));
const C = DATA.c;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const strip = s => String(s).replace(/<[^>]+>/g, '');

/* ---------- state ---------- */
const KEY = 'mathGrid.v1', ROUND = 6;
let st = {first:{}, wrong:{}, cor:{}, done:{}, best:{}, round:{}, fz:0};
try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {}
if (st.ans) { for (const id in st.ans) if (st.ans[id] && st.ans[id].ok) st.cor[id] = 1; delete st.ans; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function qcount(k){ return C[k] ? C[k].qs.length : 0; }
function okCount(k){ let n = 0; for (let i = 0; i < qcount(k); i++) if (st.cor[k + '.' + i]) n++; return n; }
function isDone(k){ return !!st.done[k]; }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newRound(k){
  const n = qcount(k), pick = shuffle([...Array(n).keys()]).slice(0, Math.min(ROUND, n)), p = {};
  pick.forEach(i => { p[i] = shuffle([...Array(C[k].qs[i].o.length).keys()]); });
  return (st.round[k] = {q: pick, p, a: {}});
}
function getRound(k){
  const r = st.round[k], n = qcount(k);
  if (!r || !Array.isArray(r.q) || r.q.length !== Math.min(ROUND, n) || r.q.some(i => i >= n || !r.p[i])) { newRound(k); save(); }
  return st.round[k];
}
function roundStat(k){ const r = getRound(k), done = r.q.filter(i => r.a[i]).length, ok = r.q.filter(i => r.a[i] && r.a[i].ok).length; return {r, done, ok, all: r.q.length}; }
function starHTML(n){ return '<span class="stars" title="會考重要度（依 106–115 年題數）">' + '★'.repeat(n) + '<b>' + '★'.repeat(5 - n) + '</b></span>'; }

/* ---------- font size ---------- */
const FZ = ['標準','大','特大'];
function applyFz(){ document.documentElement.classList.remove('fz1','fz2'); if (st.fz) document.documentElement.classList.add('fz' + st.fz); $('#fzBtn').textContent = '字級：' + FZ[st.fz]; }
$('#fzBtn').addEventListener('click', () => { st.fz = (st.fz + 1) % 3; save(); applyFz(); });
applyFz();

/* ---------- views ---------- */
function strandBar(){
  const t = Object.values(DATA.strand).reduce((a, v) => a + v[0], 0);
  const order = ['N','A','G','D'];
  return `<div class="bar4" role="img" aria-label="會考十年各類題數比例">${order.map(k => `<div class="st-${k}" style="flex:${DATA.strand[k][0]}"></div>`).join('')}</div>
  <div class="legend4">${order.map(k => `<span><i class="dot st-${k}" style="padding:0"></i>${SNAME[k]} ${(100 * DATA.strand[k][0] / t).toFixed(1)}%</span>`).join('')}</div>`;
}
function home(){
  const total = SECS.length, written = SECS.filter(s => C[s.k]).length;
  const doneN = SECS.filter(s => isDone(s.k)).length;
  const qAll = SECS.reduce((a, s) => a + qcount(s.k), 0), qOk = SECS.reduce((a, s) => a + okCount(s.k), 0);
  const grade = (g, b1) => `<section class="grade"><h2>${g}年級</h2><div class="sems">${[b1, b1 + 1].map(b => {
    const B = DATA.books[b - 1];
    return `<div class="card sem"><h3><a href="#b${b}">${B.sem}</a><span class="muted small">${B.vol}</span></h3><ul class="chl">${B.chs.map(c => {
      const ks = c.secs.map(s => s.k), d = ks.filter(isDone).length;
      return `<li><a href="#s${c.secs[0].k}"><i class="dot st-${c.st}" style="padding:0"></i><span>第 ${c.no} 章 ${esc(c.pub[0])}<div class="pbar"><i style="width:${100 * d / ks.length}%"></i></div></span><span class="small muted">會考 ${c.n} 題</span></a></li>`;
    }).join('')}</ul></div>`;
  }).join('')}</div></section>`;
  return `<div class="stack">
  <div class="hero"><div class="eyebrow">國中數學 ・ 108 課綱 ・ 對照翰林、康軒、南一</div><h1>數學方格簿</h1>
  <p class="lead">七到九年級共 6 冊、24 章、${total} 個單元。每個單元有重點整理、圖解或互動工具、例題和練習題，並標出這個單元在 106–115 年會考出現過幾題。</p></div>
  <div class="card stack" style="gap:10px"><div class="blk-h" style="margin:0"><h2>我的進度</h2><span class="muted small">存在這台裝置的瀏覽器</span></div>
  <p>完成 <b class="num">${doneN}</b> / ${written} 個單元（隨機抽的一輪題目全對才算完成）；題庫 ${qAll} 題中答對過 <b class="num">${qOk}</b> 題。${Object.keys(st.wrong).length ? `錯題本還有 <a href="#wrong">${Object.keys(st.wrong).length} 題</a>。` : ''}</p></div>
  <div class="card stack" style="gap:8px"><h2>會考十年出題比例</h2><p class="muted small">106–115 年正式會考 275 題，依 108 課綱主題歸類。顏色也標在每一章前面。</p>${strandBar()}</div>
  ${grade('七', 1)}${grade('八', 3)}${grade('九', 5)}
  <div class="foot"><p>內容依 108 課綱與三家出版社的章節順序整理，文字、例題與練習題皆為本站自編。會考題號可到國中教育會考網站查詢原題。</p><p>答題紀錄只存在這台裝置的瀏覽器，清除瀏覽資料會一併清除。</p></div>
  </div>`;
}
function book(b){
  const B = DATA.books[b - 1];
  return `<div class="stack"><div class="crumb"><a href="#home">首頁</a><span>›</span><span>${B.sem}（${B.vol}）</span></div>
  <h1>${B.sem}・${B.vol}</h1>
  ${B.chs.map(c => `<section class="chapter card"><div><div class="eyebrow">第 ${c.no} 章 ・ ${SNAME[c.st]}</div><h2>${esc(c.pub[0])}</h2></div>
    <div class="pubs"><span>翰林：${esc(c.pub[0])}</span><span>康軒：${esc(c.pub[1])}</span><span>南一：${esc(c.pub[2])}</span><span>會考 10 年 ${c.n} 題</span></div>
    <div class="secl">${c.secs.map(s => `<a href="#s${s.k}"><span class="no">${s.no || '第 ' + c.no + ' 章'}</span><b>${esc(s.t)}</b><span class="meta"><span>${starHTML(s.imp)}</span><span>${isDone(s.k) ? '<span class="done">✓ 完成</span>' : C[s.k] ? '答對過 ' + okCount(s.k) + ' / ' + qcount(s.k) + ' 題' : '整理中'}</span></span></a>`).join('')}</div>
  </section>`).join('')}
  <div class="pager">${b > 1 ? `<a href="#b${b - 1}">← ${SEM[b - 1]}</a>` : '<span></span>'}${b < 6 ? `<a href="#b${b + 1}">${SEM[b + 1]} →</a>` : ''}</div></div>`;
}
const CHEER = ['答對了！', '太棒了！', '好厲害！', '完全正確！', '漂亮！', '繼續保持！'];
function qHTML(k, i, q, n, perm, a, mode){
  const id = k + '.' + i, disp = perm.map(o => o);
  return `<div class="q${a ? ' locked' : ''}" data-q="${id}" data-m="${mode}" data-p="${perm.join('')}"><p><span class="qn">${n}.</span>${q.q}</p>
  <div class="opts">${disp.map((o, j) => `<button type="button" data-i="${o}"${a ? ' disabled' : ''} class="${a ? (o === a.c ? (a.ok ? 'ok' : 'no') : (!a.ok && o === q.a ? 'ans' : '')) : ''}"><span class="L">(${L4[j]})</span><span>${q.o[o]}</span></button>`).join('')}</div>
  <div class="fb${a ? (a.ok ? ' ok' : ' no') : ''}"${a ? '' : ' hidden'}>${a ? fbHTML(q, a.ok, perm) : ''}</div></div>`;
}
function fbHTML(q, ok, perm){ return ok ? `<b>${CHEER[Math.floor(Math.random() * CHEER.length)]}</b>${q.e}` : `<b>再想想。</b>正確答案是 (${L4[perm.indexOf(q.a)]})。${q.e}`; }
function quizHTML(k){
  const {r, done, ok, all} = roundStat(k), d = C[k];
  return `<div class="blk-h"><h2>練習</h2><span class="muted small">題庫 ${d.qs.length} 題，每次隨機抽 ${all} 題</span><button class="btn" type="button" data-act="new" style="margin-left:auto">換一組題目</button></div>
  <div class="qbar"><span id="qprog">${progText(done, ok, all)}</span>${isDone(k) ? '<span class="chip okchip">✓ 曾經整輪全對</span>' : ''}</div>
  <div class="stack" style="gap:12px">${r.q.map((i, j) => qHTML(k, i, d.qs[i], j + 1, r.p[i], r.a[i], 'r')).join('')}</div>
  <div id="qsum">${done === all ? sumHTML(ok, all) : ''}</div>`;
}
function progText(done, ok, all){ return `本輪已作答 ${done} / ${all} 題，答對 ${ok} 題`; }
function sumHTML(ok, all){
  return ok === all ? `<div class="qsum win"><b>${all} 題全對！太厲害了！</b><span>這個單元完成了，可以換一組題目再挑戰。</span><button class="btn" type="button" data-act="new">再挑 ${all} 題</button></div>`
    : `<div class="qsum"><b>本輪答對 ${ok} / ${all} 題</b><span>答錯的題目已收進錯題本。再挑一組，目標 ${all} 題全對！</span><button class="btn" type="button" data-act="new">再挑 ${all} 題</button></div>`;
}
function section(k){
  const s = BYK[k], c = s.c, B = DATA.books[s.b.b - 1], d = C[k];
  const i = s.i, prev = SECS[i - 1], next = SECS[i + 1], g = 6 + Math.ceil(B.b / 2), idx = c.secs.findIndex(x => x.k === k) + 1;
  let h = `<div class="stack"><div class="crumb"><a href="#b${B.b}">${'七八九'[g - 7]}年級</a><span>/</span><span>${esc(c.pub[0])}</span></div>
  <div class="hero2"><div class="hero-l">
    <div class="chips"><span class="chip"><i class="dot st-${s.st}" style="padding:0"></i># ${SNAME[s.st]}</span><span class="codes">${esc(s.codes)}</span></div>
    <h1>${esc(s.t)}</h1>
    <p class="secno">${B.sem}・第 ${c.no} 章　第 ${idx} 節／共 ${c.secs.length} 節</p>
    ${d && d.sum ? `<p class="sum">${d.sum}</p>` : ''}
  </div>
  <div class="hero-r"><div class="exam"><span class="exam-l">106–115 年會考</span><span class="exam-n"><b>${s.cap.length}</b> 題</span><span>重要度 ${starHTML(s.imp)}</span>
    ${s.cap.length ? `<details class="capd"><summary>看題號（115-4 是 115 年第 4 題）</summary><div class="capids">${s.cap.map(x => x.replace('非', '（非選）').replace('組', '（題組）')).join('、')}</div></details>` : '<span class="small muted">十年內沒有直接出題，但常是其他單元的基礎。</span>'}
  </div></div></div>
  <p class="pubs">翰林：第 ${c.no} 章 ${esc(c.pub[0])}｜康軒：${esc(c.pub[1])}｜南一：${esc(c.pub[2])}</p>`;
  if (!d) {
    h += `<section class="blk"><p class="empty">這個單元的重點整理還在製作中。</p></section>`;
  } else {
    h += `<section class="blk"><div class="blk-h"><h2>重點整理</h2></div><div class="rows">${d.rows.map(r => `<div class="row"><div class="lab">${r.h}</div><div class="body"><ul>${r.li.map(x => `<li>${x}</li>`).join('')}</ul>${r.tip.map(t => `<p class="tip">${t}</p>`).join('')}</div></div>`).join('')}</div></section>`;
    if (d.fig.length) h += `<section class="blk blk-fig"><div class="blk-h"><h2>圖解</h2><span class="muted small">點「放大」可以看大圖</span></div><div class="figs">${d.fig.map(f => `<figure class="fig"><button class="btn zoom" type="button" data-fig="${f}">放大</button>${DATA.figs[f]}</figure>`).join('')}</div></section>`;
    if (d.w && W[d.w]) h += `<section class="blk blk-tool"><div class="blk-h"><h2>動手試試</h2><span class="muted small">${esc(WN[d.w] || '')}</span></div><div class="tool" data-w="${d.w}" data-o="${esc(d.wo || '')}"></div></section>`;
    if (d.ex.length) h += `<section class="blk"><div class="blk-h"><h2>例題</h2></div>${d.ex.map((e, j) => `<div class="ex"><p><b>例 ${j + 1}</b>　${e.q}</p><details><summary>看解法</summary><ol class="sol">${e.a.map(x => `<li>${x}</li>`).join('')}</ol></details></div>`).join('')}</section>`;
    if (d.qs.length) h += `<section class="blk" id="quiz">${quizHTML(k)}</section>`;
  }
  h += `<div class="pager">${prev ? `<a href="#s${prev.k}">← ${esc(prev.t)}</a>` : '<span></span>'}${next ? `<a href="#s${next.k}">${esc(next.t)} →</a>` : ''}</div></div>`;
  return h;
}
function wrongView(){
  const ids = Object.keys(st.wrong).filter(id => { const [k, i] = id.split('.'); return C[k] && C[k].qs[+i]; });
  if (!ids.length) return `<div class="stack col"><h1>錯題本</h1><div class="card"><p>目前沒有錯題。答錯的題目會自動收進來，之後答對就會移出。</p></div></div>`;
  const by = {};
  ids.forEach(id => { const k = id.split('.')[0]; (by[k] = by[k] || []).push(+id.split('.')[1]); });
  return `<div class="stack col"><h1>錯題本</h1><p class="muted">共 ${ids.length} 題。重新作答，答對的題目會移出錯題本（重新整理頁面後消失）。</p>
  ${SECS.filter(s => by[s.k]).map(s => `<section class="blk stack" style="gap:10px"><h2><a href="#s${s.k}">${SEM[s.b.b]} ${s.no} ${esc(s.t)}</a></h2>${by[s.k].sort((a, b) => a - b).map((i, j) => { const q = C[s.k].qs[i]; return qHTML(s.k, i, q, j + 1, shuffle([...Array(q.o.length).keys()]), null, 'w'); }).join('')}</section>`).join('')}</div>`;
}

/* ---------- sidebar ---------- */
let sideG = 7, curKey = null;
function renderSide(act){
  const b1 = (sideG - 7) * 2 + 1, chs = [];
  [b1, b1 + 1].forEach(b => DATA.books[b - 1].chs.forEach(c => chs.push({c, b})));
  const actCh = act ? BYK[act].c : null, gn = '七八九'[sideG - 7];
  let h = `<div class="side-card"><div class="side-h"><span class="grid-ic" aria-hidden="true"></span><h2>課程地圖</h2></div>
  <div class="gseg" role="group" aria-label="選擇年級">${[7, 8, 9].map(g => `<button type="button" data-g="${g}" class="${g === sideG ? 'on' : ''}" aria-pressed="${g === sideG}">${'七八九'[g - 7]}年級</button>`).join('')}</div>
  <div class="side-sub">${gn}年級 ・ ${chs.length} 章</div><ol class="chs">`;
  let lastB = 0;
  chs.forEach(({c, b}, n) => {
    if (b !== lastB) { h += `<li class="semh">${SEM[b]}・${DATA.books[b - 1].vol}</li>`; lastB = b; }
    const on = c === actCh, done = c.secs.every(s => isDone(s.k));
    h += `<li><a class="ch${on ? ' on' : ''}" href="#s${c.secs[0].k}"${on ? ' aria-current="true"' : ''}><span class="n">${n + 1}</span><span class="t">${esc(c.pub[0])}</span>${done ? '<span class="ok" title="全部完成">✓</span>' : ''}</a>`;
    if (on) h += `<ul class="secs">${c.secs.map(s => `<li><a class="${s.k === act ? 'on' : ''}" href="#s${s.k}"${s.k === act ? ' aria-current="page"' : ''}>${esc(s.t)}${isDone(s.k) ? ' <span class="ok">✓</span>' : ''}</a></li>`).join('')}</ul>`;
    h += '</li>';
  });
  $('#side').innerHTML = h + '</ol></div>';
}
$('#side').addEventListener('click', e => {
  const g = e.target.closest('.gseg button');
  if (g) { sideG = +g.dataset.g; renderSide(curKey); return; }
  if (e.target.closest('a')) closeSide();
});
function closeSide(){ document.body.classList.remove('side-open'); $('#sideBtn').setAttribute('aria-expanded', 'false'); }
$('#sideBtn').addEventListener('click', () => { const o = document.body.classList.toggle('side-open'); $('#sideBtn').setAttribute('aria-expanded', String(o)); });
$('#sideBack').addEventListener('click', closeSide);

/* ---------- figure zoom ---------- */
const figModal = $('#figModal');
function closeFig(){ figModal.hidden = true; $('#figBig').innerHTML = ''; }
$('#figClose').addEventListener('click', closeFig);
figModal.addEventListener('click', e => { if (e.target === figModal) closeFig(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!figModal.hidden) closeFig(); else closeSide(); } });

/* ---------- router ---------- */
function route(){
  const h = location.hash.slice(1) || 'home';
  let html, nav = 'home', act = null;
  if (/^b[1-6]$/.test(h)) { const b = +h[1]; html = book(b); nav = 'map'; sideG = 6 + Math.ceil(b / 2); }
  else if (h[0] === 's' && BYK[h.slice(1)]) { const s = BYK[h.slice(1)]; act = s.k; html = section(s.k); nav = 'map'; sideG = 6 + Math.ceil(s.b.b / 2); st.last = s.k; save(); }
  else if (h === 'wrong') { html = wrongView(); nav = 'wrong'; }
  else html = home();
  curKey = act;
  $('#main').innerHTML = html;
  renderSide(act);

const PCOL = ['#ff8fab', '#ffb3c6', '#ffd166', '#f4a261', '#90e0ef', '#b5e48c', '#cdb4db', '#ff6b6b'];

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!pcv) { pcv = document.createElement('canvas'); pcv.id = 'petalCv'; pcv.setAttribute('aria-hidden', 'true'); document.body.appendChild(pcv); pctx = pcv.getContext('2d'); }

}

/* 一元二次方程式 */

    const s = ($('#' + p + 't').value.match(/-?\d+(\.\d+)?/g) || []).map(Number).sort((x, y) => x - y), n = s.length, o = $('#' + p + 'o');
    if (n < 4) { o.innerHTML = '<div class="out">請至少輸入 4 個數</div>'; return; }
    const lo = s.slice(0, Math.floor(n / 2)), hi = s.slice(Math.ceil(n / 2)), q1 = median(lo), q2 = median(s), q3 = median(hi), mn = s[0], mx = s[n - 1];
    const span = mx - mn || 1, X = v => 20 + (v - mn) / span * 380;
    const svg = `<svg class="plot" viewBox="0 0 420 92" role="img" aria-label="盒狀圖"><line x1="${X(mn)}" x2="${X(q1)}" y1="40" y2="40" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(q3)}" x2="${X(mx)}" y1="40" y2="40" stroke="var(--ink)" stroke-width="1.5"/>
      <rect x="${X(q1)}" y="22" width="${Math.max(1, X(q3) - X(q1))}" height="36" fill="var(--fig-a)" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(q2)}" x2="${X(q2)}" y1="22" y2="58" stroke="var(--ic)" stroke-width="2.5"/>
      ${[mn, mx].map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="30" y2="50" stroke="var(--ink)" stroke-width="1.5"/>`).join('')}
      ${[[mn, '最小'], [q1, 'Q₁'], [q2, 'Q₂'], [q3, 'Q₃'], [mx, '最大']].map(([v, t], i) => `<text x="${X(v)}" y="${i % 2 ? 14 : 76}" text-anchor="middle">${t} ${fmt(v)}</text>`).join('')}</svg>`;
    o.innerHTML = svg + `<div class="out"><span>由小到大（${n} 個）：${s.join('、')}</span><span>Q<sub>2</sub>（中位數）= ${fmt(q2)}；前半段 ${lo.join('、')} 的中位數 Q<sub>1</sub> = ${fmt(q1)}；後半段 ${hi.join('、')} 的中位數 Q<sub>3</sub> = ${fmt(q3)}</span><span>全距 = ${fmt(mx)} − ${fmt(mn)} = <b>${fmt(mx - mn)}</b>；四分位距 = Q<sub>3</sub> − Q<sub>1</sub> = <b>${fmt(q3 - q1)}</b></span><span class="small muted">資料個數是奇數時，前後半段都不含中位數本身。</span></div>`;
  });
};
/* 機率模擬 */
WN.prob = '重複做實驗，比較實際出現的比例與理論機率';
W.prob = el => {
  const p = 'w' + (++uid), EXP = [
    ['擲一枚硬幣，出現正面', 1, 2, () => Math.random() < 0.5],
    ['擲一顆骰子，出現 6 點', 1, 6, () => Math.floor(Math.random() * 6) === 5],
    ['擲兩顆骰子，點數和為 7', 6, 36, () => Math.floor(Math.random() * 6) + Math.floor(Math.random() * 6) + 2 === 7],
    ['擲兩枚硬幣，兩枚都是正面', 1, 4, () => Math.random() < 0.5 && Math.random() < 0.5]];
  let n = 0, hit = 0;
  el.innerHTML = `<div class="ctrl"><label><select id="${p}e">${EXP.map((x, i) => `<option value="${i}">${x[0]}</option>`).join('')}</select></label></div><div class="ctrl">${[10, 100, 1000].map(k => `<button class="btn" type="button" data-k="${k}">做 ${k} 次</button>`).join('')}<button class="btn" type="button" data-k="0">重設</button></div><div class="out" id="${p}o"></div>`;
  const show = () => { const e = EXP[+$('#' + p + 'e').value], th = e[1] / e[2];
    $('#' + p + 'o').innerHTML = `<span>理論機率 = ${e[1]} / ${e[2]} ≈ <b>${th.toFixed(4)}</b></span><span>已做 ${n} 次，成功 ${hit} 次，相對次數 = ${n ? (hit / n).toFixed(4) : '—'}</span>
      <svg class="plot" viewBox="0 0 420 50" role="img" aria-label="相對次數與理論機率"><rect x="10" y="12" width="400" height="14" fill="var(--line)"/><rect x="10" y="12" width="${n ? 400 * hit / n : 0}" height="14" fill="var(--p1)"/><line x1="${10 + 400 * th}" x2="${10 + 400 * th}" y1="6" y2="32" stroke="var(--ic)" stroke-width="2.5"/><text x="${10 + 400 * th}" y="45" text-anchor="middle">理論值</text></svg>
      <span class="small muted">次數越多，相對次數通常越接近理論機率，但每次實驗結果都可能不同。</span>`; };
  el.addEventListener('click', ev => { const b = ev.target.closest('button[data-k]'); if (!b) return; const k = +b.dataset.k, e = EXP[+$('#' + p + 'e').value]; if (!k) { n = hit = 0; } else { for (let i = 0; i < k; i++) if (e[3]()) hit++; n += k; } show(); });
  el.addEventListener('change', () => { n = hit = 0; show(); }); show();
};
/* 立體圖形 */
WN.solid = '選一種立體圖形，輸入尺寸，算表面積與體積';
W.solid = el => {
  const p = 'w' + (++uid), n = (id, l, v) => `<label>${l} <input type="number" id="${p}${id}" value="${v}" min="0" step="any" style="width:4.5em"></label>`;
  const cone = el.dataset.o === 'cone';
  mount(el, `<div class="ctrl"><label><select id="${p}k"><option value="0">長方體（直角柱）</option><option value="1">直圓柱</option><option value="2"${cone ? ' selected' : ''}>正四角錐</option><option value="3">直圓錐</option></select></label></div><div class="ctrl" id="${p}in"></div><div class="out" id="${p}o"></div>`, () => {
    const k = +$('#' + p + 'k').value, box = $('#' + p + 'in');
    const want = [['長 a', '寬 b', '高 h'], ['底面半徑 r', '高 h'], ['底邊 a', '斜高 l'], ['底面半徑 r', '母線長 l']][k];
    if (box.dataset.k !== String(k)) { box.dataset.k = k; box.innerHTML = want.map((l, i) => n('v' + i, l, [[6, 4, 5], [3, 10], [6, 5], [3, 5]][k][i])).join(''); }
    const v = want.map((_, i) => Math.max(0, parseFloat($('#' + p + 'v' + i).value) || 0)), o = $('#' + p + 'o');
    if (k === 0) { const [a, b, h] = v; o.innerHTML = `<span>表面積 = 2(ab + bh + ah) = 2(${a * b} + ${b * h} + ${a * h}) = <b>${fmt(2 * (a * b + b * h + a * h))}</b></span><span>體積 = 底面積 × 高 = ${a} × ${b} × ${h} = <b>${fmt(a * b * h)}</b></span>`; }
    else if (k === 1) { const [r, h] = v; o.innerHTML = `<span>展開圖：兩個半徑 ${r} 的圓 + 長 2πr、寬 ${h} 的長方形</span><span>表面積 = 2πr² + 2πrh = ${fmt(2 * r * r)}π + ${fmt(2 * r * h)}π = <b>${fmt(2 * r * r + 2 * r * h)}π</b> ≈ ${fmt((2 * r * r + 2 * r * h) * Math.PI)}</span><span>體積 = 底面積 × 高 = πr²h = <b>${fmt(r * r * h)}π</b> ≈ ${fmt(r * r * h * Math.PI)}</span>`; }
    else if (k === 2) { const [a, l] = v; o.innerHTML = `<span>展開圖：一個邊長 ${a} 的正方形 + 4 個底 ${a}、高 ${l} 的等腰三角形</span><span>表面積 = a² + 4 × (a × l ÷ 2) = ${fmt(a * a)} + ${fmt(2 * a * l)} = <b>${fmt(a * a + 2 * a * l)}</b></span>`; }
    else { const [r, l] = v; o.innerHTML = l <= r ? '<span>母線長必須大於底面半徑</span>' : `<span>展開圖：底面圓 + 半徑 ${l} 的扇形，扇形弧長 = 底面圓周長 2πr</span><span>扇形圓心角 = 360° × r ÷ l = 360° × ${r} ÷ ${l} = <b>${fmt(360 * r / l)}°</b></span><span>側面積 = πrl = ${fmt(r * l)}π；表面積 = πr² + πrl = <b>${fmt(r * r + r * l)}π</b> ≈ ${fmt((r * r + r * l) * Math.PI)}</span>`; }
  });
};

route();
</script>
